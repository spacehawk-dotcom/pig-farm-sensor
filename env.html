<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성암농장 실시간 모니터링</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        input[type="date"] { color-scheme: light; }
    </style>
</head>
<body class="bg-gray-100 p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        <!-- 🌟 헤더 수정: 사육현황 바로가기 버튼 추가 -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div class="flex items-center gap-3 w-full md:w-auto">
                <a href="index.html" class="bg-gray-800 text-white px-3 py-2 rounded-lg text-sm font-bold shadow-md hover:bg-gray-700 active:scale-95 transition-all shrink-0 flex items-center">
                    ⬅️ 사육현황
                </a>
                <h1 class="text-xl md:text-2xl font-bold text-gray-800">🐖 환경 모니터링</h1>
            </div>
            <div id="status-indicator" class="bg-blue-100 text-blue-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors duration-300 self-end md:self-auto whitespace-nowrap">
                대기 중...
            </div>
        </header>

        <div id="card-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <!-- 과거 기록 팝업창 -->
    <div id="history-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4 transition-opacity">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden">
            <div class="bg-green-600 p-4 text-white flex justify-between items-center">
                <h3 id="modal-title" class="text-lg font-bold">과거 기록 (그래프)</h3>
                <button onclick="closeModal()" class="text-white hover:text-gray-200 text-2xl font-bold leading-none">&times;</button>
            </div>
            
            <div class="bg-green-50 p-4 border-b border-green-100 flex flex-col sm:flex-row items-center justify-between gap-3">
                <div class="flex items-center gap-2">
                    <input type="date" id="start-date" class="border border-green-200 rounded-lg px-2 py-1.5 text-xs font-bold outline-none focus:border-green-500">
                    <span class="text-green-500 font-bold">~</span>
                    <input type="date" id="end-date" class="border border-green-200 rounded-lg px-2 py-1.5 text-xs font-bold outline-none focus:border-green-500">
                    <button id="search-btn" class="bg-green-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-green-700 shadow active:scale-95 transition-all">기간 평균 조회</button>
                    <button id="reset-btn" class="bg-white text-green-700 border border-green-200 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-green-50 shadow-sm active:scale-95 transition-all">오늘(당일)</button>
                </div>
                <button id="excel-btn" class="bg-white border border-green-600 text-green-700 px-4 py-1.5 text-xs font-black rounded-lg shadow-sm hover:bg-green-50 active:scale-95 transition-all flex items-center gap-2">
                    📥 현재 화면 엑셀 다운로드
                </button>
            </div>

            <div class="flex-1 overflow-y-auto bg-gray-50 p-4">
                <div class="flex justify-between items-center mb-2">
                    <p id="view-mode-text" class="text-xs font-bold text-gray-500 bg-gray-200 px-2 py-1 rounded-md">모드 준비 중...</p>
                </div>
                <div class="min-h-[300px] mb-6 relative">
                    <canvas id="historyChart"></canvas>
                </div>
                
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="w-full text-center text-xs">
                        <thead class="bg-gray-100 text-gray-600 sticky top-0 border-b shadow-sm">
                            <tr>
                                <th class="py-3 font-semibold">측정 시간 / 날짜</th>
                                <th class="py-3 font-semibold">온도</th>
                                <th class="py-3 font-semibold">습도</th>
                                <th class="py-3 font-semibold">잔여 마리수</th>
                                <th class="py-3 font-semibold">일령</th>
                            </tr>
                        </thead>
                        <tbody id="history-table-body" class="divide-y divide-gray-200 bg-white text-gray-700"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBlptGu2gTAQKVy_yDomKkNEd_el6c1PL0",
            authDomain: "sungamfarm.firebaseapp.com",
            projectId: "sungamfarm",
            databaseURL: "https://sungamfarm-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

        const rtdb = firebase.database();
        const firestore = firebase.firestore();
        const auth = firebase.auth();

        const cardContainer = document.getElementById('card-container');
        const statusIndicator = document.getElementById('status-indicator');
        let sensorData = {}; 
        let farmData = {};   
        let chartInstance = null;

        rtdb.ref('sensor_logs').on('value', (snapshot) => {
            sensorData = snapshot.val() || {};
            renderCards();
        });

        auth.signInAnonymously().then(() => {
            firestore.collection('farms/sungamfarm/weaning').onSnapshot(snap => {
                snap.forEach(doc => { farmData['이유_' + doc.id.split('_')[1] + '배치'] = extractFarmInfo(doc.data()); });
                renderCards();
            });
            firestore.collection('farms/sungamfarm/grower').onSnapshot(snap => {
                snap.forEach(doc => { farmData['육성_' + doc.id.split('_')[1] + '배치'] = extractFarmInfo(doc.data()); });
                renderCards();
            });
        });

        function extractFarmInfo(data) {
            let count = data.pigs || 0;
            let allDates = [];
            if (data.penDates) allDates = data.penDates.filter(d => d.trim() !== '');
            if (allDates.length === 0) {
                if (data.date) allDates.push(data.date);
                if (data.weaningDate) allDates.push(data.weaningDate);
            }

            let dateRange = "--";
            let targetTempHtml = "";
            let startRawDate = null;

            if (allDates.length > 0) {
                allDates.sort();
                startRawDate = allDates[0];
                const startStr = startRawDate;
                const endStr = allDates[allDates.length - 1];

                const startDisp = startStr.substring(5).replace('-', '.');
                const endDisp = endStr.substring(5).replace('-', '.');
                dateRange = startDisp === endDisp ? startDisp : `${startDisp} ~ ${endDisp}`;

                const startDate = new Date(startStr);
                startDate.setHours(0,0,0,0);
                const today = new Date();
                today.setHours(0,0,0,0);
                const diffDays = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));
                const currentAge = diffDays + 20;

                let targetTemp = 30.0 - ((currentAge - 20) * 0.15);
                targetTemp = Math.max(18.0, Math.min(30.0, targetTemp));

                targetTempHtml = `<span class="bg-orange-50 text-orange-600 text-[11px] px-2 py-1 rounded-lg border border-orange-100 font-black ml-2 shadow-sm">권장 ${targetTemp.toFixed(1)}°C</span>`;
            }
            return { count, dateRange, targetTempHtml, startRawDate };
        }

        // 습도 교정 함수
        function fixHumidity(rawHumi) {
            if (rawHumi === undefined || rawHumi === '--') return '--';
            let h = Number(rawHumi);
            return h > 100 ? h / 10 : h;
        }

        function renderCards() {
            if (Object.keys(sensorData).length === 0) return;
            cardContainer.innerHTML = '';
            const sortedKeys = Object.keys(sensorData).sort((a,b) => a.localeCompare(b));

            sortedKeys.forEach(zoneName => {
                const zone = sensorData[zoneName];
                const fData = farmData[zoneName] || { count: 0, dateRange: '--', targetTempHtml: '' };
                const isExternal = zoneName.includes('외부온도');
                
                const infoTagsHtml = isExternal ? '' : `
                    <div class="flex gap-2 mt-1">
                        <span class="bg-blue-50 text-blue-600 text-[10px] px-2 py-0.5 rounded-full font-bold">🐖 ${fData.count}두</span>
                        <span class="bg-gray-100 text-gray-600 text-[10px] px-2 py-0.5 rounded-full font-medium">📅 ${fData.dateRange}</span>
                    </div>
                `;
                
                const targetTempBadge = isExternal ? '' : fData.targetTempHtml;
                let timeColor = "text-gray-400 text-xs";
                let tempVal = zone.temp !== undefined ? zone.temp : '--';
                
                let humiVal = fixHumidity(zone.humi) !== '--' ? fixHumidity(zone.humi).toFixed(1) : '--';
                
                const timeStr = zone.timestamp || '정보 없음';

                if (timeStr.includes('수면') || timeStr.includes('실패') || timeStr.includes('support')) timeColor = "text-red-500 font-bold text-xs";

                const cardHTML = `
                    <div class="card cursor-pointer hover:bg-green-50 transition-all duration-300 transform hover:-translate-y-1 border border-transparent hover:border-green-200" onclick="openHistory('${zoneName}')">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <div class="flex items-center"><h2 class="text-xl font-bold text-gray-800">${zoneName}</h2>${targetTempBadge}</div>
                                ${infoTagsHtml}
                            </div>
                            <span class="${timeColor} text-right">${timeStr}</span>
                        </div>
                        <div class="flex justify-around items-center mt-4">
                            <div class="text-center">
                                <p class="text-xs text-gray-400 mb-1 font-medium text-center">현재 온도</p>
                                <p class="text-4xl font-black text-blue-600">${tempVal}<span class="text-lg ml-0.5">°C</span></p>
                            </div>
                            <div class="text-center border-l pl-6">
                                <p class="text-xs text-gray-400 mb-1 font-medium text-center">현재 습도</p>
                                <p class="text-4xl font-black text-green-500">${humiVal}<span class="text-lg ml-0.5">%</span></p>
                            </div>
                        </div>
                    </div>
                `;
                cardContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        function calculateAge(startStr, timestamp) {
            if (!startStr) return "-";
            const startDate = new Date(startStr);
            startDate.setHours(0,0,0,0);
            
            let currentDate;
            if (timestamp.includes('. ')) {
                const parts = timestamp.split('. ');
                const currentYear = parts[0];
                const currentMonth = parts[1].padStart(2, '0');
                const currentDay = parts[2].replace('.', '').padStart(2, '0');
                currentDate = new Date(`${currentYear}-${currentMonth}-${currentDay}`);
            } else {
                currentDate = new Date(timestamp);
            }
            currentDate.setHours(0,0,0,0);

            const diffDays = Math.floor((currentDate - startDate) / (1000 * 60 * 60 * 24));
            return diffDays + 20;
        }

        function openHistory(zoneName) {
            document.getElementById('modal-title').innerText = `📊 ${zoneName} 온도/습도 흐름`;
            document.getElementById('history-modal').classList.remove('hidden');

            const fData = farmData[zoneName] || { startRawDate: null };
            const tbody = document.getElementById('history-table-body');
            const viewModeText = document.getElementById('view-mode-text');
            let currentViewData = []; 

            const today = new Date();
            const lastWeek = new Date();
            lastWeek.setDate(today.getDate() - 7);
            document.getElementById('end-date').value = today.toISOString().split('T')[0];
            document.getElementById('start-date').value = lastWeek.toISOString().split('T')[0];

            function updateChartAndTable(dataArray, isDailyAvg) {
                tbody.innerHTML = '';
                let labels = [], tempData = [], humiData = [];

                if (dataArray.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="py-8 text-gray-500">해당 기간의 데이터가 없습니다.</td></tr>';
                }

                const tableData = [...dataArray].reverse();
                tableData.forEach(item => {
                    const age = calculateAge(fData.startRawDate, item.originalDate || item.timestamp);
                    const row = `
                        <tr class="hover:bg-gray-50">
                            <td class="py-2 text-[10px]">${item.timestamp}${isDailyAvg ? '<br><span class="text-green-500">(일일 평균)</span>' : ''}</td>
                            <td class="py-2 font-bold text-blue-600">${item.temp}°C</td>
                            <td class="py-2 font-bold text-green-600">${item.humi}%</td>
                            <td class="py-2 font-black text-gray-800">${item.count}두</td>
                            <td class="py-2 font-medium text-orange-600">${age}일령</td>
                        </tr>
                    `;
                    tbody.insertAdjacentHTML('beforeend', row);
                });

                if (!isDailyAvg) {
                    for(let h=0; h<24; h++) {
                        let ampm = h < 12 ? '오전' : '오후';
                        let h12 = h % 12 === 0 ? 12 : h % 12;
                        for(let m=0; m<60; m+=15) {
                            labels.push(`${ampm} ${h12}:${m.toString().padStart(2, '0')}`);
                        }
                    }
                    tempData = new Array(96).fill(null);
                    humiData = new Array(96).fill(null);

                    dataArray.forEach(item => {
                        try {
                            let timeParts = item.timestamp.split(' ');
                            let ampm = timeParts[timeParts.length - 2];
                            let hms = timeParts[timeParts.length - 1];
                            let [hh, mm] = hms.split(':').map(Number);
                            let hour24 = ampm === '오후' && hh !== 12 ? hh + 12 : (ampm === '오전' && hh === 12 ? 0 : hh);
                            let slotIndex = Math.round((hour24 * 60 + mm) / 15);
                            if (slotIndex >= 96) slotIndex = 95; 
                            
                            if (slotIndex >= 0 && slotIndex < 96) {
                                tempData[slotIndex] = Number(item.temp);
                                humiData[slotIndex] = Number(item.humi);
                            }
                        } catch (e) { console.error(e); }
                    });
                } else {
                    dataArray.forEach(item => {
                        const dParts = item.timestamp.split('-');
                        labels.push(`${parseInt(dParts[1])}/${parseInt(dParts[2])}`);
                        tempData.push(Number(item.temp));
                        humiData.push(Number(item.humi));
                    });
                }

                const ctx = document.getElementById('historyChart').getContext('2d');
                if (chartInstance) chartInstance.destroy();
                
                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            { 
                                label: '온도 (°C)', 
                                data: tempData, 
                                borderColor: 'rgb(37, 99, 235)', 
                                borderWidth: 2, 
                                fill: false, 
                                yAxisID: 'y', 
                                tension: 0.3, 
                                pointRadius: isDailyAvg ? 4 : 0, 
                                pointHitRadius: 10, 
                                spanGaps: true 
                            },
                            { 
                                label: '습도 (%)', 
                                data: humiData, 
                                borderColor: 'rgb(34, 197, 94)', 
                                borderWidth: 2, 
                                fill: false, 
                                yAxisID: 'y1', 
                                tension: 0.3, 
                                pointRadius: isDailyAvg ? 4 : 0, 
                                pointHitRadius: 10, 
                                spanGaps: true 
                            }
                        ]
                    },
                    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
                        scales: {
                            x: { ticks: { maxTicksLimit: !isDailyAvg ? 12 : 8 } }, 
                            y: { 
                                type: 'linear', 
                                display: true, 
                                position: 'left', 
                                title: { display: true, text: '온도 (°C)' },
                                min: 18, 
                                max: 40 
                            },
                            y1: { 
                                type: 'linear', 
                                display: true, 
                                position: 'right', 
                                title: { display: true, text: '습도 (%)' }, 
                                grid: { drawOnChartArea: false },
                                min: 30,
                                max: 100 
                            }
                        }
                    }
                });
            }

            function loadDefaultData() {
                viewModeText.innerText = "당일 24시간 흐름 (오늘 00:00 ~ 23:59)";
                tbody.innerHTML = '<tr><td colspan="5" class="py-8 text-gray-500 font-medium">당일 기록을 불러오는 중입니다... ⏳</td></tr>';
                
                const now = new Date();
                const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0).getTime().toString();
                const endOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999).getTime().toString();

                rtdb.ref('history_logs').orderByKey().startAt(startOfDay).endAt(endOfDay).once('value').then(snapshot => {
                    const logs = snapshot.val();
                    const dataArray = [];
                    if (logs) {
                        Object.keys(logs).sort((a, b) => a - b).forEach(key => {
                            const zData = logs[key][zoneName];
                            if (zData && zData.temp !== "--") {
                                let actualHumi = fixHumidity(zData.humi);
                                dataArray.push({
                                    timestamp: zData.timestamp,
                                    originalDate: zData.timestamp,
                                    temp: Number(zData.temp).toFixed(1),
                                    humi: actualHumi.toFixed(1),
                                    count: zData.count || "0"
                                });
                            }
                        });
                    }
                    currentViewData = dataArray;
                    updateChartAndTable(dataArray, false);
                });
            }

            function loadPeriodData(start, end) {
                viewModeText.innerText = `${start} ~ ${end} (일별 평균 분석)`;
                tbody.innerHTML = '<tr><td colspan="5" class="py-8 text-gray-500 font-medium">데이터를 분석하여 평균을 계산 중입니다... ⏳</td></tr>';

                const startTimeStr = new Date(start + 'T00:00:00').getTime().toString();
                const endTimeStr = new Date(end + 'T23:59:59').getTime().toString();

                rtdb.ref('history_logs').orderByKey().startAt(startTimeStr).endAt(endTimeStr).once('value').then(snapshot => {
                    const logs = snapshot.val();
                    const dailyStats = {};

                    if (logs) {
                        Object.keys(logs).forEach(key => {
                            const zData = logs[key][zoneName];
                            if (zData && zData.temp !== "--") {
                                const dateParts = zData.timestamp.split('. ');
                                const year = dateParts[0];
                                const month = dateParts[1].padStart(2, '0');
                                const day = dateParts[2].replace('.', '').padStart(2, '0');
                                const dateKey = `${year}-${month}-${day}`;

                                let actualHumi = fixHumidity(zData.humi);

                                if(!dailyStats[dateKey]) {
                                    dailyStats[dateKey] = { tempSum: 0, humiSum: 0, count: 0, rawDate: zData.timestamp, pigCount: zData.count || 0 };
                                }
                                dailyStats[dateKey].tempSum += Number(zData.temp);
                                dailyStats[dateKey].humiSum += actualHumi;
                                dailyStats[dateKey].count += 1;
                                dailyStats[dateKey].pigCount = zData.count || dailyStats[dateKey].pigCount; 
                            }
                        });
                    }

                    const dataArray = Object.keys(dailyStats).sort().map(date => {
                        const stat = dailyStats[date];
                        return {
                            timestamp: date,
                            originalDate: stat.rawDate,
                            temp: (stat.tempSum / stat.count).toFixed(1),
                            humi: (stat.humiSum / stat.count).toFixed(1),
                            count: stat.pigCount
                        };
                    });

                    currentViewData = dataArray;
                    updateChartAndTable(dataArray, true);
                });
            }

            loadDefaultData();

            document.getElementById('search-btn').onclick = () => {
                const start = document.getElementById('start-date').value;
                const end = document.getElementById('end-date').value;
                if(!start || !end) { alert('시작일과 종료일을 모두 선택해주세요.'); return; }
                loadPeriodData(start, end);
            };

            document.getElementById('reset-btn').onclick = () => {
                loadDefaultData();
            };

            document.getElementById('excel-btn').onclick = () => {
                if(currentViewData.length === 0) { alert("다운로드할 데이터가 없습니다."); return; }
                const isDailyAvg = viewModeText.innerText.includes('평균');
                const exportData = currentViewData.map(item => {
                    const ageAtTime = calculateAge(fData.startRawDate, item.originalDate || item.timestamp);
                    return {
                        "측정 시간/날짜": item.timestamp + (isDailyAvg ? " (평균)" : ""),
                        "온도(°C)": Number(item.temp),
                        "습도(%)": Number(item.humi),
                        "잔여 마리수(두)": item.count,
                        "측정시 일령(일)": ageAtTime
                    };
                });
                
                const ws = XLSX.utils.json_to_sheet(exportData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, `${zoneName} 기록`);
                
                const postfix = isDailyAvg ? `${document.getElementById('start-date').value}_to_${document.getElementById('end-date').value}_일별평균` : `오늘당일기록`;
                XLSX.writeFile(wb, `성암농장_${zoneName}_${postfix}.xlsx`);
            };
        }

        function closeModal() { document.getElementById('history-modal').classList.add('hidden'); }

        function refreshData() {
            statusIndicator.innerText = "데이터 갱신 중... 🔄";
            statusIndicator.className = "bg-yellow-100 text-yellow-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors duration-300";
            fetch('https://sungamfarm.netlify.app/.netlify/functions/app')
                .then(response => {
                    statusIndicator.innerText = "최신 업데이트 완료 🟢";
                    statusIndicator.className = "bg-green-100 text-green-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors duration-300";
                    setTimeout(() => {
                        statusIndicator.innerText = "실시간 감시 중 🔵";
                        statusIndicator.className = "bg-blue-100 text-blue-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors duration-300";
                    }, 3000);
                })
                .catch(() => {
                    statusIndicator.innerText = "갱신 실패 🔴";
                    statusIndicator.className = "bg-red-100 text-red-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors duration-300";
                });
        }
        refreshData();
    </script>
</body>
</html>
