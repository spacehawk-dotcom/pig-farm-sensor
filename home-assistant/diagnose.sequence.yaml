# 새 스크립트의 YAML 편집기에 붙여 넣고 실행합니다 (Firebase 쓰기 없음).
alias: "농장 Firebase 진단"
sequence:
  - action: shell_command.firebase_push_check
    response_variable: result
  - action: persistent_notification.create
    data:
      title: "농장 Firebase 진단 결과"
      message: |-
        종료 코드: {{ result['returncode'] }}
        표준 출력: {{ result['stdout'] }}
        오류 출력: {{ result['stderr'] }}
mode: single
