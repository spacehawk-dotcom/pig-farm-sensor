  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo, useRef } = React;

    const Search = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
    const Plus = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>;
    const ArrowLeft = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>;
    const Trash2 = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>;
    const Activity = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>;
    const Baby = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M8 11.5h.01"/><path d="M16 11.5h.01"/><path d="M9 15.5a4 4 0 0 0 6 0"/></svg>;
    const FileText = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>;
    const ChevronRight = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m9 18 6-6-6-6"/></svg>;
    const X = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;
    const Download = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>;
    const TableIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="M15 3v18"/><path d="M3 9h18"/><path d="M3 15h18"/></svg>;

    const TempTable = ({ shipment, onAvgCalculated }) => {
      const [tableData, setTableData] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        let isMounted = true;
        
        const fetchTempData = async () => {
          setLoading(true);
          const { stockingDate, date: shipDate, batchIds } = shipment;
          
          if (!stockingDate || !shipDate || !batchIds || batchIds.length === 0) {
             if (isMounted) { setTableData([]); setLoading(false); onAvgCalculated('-'); }
             return;
          }

          try {
            const startStr = new Date(stockingDate + 'T00:00:00').getTime().toString();
            const endStr = new Date(shipDate + 'T23:59:59').getTime().toString();
            
            const snapshot = await firebase.database().ref('history_logs')
              .orderByKey()
              .startAt(startStr)
              .endAt(endStr)
              .once('value');
              
            const logs = snapshot.val();
            if (!logs) {
              if (isMounted) { setTableData([]); setLoading(false); onAvgCalculated('-'); }
              return;
            }

            const dailyStats = {};
            const zones = batchIds.map(id => id === 8 ? '육성_후보사' : `육성_${id}배치`);

            let totalSum = 0;
            let totalCount = 0;

            Object.keys(logs).forEach(key => {
              const logEntry = logs[key];
              let tempSum = 0;
              let tempCount = 0;
              
              zones.forEach(z => {
                if (logEntry[z] && logEntry[z].temp && logEntry[z].temp !== "--") {
                  tempSum += Number(logEntry[z].temp);
                  tempCount++;
                }
              });

              if (tempCount > 0) {
                const d = new Date(Number(key));
                const dateKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                
                if (!dailyStats[dateKey]) dailyStats[dateKey] = { sum: 0, count: 0 };
                const avgTemp = tempSum / tempCount;
                dailyStats[dateKey].sum += avgTemp;
                dailyStats[dateKey].count++;
                
                totalSum += avgTemp;
                totalCount++;
              }
            });

            const sortedDates = Object.keys(dailyStats).sort();
            
            const getDiffDays = (d1, d2) => {
              const t1 = new Date(d1).getTime();
              const t2 = new Date(d2).getTime();
              return Math.floor((t2 - t1) / (1000 * 60 * 60 * 24));
            };

            const tData = sortedDates.map(d => {
              const age = getDiffDays(stockingDate, d) + 20;
              return {
                date: d,
                age: age,
                temp: (dailyStats[d].sum / dailyStats[d].count).toFixed(1)
              };
            });
            
            if (isMounted) {
                setTableData(tData);
                setLoading(false);
                if (totalCount > 0) {
                    onAvgCalculated((totalSum / totalCount).toFixed(1));
                } else {
                    onAvgCalculated('-');
                }
            }
          } catch (e) {
            console.error("RTDB fetch error", e);
            if (isMounted) { setTableData([]); setLoading(false); onAvgCalculated('-'); }
          }
        };

        fetchTempData();
        return () => { isMounted = false; };
      }, [shipment, onAvgCalculated]);

      return (
        <div className="w-full mt-2 relative min-h-[120px]">
          {loading && (
             <div className="absolute inset-0 bg-slate-50/80 backdrop-blur-sm z-10 flex items-center justify-center rounded-lg">
                <span className="text-xs font-bold text-blue-600 animate-pulse">환경 데이터 동기화 중...</span>
             </div>
          )}
          {!loading && tableData.length === 0 && (
             <div className="absolute inset-0 z-10 flex items-center justify-center bg-slate-50/50 rounded-lg">
                <span className="text-xs font-black text-slate-400 px-2 py-1">온도 기록 없음</span>
             </div>
          )}
          
          <div className="max-h-48 overflow-y-auto no-scrollbar border border-slate-200 rounded-lg bg-white">
            <table className="w-full text-center text-xs">
              <thead className="bg-slate-100 text-slate-500 sticky top-0 shadow-sm z-10">
                <tr>
                  <th className="py-2.5 font-bold">일령</th>
                  <th className="py-2.5 font-bold border-l border-slate-200">측정 날짜</th>
                  <th className="py-2.5 font-bold border-l border-slate-200">평균 온도</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {tableData.map((row, i) => (
                  <tr key={i} className="hover:bg-blue-50/50 transition-colors">
                    <td className="py-2.5 font-black text-slate-700">{row.age}일</td>
                    <td className="py-2.5 font-bold text-slate-500 border-l border-slate-100">{row.date.substring(5).replace('-', '/')}</td>
                    <td className="py-2.5 font-black text-rose-500 border-l border-slate-100">{row.temp}℃</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="flex justify-between items-start w-full text-[10px] font-bold text-slate-400 mt-3 px-1">
            <span className="text-left leading-tight bg-slate-100 px-2 py-1 rounded">입식: {shipment.stockingDate ? shipment.stockingDate.substring(5).replace('-','/') : '-'}</span>
            <span className="text-right leading-tight bg-slate-100 px-2 py-1 rounded">출하: {shipment.date ? shipment.date.substring(5).replace('-','/') : '-'}</span>
          </div>
        </div>
      );
    };

    const fbInitConfig = {
      apiKey: "AIzaSyBlptGu2gTAQKVy_yDomKkNEd_el6c1PL0",
      authDomain: "sungamfarm.firebaseapp.com",
      projectId: "sungamfarm",
      storageBucket: "sungamfarm.firebasestorage.app",
      messagingSenderId: "811107235779",
      appId: "1:811107235779:web:ea65a74d09c37ba2136f76",
      databaseURL: "https://sungamfarm-default-rtdb.firebaseio.com"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(fbInitConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();
    const rtdb = firebase.database();
    
    const SOWS_COLLECTION_PATH = 'farms/sungamfarm/sows';
    const WEANING_RECORDS_PATH = 'farms/sungamfarm/weaning_records'; 
    const SETTINGS_PATH = 'farms/sungamfarm/settings'; 
    const SHIPMENTS_COLLECTION_PATH = 'farms/sungamfarm/shipments';
    const SHIPMENT_SUMMARIES_PATH = 'farms/sungamfarm/shipment_summaries';
    const GROWER_PATH = 'farms/sungamfarm/grower';
    const WEANING_PATH = 'farms/sungamfarm/weaning';
    const ACCIDENTS_PATH = 'farms/sungamfarm/accidents';
    const FEEDS_COLLECTION_PATH = 'farms/sungamfarm/feed_orders';
    const ONEPASS_COLLECTION_PATH = 'pig_onepass_batches'; // 원패스 앱 출하 정산 연동 컬렉션

    // 알림창 컴포넌트
    const CustomAlert = ({ message, onClose }) => (
      <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full p-5 text-center animate-[slideUp_0.2s_ease-out]">
          <div className="w-12 h-12 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-3">
            <span className="text-amber-500 text-xl font-bold">!</span>
          </div>
          <p className="text-sm font-bold text-slate-700 mb-5">{message}</p>
          <button 
            onClick={onClose}
            className="w-full bg-slate-800 text-white font-black py-3 rounded-xl hover:bg-slate-700 active:scale-95 transition-all"
          >
            확인
          </button>
        </div>
      </div>
    );

    // 확인창 컴포넌트
    const CustomConfirm = ({ message, onConfirm, onCancel }) => (
      <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full p-5 text-center animate-[slideUp_0.2s_ease-out]">
          <div className="w-12 h-12 bg-rose-100 rounded-full flex items-center justify-center mx-auto mb-3">
            <span className="text-rose-500 text-xl font-bold">?</span>
          </div>
          <p className="text-sm font-bold text-slate-700 mb-5">{message}</p>
          <div className="flex gap-2">
            <button 
              onClick={onCancel}
              className="flex-1 bg-slate-100 text-slate-600 font-black py-3 rounded-xl hover:bg-slate-200 active:scale-95 transition-all"
            >
              취소
            </button>
            <button 
              onClick={onConfirm}
              className="flex-1 bg-rose-500 text-white font-black py-3 rounded-xl hover:bg-rose-600 active:scale-95 transition-all"
            >
              확인
            </button>
          </div>
        </div>
      </div>
    );

    function App() {
      const [user, setUser] = useState(null);
      const [sows, setSows] = useState([]);
      const [weaningRecords, setWeaningRecords] = useState({}); 
      const [farmSettings, setFarmSettings] = useState({ avgSowCount: 0 }); 
      const [shipments, setShipments] = useState([]); 
      const [shipmentSummaries, setShipmentSummaries] = useState({}); 
      const [gBatches, setGBatches] = useState([]); 
      const [wBatches, setWBatches] = useState([]); 
      const [accidents, setAccidents] = useState([]); 
      const [feedRecords, setFeedRecords] = useState([]); 
      const [onepassBatches, setOnepassBatches] = useState([]); // 원패스 정산 데이터

      const [confirmConfig, setConfirmConfig] = useState(null);
      const [toastMsg, setToastMsg] = useState(null);

      const showAlert = (message) => setAlertMsg(message);
      const showConfirm = (message, onConfirm) => {
        setConfirmConfig({
          message,
          onConfirm: () => { onConfirm(); setConfirmConfig(null); },
          onCancel: () => setConfirmConfig(null)
        });
      };
      
      const showToast = (message) => {
        setToastMsg(message);
        setTimeout(() => setToastMsg(null), 3000);
      };

      const [searchQuery, setSearchQuery] = useState('');
      const [selectedSowId, setSelectedSowId] = useState(null);
      const [showAddSow, setShowAddSow] = useState(false);
      const [showAddRecord, setShowAddRecord] = useState(false);
      const [showSowListModal, setShowSowListModal] = useState(false);
      const [listFilter, setListFilter] = useState(null);
      
      const [showWeaningModal, setShowWeaningModal] = useState(false);
      const [isEditingWeaning, setIsEditingWeaning] = useState(false);
      const [confirmWeaningDelete, setConfirmWeaningDelete] = useState(false); 
      const [weaningForm, setWeaningForm] = useState({ date: '', sowCount: '', totalWeaned: '' });
      
      const [showFormulaModal, setShowFormulaModal] = useState(false);
      const [showParityModal, setShowParityModal] = useState(false);
      const [showMonthlySowModal, setShowMonthlySowModal] = useState(false);
      const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());
      const [selectedShipment, setSelectedShipment] = useState(null); 
      const [modalAvgTemp, setModalAvgTemp] = useState('-'); 
      const [selectedFeedMonth, setSelectedFeedMonth] = useState(null);
      
      const [selectedMortalityDetail, setSelectedMortalityDetail] = useState(null);
      const [isFeedSummaryOpen, setIsFeedSummaryOpen] = useState(false); // 아코디언 상태 추가 (기본 닫힘)
      const [isShipmentScheduleOpen, setIsShipmentScheduleOpen] = useState(false); // 출하 예정 아코디언 상태 추가 (기본 닫힘)
      const [isActivityStatsOpen, setIsActivityStatsOpen] = useState(false); // 번식 실적 아코디언 상태 추가 (기본 닫힘)
      
      // FIXED: Added missing state definition for Shipment Settlement modal
      const [selectedShipmentMonth, setSelectedShipmentMonth] = useState(null);

      const [newSow, setNewSow] = useState({ sowNo: '', parity: 0, currentStatus: '이유' });
      const [newRecord, setNewRecord] = useState({ parity: '', date: '', expDate: '', born: '', weaned: '', move: '' });

      const farrowingScrollRef = useRef(null);

      useEffect(() => {
        auth.signInAnonymously().catch(err => {
          console.warn("익명 로그인 실패:", err);
        });
        
        const unsubscribeAuth = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          if (!currentUser) setLoading(false);
        });
        
        return () => unsubscribeAuth();
      }, []);

      useEffect(() => {
        if (!user) return;

        const unsubSows = db.collection(SOWS_COLLECTION_PATH).onSnapshot(
          (snapshot) => {
            const sowsData = snapshot.docs
              .map(doc => {
                const data = doc.data();
                return data ? { id: doc.id, ...data } : null;
              })
              .filter(sow => sow && (sow || {}).sowNo); 
            
            sowsData.sort((a, b) => String((a || {}).sowNo || '').localeCompare(String((b || {}).sowNo || '')));
            setSows(sowsData);
            setLoading(false);
          },
          (error) => {
            console.error("Error fetching sows:", error);
            setLoading(false);
          }
        );

        const unsubWeaning = db.collection(WEANING_RECORDS_PATH).onSnapshot(
          (snapshot) => {
            const records = {};
            snapshot.docs.forEach(doc => { 
              if(doc.data()) records[doc.id] = doc.data(); 
            });
            setWeaningRecords(records);
          },
          (error) => console.error("Error fetching weaning records:", error)
        );

        const unsubSettings = db.collection(SETTINGS_PATH).doc('main').onSnapshot(
          (doc) => {
            if (doc.exists && doc.data()) {
              setFarmSettings(doc.data());
            }
          },
          (error) => console.error("Error fetching settings:", error)
        );

        const unsubShipments = db.collection(SHIPMENTS_COLLECTION_PATH).onSnapshot(
          (snapshot) => {
            const records = snapshot.docs.map(doc => doc.data());
            setShipments(records);
          },
          (error) => console.error("Error fetching shipments:", error)
        );

        const unsubShipmentSummaries = db.collection(SHIPMENT_SUMMARIES_PATH).onSnapshot(
          (snapshot) => {
            const summaries = {};
            snapshot.docs.forEach(doc => summaries[doc.id] = doc.data());
            setShipmentSummaries(summaries);
          },
          (error) => console.error("Error fetching shipment summaries:", error)
        );

        const unsubGrower = db.collection(GROWER_PATH).onSnapshot(
          (snapshot) => {
            const batches = snapshot.docs.map(doc => {
              const data = doc.data();
              const id = data.id || parseInt(doc.id.replace('batch_', ''), 10);
              return { id, ...data };
            });
            setGBatches(batches);
          },
          (error) => console.error("Error fetching grower batches:", error)
        );

        const unsubWeaningBatches = db.collection(WEANING_PATH).onSnapshot(
          (snapshot) => {
            const batches = snapshot.docs.map(doc => {
              const data = doc.data();
              const id = data.id || parseInt(doc.id.replace('batch_', ''), 10);
              return { id, ...data };
            });
            setWBatches(batches);
          },
          (error) => console.error("Error fetching weaning batches:", error)
        );

        const unsubAccidents = db.collection(ACCIDENTS_PATH).onSnapshot(
          (snapshot) => {
            const records = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setAccidents(records);
          },
          (error) => console.error("Error fetching accidents:", error)
        );

        const unsubFeeds = db.collection(FEEDS_COLLECTION_PATH).onSnapshot(
          (snapshot) => {
            const records = snapshot.docs.map(doc => doc.data());
            setFeedRecords(records);
          },
          (error) => console.error("Error fetching feeds:", error)
        );

        const unsubOnePass = db.collection(ONEPASS_COLLECTION_PATH).onSnapshot(
          (snapshot) => {
            const records = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setOnepassBatches(records);
          },
          (error) => console.error("Error fetching onepass batches:", error)
        );

        return () => { 
          unsubSows(); unsubWeaning(); unsubSettings(); 
          unsubShipments(); unsubShipmentSummaries(); unsubGrower(); 
          unsubWeaningBatches(); unsubAccidents(); unsubFeeds(); unsubOnePass();
        };
      }, [user]);

      const getDiffDays = (d1, d2) => { 
        if(!d1||!d2) return 0; 
        const t1=new Date(d1).getTime(), t2=new Date(d2).getTime(); 
        if(isNaN(t1)||isNaN(t2)) return 0; 
        return Math.floor((t2-t1)/(1000*60*60*24)); 
      };

      const parseValidDate = (dateStr) => {
        if (!dateStr) return null;
        const str = String(dateStr).trim();
        if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return new Date(str);

        const parts = str.split(/[-/.]/);
        if (parts.length === 3) {
          let y = parts[0].length === 2 ? 2000 + parseInt(parts[0], 10) : parseInt(parts[0], 10);
          let m = parseInt(parts[1], 10) - 1;
          let d = parseInt(parts[2], 10);
          return new Date(y, m, d);
        } else if (parts.length === 2) {
          let y = new Date().getFullYear(); 
          let m = parseInt(parts[0], 10) - 1;
          let d = parseInt(parts[1], 10);
          return new Date(y, m, d);
        }
        
        const parsed = new Date(str);
        return isNaN(parsed.getTime()) ? null : parsed;
      };

      const formatDate = (dateObj) => {
        if (!dateObj) return '';
        const yy = dateObj.getFullYear();
        const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
        const dd = String(dateObj.getDate()).padStart(2, '0');
        return `${yy}-${mm}-${dd}`;
      };

      const getExpectedFarrow = (matingDate) => {
        const d = parseValidDate(matingDate);
        if (!d) return '';
        d.setDate(d.getDate() + 115);
        return formatDate(d);
      };

      const getWeaningThursday = (farrowDateStr) => {
        const d = parseValidDate(farrowDateStr);
        if (!d) return null;
        const currentDay = d.getDay(); 
        const diffToMonday = currentDay === 0 ? -6 : 1 - currentDay; 
        d.setDate(d.getDate() + diffToMonday + 24);
        return formatDate(d);
      };

      const addDays = (dateStr, days) => {
        const d = parseValidDate(dateStr);
        if (!d) return '';
        d.setDate(d.getDate() + days);
        return formatDate(d);
      };

      const subtractDays = (dateStr, days) => {
        const d = parseValidDate(dateStr);
        if (!d) return '';
        d.setDate(d.getDate() - days);
        return formatDate(d);
      };

      const getMonday = (dateStr) => {
        const d = parseValidDate(dateStr);
        if (!d) return null;
        const currentDay = d.getDay(); 
        const diffToMonday = currentDay === 0 ? -6 : 1 - currentDay; 
        d.setDate(d.getDate() + diffToMonday);
        return formatDate(d);
      };

      const getStatusColor = (status) => {
        switch(status) {
          case '포유': return 'text-emerald-600 bg-emerald-50 border-emerald-200';
          case '임신': return 'text-blue-600 bg-blue-50 border-blue-200';
          case '재발': return 'text-rose-600 bg-rose-50 border-rose-200';
          default: return 'text-slate-600 bg-slate-100 border-slate-200';
        }
      };

      const filteredSows = useMemo(() => {
        let result = sows.filter(Boolean);

        if (listFilter) {
          const filterObj = listFilter || {};
          if (filterObj.type === 'status') {
            result = result.filter(sow => sow && ((sow || {}).currentStatus || '이유') === filterObj.value);
          } else if (filterObj.type === 'parity') {
            result = result.filter(sow => sow && (Number((sow || {}).parity) || 0) === Number(filterObj.value));
          } else if (filterObj.type === 'expectedMonth') {
            result = result.filter(sow => {
              const s = sow || {};
              if (!s.matingDate || s.currentStatus === '포유' || s.currentStatus === '재발') return false;
              const expDateStr = getExpectedFarrow(s.matingDate);
              return expDateStr && expDateStr.substring(0, 7) === filterObj.value;
            });
          } else if (filterObj.type === 'farrowingWeek') {
            result = result.filter(sow => {
              const s = sow || {};
              const currentMonday = getMonday(new Date().toISOString().split('T')[0]);

              const matchActual = s.history && Array.isArray(s.history) && s.history.some(r => r && r.date && getMonday(r.date) === filterObj.value);
              const expDateStr = s.matingDate && s.currentStatus !== '재발' ? getExpectedFarrow(s.matingDate) : null;
              const matchExpected = expDateStr && getMonday(expDateStr) === filterObj.value;
              const matchFallback = !s.matingDate && s.currentStatus === '포유' && filterObj.value === currentMonday;
              
              return matchActual || matchExpected || matchFallback;
            });
          } else if (filterObj.type === 'activityMonth') {
            result = result.filter(sow => {
              const s = sow || {};
              let matedThisMonth = false;
              if (s.matingDate) {
                const parsed = parseValidDate(s.matingDate);
                if (parsed && formatDate(parsed).substring(0, 7) === filterObj.value) matedThisMonth = true;
              }
              let farrowedThisMonth = false;
              if (s.history && Array.isArray(s.history)) {
                farrowedThisMonth = s.history.some(r => {
                  if (r && r.date) {
                    const parsed = parseValidDate(r.date);
                    return parsed && formatDate(parsed).substring(0, 7) === filterObj.value;
                  }
                  return false;
                });
              }
              return matedThisMonth || farrowedThisMonth;
            });
          }
        }

        if (searchQuery) {
          result = result.filter(sow => 
            sow && String((sow || {}).sowNo || '').toLowerCase().includes(String(searchQuery).toLowerCase())
          );
        }

        return result;
      }, [sows, searchQuery, listFilter]);

      const currentSow = useMemo(() => {
        return sows.find(s => s && (s || {}).id === selectedSowId) || null;
      }, [sows, selectedSowId]);

      // 대시보드 통계 연산 (원패스 앱 정산 데이터 `onepassBatches` 기반 고도화)
      const dashboardStats = useMemo(() => {
        const stats = {
          total: sows.filter(Boolean).filter(s => {
            const parity = Number(s.parity) || 0;
            return parity >= 1 || (parity === 0 && s.currentStatus === '임신');
          }).length, 
          status: { '이유': 0, '임신': 0, '포유': 0, '재발': 0 },
          parity: {},
          monthlyFarrowing: {}
        };
        
        const oneYearAgo = new Date();
        oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);
        const oneYearAgoStr = formatDate(oneYearAgo);
        
        sows.filter(Boolean).forEach(sow => {
          const s = sow || {};
          const parity = Number(s.parity) || 0;
          
          const isReplacement = (parity === 0 && s.currentStatus !== '임신');
          if (isReplacement) return;

          const status = s.currentStatus || '이유';
          if (stats.status[status] !== undefined) stats.status[status]++;
          
          const p = Number(s.parity) || 0;
          if (stats.parity[p] !== undefined) stats.parity[p]++;
          else stats.parity[p] = 1;

          if (s.matingDate && s.currentStatus !== '포유' && s.currentStatus !== '재발') {
            const expDateStr = getExpectedFarrow(s.matingDate);
            if (expDateStr) {
              const ym = expDateStr.substring(0, 7);
              stats.monthlyFarrowing[ym] = (stats.monthlyFarrowing[ym] || 0) + 1;
            }
          }
        });

        let manualYearlyWeaned = 0;
        Object.entries(weaningRecords).forEach(([date, data]) => {
          if (date >= oneYearAgoStr && data) {
            manualYearlyWeaned += Number((data || {}).totalWeaned || 0);
          }
        });

        let dbYearlyShipped = 0;
        let yearlyWeightGainKg = 0; 
        let yearlyTotalShippedWeight = 0; 

        // 출하두수 및 체중 연산 (원패스 정산 데이터 기준 동기화)
        onepassBatches.forEach(batch => {
          if (batch && batch.date && batch.date >= oneYearAgoStr) {
            const count = Number(batch.headCount) || 0;
            dbYearlyShipped += count;

            // 원패스의 총 생체중(liveWeight)을 사용. 없으면 지육중량 / 지육율(yieldRate) 역산 적용
            const yieldRate = batch.yieldRate > 0 ? (batch.yieldRate / 100) : 0.765;
            const batchLiveWeight = batch.liveWeight > 0 ? batch.liveWeight : (batch.totalWeight / yieldRate);
            
            yearlyTotalShippedWeight += batchLiveWeight;

            // 전입 자돈 6kg(총량) 보정 적용
            const gain = Math.max(0, batchLiveWeight - (6 * count));
            yearlyWeightGainKg += gain;
          }
        });

        let yearlyTotalFeedKg = 0;   
        let yearlyMarketFeedKg = 0;  
        
        feedRecords.forEach(record => {
          const receiptDate = record.deliveryDate || record.receivingDate || record.date || '';
          if (receiptDate && receiptDate >= oneYearAgoStr) {
            const qtyTons = Number(record.quantity) || Number(record.amount) || Number(record.weight) || 0;
            const weightKg = qtyTons * 1000; 
            
            yearlyTotalFeedKg += weightKg;
            
            const type = record.feedType || record.type || record.feedName || '기타';
            if (type === '젖돈' || type === '육성') {
              yearlyMarketFeedKg += weightKg;
            }
          }
        });

        const fSettings = farmSettings || {};
        const avgSows = fSettings.avgSowCount > 0 ? fSettings.avgSowCount : stats.total;
        
        const autoShipped = Math.floor(manualYearlyWeaned * 0.95);
        const yearlyShipped = dbYearlyShipped > 0 ? dbYearlyShipped : autoShipped;

        stats.psy = avgSows > 0 ? (manualYearlyWeaned / avgSows).toFixed(1) : "0.0";
        stats.msy = avgSows > 0 ? (yearlyShipped / avgSows).toFixed(1) : "0.0";
        stats.avgSows = avgSows;
        stats.manualYearlyWeaned = manualYearlyWeaned;
        stats.yearlyShipped = yearlyShipped;
        stats.autoShipped = autoShipped;
        stats.dbYearlyShipped = dbYearlyShipped;

        stats.yearlyTotalFeedKg = yearlyTotalFeedKg;
        stats.yearlyMarketFeedKg = yearlyMarketFeedKg;
        stats.yearlyWeightGainKg = yearlyWeightGainKg;
        stats.yearlyTotalShippedWeight = yearlyTotalShippedWeight;
        
        stats.totalFcr = yearlyWeightGainKg > 0 ? (yearlyTotalFeedKg / yearlyWeightGainKg).toFixed(2) : "0.00";
        stats.marketFcr = yearlyWeightGainKg > 0 ? (yearlyMarketFeedKg / yearlyWeightGainKg).toFixed(2) : "0.00";

        return stats;
      }, [sows, weaningRecords, farmSettings, onepassBatches, feedRecords]);

      const sowStats = useMemo(() => {
        const s = currentSow || {};
        if (!s.history || !Array.isArray(s.history)) {
          return { totalLitters: 0, avgBorn: 0, avgWeaned: 0 };
        }
        
        const history = s.history.filter(Boolean);
        const totalLitters = history.length;
        const totalBorn = history.reduce((sum, r) => sum + Number((r || {}).born || 0), 0);
        const totalWeaned = history.reduce((sum, r) => sum + Number((r || {}).weaned || 0), 0);
        
        return {
          totalLitters,
          avgBorn: totalLitters > 0 ? (totalBorn / totalLitters).toFixed(1) : "0.0",
          avgWeaned: totalLitters > 0 ? (totalWeaned / totalLitters).toFixed(1) : "0.0"
        };
      }, [currentSow]);

      const weeklyFarrowingStats = useMemo(() => {
        const statsMap = {};
        const todayStr = formatDate(new Date());
        const currentMonday = getMonday(todayStr);

        sows.filter(Boolean).forEach(sow => {
          const s = sow || {};
          
          if (s.history && Array.isArray(s.history)) {
            s.history.filter(Boolean).forEach(record => {
              const r = record || {};
              if (!r.date) return; 
              
              const monday = getMonday(r.date);
              if (!monday) return;

              if (!statsMap[monday]) {
                statsMap[monday] = { date: monday, actual: 0, expected: 0, parity6Plus: 0, nursingPiglets: 0, sows: [] };
              }
              statsMap[monday].actual += 1;
              
              const born = Number(r.born || 0);
              const move = Number(r.move || 0);
              statsMap[monday].nursingPiglets += (born >= move ? born - move : 0);
              
              if (Number(s.parity || 0) >= 6) {
                statsMap[monday].parity6Plus += 1;
              }

              if (!statsMap[monday].sows.find(item => item && item.id === s.id)) {
                statsMap[monday].sows.push(s);
              }
            });
          }

          if (s.matingDate && s.currentStatus !== '재발') {
            const expDateStr = getExpectedFarrow(s.matingDate);
            if (expDateStr) {
              const expMonday = getMonday(expDateStr);
              if (expMonday) {
                const hasActualThisWeek = s.history && Array.isArray(s.history) && s.history.some(r => r && r.date && getMonday(r.date) === expMonday);
                
                if (!hasActualThisWeek) {
                  if (!statsMap[expMonday]) {
                    statsMap[expMonday] = { date: expMonday, actual: 0, expected: 0, parity6Plus: 0, nursingPiglets: 0, sows: [] };
                  }
                  
                  if (s.currentStatus === '포유') {
                    statsMap[expMonday].actual += 1;
                    if (Number(s.parity || 0) >= 6) {
                      statsMap[expMonday].parity6Plus += 1;
                    }
                  } else {
                    statsMap[expMonday].expected += 1;
                    if ((Number(s.parity || 0) + 1) >= 6) {
                      statsMap[expMonday].parity6Plus += 1;
                    }
                  }

                  if (!statsMap[expMonday].sows.find(item => item && item.id === s.id)) {
                    statsMap[expMonday].sows.push(s);
                  }
                }
              }
            }
          } else if (!s.matingDate && s.currentStatus === '포유' && currentMonday) {
             const hasActualThisWeek = s.history && Array.isArray(s.history) && s.history.some(r => r && r.date && getMonday(r.date) === currentMonday);
             if (!hasActualThisWeek) {
                if (!statsMap[currentMonday]) {
                  statsMap[currentMonday] = { date: currentMonday, actual: 0, expected: 0, parity6Plus: 0, nursingPiglets: 0, sows: [] };
                }
                statsMap[currentMonday].actual += 1;
                if (Number(s.parity || 0) >= 6) {
                  statsMap[currentMonday].parity6Plus += 1;
                }
                if (!statsMap[currentMonday].sows.find(item => item && item.id === s.id)) {
                  statsMap[currentMonday].sows.push(s);
                }
             }
          }
        });

        return Object.values(statsMap).sort((a, b) => String((a || {}).date || '').localeCompare(String((b || {}).date || '')));
      }, [sows]);

      const weaningStats = useMemo(() => {
        const statsMap = {};
        
        sows.filter(Boolean).forEach(sow => {
          const s = sow || {};
          if (!s.history || !Array.isArray(s.history)) return;
          
          s.history.filter(Boolean).forEach(record => {
            const r = record || {};
            if (!r.date) return; 
            
            const wCount = Number(r.weaned) || 0;
            const mCount = Number(r.move) || 0;
            const totalWeaned = wCount + mCount;

            const weaningThursday = getWeaningThursday(r.date);
            if (!weaningThursday) return;

            if (!statsMap[weaningThursday]) {
              statsMap[weaningThursday] = { date: weaningThursday, sows: [], totalWeanedAuto: 0 };
            }
            if (!statsMap[weaningThursday].sows.find(item => item && (item || {}).id === s.id)) {
               statsMap[weaningThursday].sows.push(s);
            }
            statsMap[weaningThursday].totalWeanedAuto += totalWeaned;
          });
        });

        return Object.values(statsMap).sort((a, b) => String((b || {}).date || '').localeCompare(String((a || {}).date || '')));
      }, [sows]);

      const currentWeaningStat = useMemo(() => {
        return weaningStats.find(s => s && (s || {}).date === (weaningForm || {}).date) || null;
      }, [weaningStats, weaningForm]);

      const sortedWeaningRecords = useMemo(() => {
        return Object.entries(weaningRecords)
          .filter(([date, data]) => Boolean(data))
          .map(([date, data]) => ({ date, ...data }))
          .sort((a, b) => String((b || {}).date || '').localeCompare(String((a || {}).date || '')));
      }, [weaningRecords]);

      const monthlyCategoryDeathStats = useMemo(() => {
        const currentYear = new Date().getFullYear().toString();
        
        const stats = {
          '이유': {},
          '육성': {}
        };

        ['이유', '육성'].forEach(cat => {
          for (let m = 1; m <= 12; m++) {
            const mm = String(m).padStart(2, '0');
            stats[cat][mm] = { total: 0, details: [] };
          }
        });

        accidents.forEach(acc => {
          if (!acc || acc.archived) return; 
          
          const dateStr = acc.date || '';
          if (dateStr && dateStr.startsWith(currentYear)) {
            const m = dateStr.substring(5, 7);
            const count = Number(acc.count) || 0;
            if (count <= 0) return;

            const stage = acc.stage || '';
            const cat = (stage === 'weaning') ? '이유' : '육성';
            const batchId = acc.batchId || "알수없음";

            if (stats[cat] && stats[cat][m]) {
              stats[cat][m].total += count;
              
              const existing = stats[cat][m].details.find(d => String(d.batchId) === String(batchId));
              if (existing) {
                existing.count += count;
              } else {
                stats[cat][m].details.push({ batchId, count });
              }
            }
          }
        });

        return stats;
      }, [accidents]);

      const groupedShipments = useMemo(() => {
        const groups = {};

        shipments.forEach(s => {
          if (!s || !s.date) return;
          const date = s.date;
          if (!groups[date]) {
            groups[date] = { date: date, totalCount: 0, sumAgeWeight: 0, validAgeCount: 0, isExpected: false, stockingDate: '9999-99-99', batchIds: new Set() };
          }
          
          const count = Number(s.count) || 0;
          groups[date].totalCount += count;

          let rDate = s.stockingDate || '';
          if(!rDate && s.batchId) {
            const b = gBatches.find(x => x.id === s.batchId);
            if(b) rDate = (b.penDates && b.penDates[s.penIndex]) || b.weaningDate || b.date;
          }
          
          if (rDate && rDate < groups[date].stockingDate) groups[date].stockingDate = rDate;
          if (s.batchId) groups[date].batchIds.add(s.batchId);
          
          if (rDate) {
            const age = getDiffDays(rDate, date) + 20;
            if (age > 0) {
              groups[date].sumAgeWeight += age * count;
              groups[date].validAgeCount += count;
            }
          }
        });

        gBatches.forEach(b => {
          if (b.pendingShipments && Array.isArray(b.pendingShipments)) {
            b.pendingShipments.forEach(ps => {
              if (!ps.date) return;
              const date = ps.date;
              if (!groups[date]) {
                groups[date] = { date: date, totalCount: 0, sumAgeWeight: 0, validAgeCount: 0, isExpected: true, stockingDate: '9999-99-99', batchIds: new Set() };
              } else {
                groups[date].isExpected = true; 
              }
              
              if (ps.items && Array.isArray(ps.items)) {
                ps.items.forEach(item => {
                  const count = Number(item.count) || 0;
                  const pIdx = (item.pIdx !== undefined) ? item.pIdx : 0;
                  const penDate = (b.penDates && b.penDates[pIdx]) || b.weaningDate || b.date;
                  
                  groups[date].totalCount += count;
                  
                  if (penDate && penDate < groups[date].stockingDate) groups[date].stockingDate = penDate;
                  groups[date].batchIds.add(b.id);
                  
                  if (penDate) {
                    const age = getDiffDays(penDate, date) + 20;
                    if (age > 0) {
                      groups[date].sumAgeWeight += age * count;
                      groups[date].validAgeCount += count;
                    }
                  }
                });
              }
            });
          }
        });

        const todayStr = formatDate(new Date());

        return Object.values(groups).map(group => {
          const count = group.totalCount;
          const avgAge = group.validAgeCount > 0 ? Math.round(group.sumAgeWeight / group.validAgeCount) : '-';
          const avgWeight = shipmentSummaries[group.date]?.avgWeight || '-';
          
          const isExpected = group.date > todayStr || group.isExpected;

          return {
            date: group.date,
            count: count,
            age: avgAge,
            weight: avgWeight,
            isExpected: isExpected,
            stockingDate: group.stockingDate !== '9999-99-99' ? group.stockingDate : null,
            batchIds: Array.from(group.batchIds)
          };
        }).sort((a, b) => String(b.date).localeCompare(String(a.date)));
      }, [shipments, gBatches, shipmentSummaries]);

      const monthlyActivityStats = useMemo(() => {
        const statsMap = {};
        
        sows.filter(Boolean).forEach(sow => {
          const s = sow || {};
          
          if (s.matingDate) {
            const parsed = parseValidDate(s.matingDate);
            if (parsed) {
              const ym = formatDate(parsed).substring(0, 7);
              if (!statsMap[ym]) statsMap[ym] = { month: ym, mated: 0, farrowed: 0 };
              statsMap[ym].mated += 1;
            }
          }
          
          if (s.history && Array.isArray(s.history)) {
            s.history.filter(Boolean).forEach(r => {
              if (r && r.date) {
                const parsed = parseValidDate(r.date);
                if (parsed) {
                  const ym = formatDate(parsed).substring(0, 7);
                  if (!statsMap[ym]) statsMap[ym] = { month: ym, mated: 0, farrowed: 0 };
                  statsMap[ym].farrowed += 1;
                }
              }
            });
          }
        });

        return Object.values(statsMap).sort((a, b) => String(b.month || '').localeCompare(String(a.month || '')));
      }, [sows]);

      // 월별 사료량 통계 (사료 주문 내역으로 데이터 고도화 및 엑셀 확인 지원)
      const monthlyFeedStats = useMemo(() => {
        const currentYear = new Date().getFullYear().toString();
        const stats = {};
        
        const currentMonth = new Date().getMonth() + 1;
        for (let i = 1; i <= currentMonth; i++) {
          const mm = String(i).padStart(2, '0');
          stats[`${currentYear}-${mm}`] = { total: 0, types: {}, orders: [] };
        }

        feedRecords.forEach(record => {
          const receiptDate = record.deliveryDate || record.receivingDate || record.date || '';
          if (!receiptDate || !receiptDate.startsWith(currentYear)) return;

          const ym = receiptDate.substring(0, 7);
          const type = record.feedType || record.type || record.feedName || '기타 사료';
          const amount = Number(record.quantity) || Number(record.amount) || Number(record.weight) || Number(record.kg) || 0;

          if (!stats[ym]) {
            stats[ym] = { total: 0, types: {}, orders: [] };
          }
          
          stats[ym].total += amount;
          stats[ym].types[type] = (stats[ym].types[type] || 0) + amount;
          stats[ym].orders.push(record);
        });

        Object.keys(stats).forEach(ym => {
          stats[ym].orders.sort((a, b) => {
            const dateA = a.deliveryDate || a.receivingDate || a.date || '';
            const dateB = b.deliveryDate || b.receivingDate || b.date || '';
            return dateB.localeCompare(dateA);
          });
        });

        return Object.entries(stats)
          .map(([ym, data]) => ({ ym, ...data }))
          .sort((a, b) => String((b || {}).ym || '').localeCompare(String((a || {}).ym || '')));
      }, [feedRecords]);

      // ★ 원패스 연동: 월별 출하 정산 실시간 분석 (지육율, 정산액, 1등급율 종합) ★
      const monthlyShipmentSettlementStats = useMemo(() => {
        const currentYear = new Date().getFullYear().toString();
        const stats = {};
        
        // 올 해 1월부터 현재 월까지 초기화
        const currentMonth = new Date().getMonth() + 1;
        for (let i = 1; i <= currentMonth; i++) {
          const mm = String(i).padStart(2, '0');
          stats[`${currentYear}-${mm}`] = { ym: `${currentYear}-${mm}`, count: 0, revenue: 0, items: [] };
        }

        onepassBatches.forEach(batch => {
          if (!batch.date || !batch.date.startsWith(currentYear)) return;
          const ym = batch.date.substring(0, 7);
          if (!stats[ym]) stats[ym] = { ym, count: 0, revenue: 0, items: [] };
          
          const count = Number(batch.headCount) || 0;
          // 실정산금액(realPrice) 최우선 적용, 없으면 예상정산금액(totalPrice) 적용
          const revenue = batch.realPrice !== undefined ? batch.realPrice : batch.totalPrice;
          
          stats[ym].count += count;
          stats[ym].revenue += revenue;
          stats[ym].items.push({
            date: batch.date,
            count: count,
            totalWeight: batch.totalWeight,
            yieldRate: batch.yieldRate,
            topRatio: batch.topRatio,
            revenue: revenue,
            liveWeight: batch.liveWeight
          });
        });

        // 각 월 내에서는 최신순으로 정렬
        Object.values(stats).forEach(stat => {
          stat.items.sort((a, b) => b.date.localeCompare(a.date));
        });

        return Object.values(stats).sort((a, b) => b.ym.localeCompare(a.ym));

                <div className="bg-slate-800 p-4 text-white flex justify-between items-center">
                  <div className="flex items-center gap-2">
                    <TableIcon className="w-5 h-5 text-amber-400" />
                    <span className="font-black text-base">{selectedFeedMonth.ym.split('-')[0]}년 {parseInt(selectedFeedMonth.ym.split('-')[1])}월 사료 입고 내역 (Excel 스프레드시트)</span>
                  </div>
                  <button onClick={() => setSelectedFeedMonth(null)} className="text-slate-300 hover:text-white p-1 rounded-lg transition-colors"><X className="w-5 h-5" /></button>
                </div>
                
                <div className="p-5 flex-1 overflow-y-auto space-y-4">
                  <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-2 bg-slate-50 border border-slate-200 p-3.5 rounded-xl">
                    <div className="text-xs text-slate-600 font-bold">
                      * 이 리스트는 사료 주문 관리 전용 프로그램과 실시간 동기화된 결과입니다.
                    </div>
                    <button 
                      onClick={() => downloadMonthlyFeedExcel(selectedFeedMonth)}
                      className="bg-emerald-600 hover:bg-emerald-700 text-white font-black px-4 py-2 rounded-lg text-xs flex items-center justify-center gap-1.5 shadow-sm active:scale-95 transition-transform shrink-0 self-start sm:self-auto"
                    >
                      <Download className="w-4.5 h-4.5" /> 엑셀 파일 다운로드 (.xlsx)
                    </button>
                  </div>

                  {/* Excel Sheet Visual Grid Layout */}
                  <div className="overflow-x-auto border border-slate-300 rounded-xl bg-white shadow-inner max-h-[380px] no-scrollbar">
                    <table className="w-full text-xs font-mono border-collapse excel-table text-slate-700">
                      <thead>
                        <tr className="bg-slate-100 text-slate-500 font-bold text-center select-none">
                          <th className="p-1 bg-slate-200 border border-slate-300 w-10"></th>
                          <th className="p-1 bg-slate-200 border border-slate-300">A</th>
                          <th className="p-1 bg-slate-200 border border-slate-300">B</th>
                          <th className="p-1 bg-slate-200 border border-slate-300">C</th>
                          <th className="p-1 bg-slate-200 border border-slate-300">D</th>
                          <th className="p-1 bg-slate-200 border border-slate-300">E</th>
                        </tr>
                        <tr className="bg-slate-50 text-slate-700 font-black text-center">
                          <th className="p-2 bg-slate-100 border border-slate-300 text-slate-400">1</th>
                          <th className="p-2 border border-slate-300">입고 일시 (Receipt Date)</th>
                          <th className="p-2 border border-slate-300">사료 종류 (Type)</th>
                          <th className="p-2 border border-slate-300">벌크통 (Bin)</th>
                          <th className="p-2 border border-slate-300 text-right">주문량 (Qty)</th>
                          <th className="p-2 border border-slate-300">단위 (Unit)</th>
                        </tr>
                      </thead>
                      <tbody>
                        {selectedFeedMonth.orders.length === 0 ? (
                          <tr>
                            <td className="p-2 bg-slate-100 border border-slate-300 font-black text-center text-slate-400">2</td>
                            <td colSpan="5" className="p-6 text-center text-slate-400 font-sans">이 달에 입고된 사료 기록이 없습니다.</td>
                          </tr>
                        ) : (
                          selectedFeedMonth.orders.map((order, idx) => {
                            const actualReceiptDate = order.deliveryDate || order.receivingDate || order.date || '-';
                            return (
                              <tr key={idx} className="hover:bg-slate-50 transition-colors">
                                <td className="p-2 bg-slate-100 border border-slate-300 font-black text-center text-slate-400">{idx + 2}</td>
                                <td className="p-2 border border-slate-300 text-center font-sans">{actualReceiptDate}</td>
                                <td className="p-2 border border-slate-300 text-center font-sans font-black text-slate-900">{order.feedType || '-'}</td>
                                <td className="p-2 border border-slate-300 text-center text-amber-700 font-black">벌크 {order.bulkBin || '-'}호</td>
                                <td className="p-2 border border-slate-300 text-right font-black font-sans text-slate-950">{parseFloat(order.quantity || 0).toFixed(1)}</td>
                                <td className="p-2 border border-slate-300 text-center text-slate-500 font-sans">{order.unit || '톤'}</td>
                              </tr>
                            );
                          })
                        )}
                        {/* Total Row */}
                        <tr className="bg-amber-50/50 font-black text-slate-900">
                          <td className="p-2.5 bg-slate-200 border border-slate-300 text-center text-slate-500">{selectedFeedMonth.orders.length + 2}</td>
                          <td className="p-2.5 border border-slate-300 text-center font-sans">합계 (Total)</td>
                          <td className="p-2.5 border border-slate-300 text-center"></td>
                          <td className="p-2.5 border border-slate-300 text-center"></td>
                          <td className="p-2.5 border border-slate-300 text-right text-amber-700 text-sm font-black font-sans">{parseFloat(selectedFeedMonth.total || 0).toFixed(1)}</td>
                          <td className="p-2.5 border border-slate-300 text-center text-amber-700 font-sans">톤 (t)</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
                
                <div className="bg-slate-50 p-4 border-t border-slate-100 flex justify-end gap-2">
                  <button onClick={() => setSelectedFeedMonth(null)} className="bg-slate-800 hover:bg-slate-900 text-white font-black py-2.5 px-6 rounded-xl text-xs active:scale-95 transition-all">닫기</button>
                </div>
              </div>
            </div>
          )}

          {/* --- 월별 출하 정산 엑셀 상세조회 모달 (원패스 앱 연동) --- */}
          {selectedShipmentMonth && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[90] flex items-center justify-center p-4 animate-fade-in">
              <div className="bg-white w-full max-w-3xl rounded-2xl shadow-2xl border border-slate-200 flex flex-col overflow-hidden max-h-[85vh]">
                <div className="bg-slate-800 p-4 text-white flex justify-between items-center">
                  <div className="flex items-center gap-2">
                    <TableIcon className="w-5 h-5 text-emerald-400" />
                    <span className="font-black text-base">{selectedShipmentMonth.ym.split('-')[0]}년 {parseInt(selectedShipmentMonth.ym.split('-')[1])}월 출하 정산 내역 (Excel)</span>
                  </div>
                  <button onClick={() => setSelectedShipmentMonth(null)} className="text-slate-300 hover:text-white p-1 rounded-lg transition-colors"><X className="w-5 h-5" /></button>
                </div>
                
                <div className="p-5 flex-1 overflow-y-auto space-y-4">
                  <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-2 bg-slate-50 border border-slate-200 p-3.5 rounded-xl">
                    <div className="text-xs text-slate-600 font-bold">
                      * 출하 정산 앱 데이터와 실시간 연동되어 추산된 내역입니다.
                    </div>
                    <button 
                      onClick={() => downloadShipmentMonthExcel(selectedShipmentMonth)}
                      className="bg-emerald-600 hover:bg-emerald-700 text-white font-black px-4 py-2 rounded-lg text-xs flex items-center justify-center gap-1.5 shadow-sm active:scale-95 transition-transform shrink-0 self-start sm:self-auto"
                    >
                      <Download className="w-4.5 h-4.5" /> 엑셀 파일 다운로드 (.xlsx)
                    </button>
                  </div>

                  <div className="overflow-x-auto border border-slate-300 rounded-xl bg-white shadow-inner max-h-[380px] no-scrollbar">
                    <table className="w-full text-xs font-mono border-collapse excel-table text-slate-700 min-w-[700px]">
                      <thead>
                        <tr className="bg-slate-100 text-slate-500 font-bold text-center select-none">
                          <th className="p-1 bg-slate-200 border border-slate-300 w-10"></th>
                          <th className="p-1 bg-slate-200 border border-slate-300">A</th>
                          <th className="p-1 bg-slate-200 border border-slate-300">B</th>
                          <th className="p-1 bg-slate-200 border border-slate-300">C</th>
                          <th className="p-1 bg-slate-200 border border-slate-300">D</th>
                          <th className="p-1 bg-slate-200 border border-slate-300">E</th>
                          <th className="p-1 bg-slate-200 border border-slate-300">F</th>
                        </tr>
                        <tr className="bg-slate-50 text-slate-700 font-black text-center">
                          <th className="p-2 bg-slate-100 border border-slate-300 text-slate-400">1</th>
                          <th className="p-2 border border-slate-300">출하 일자</th>
                          <th className="p-2 border border-slate-300">출하 두수 (두)</th>
                          <th className="p-2 border border-slate-300 text-right">총 지육중량 (kg)</th>
                          <th className="p-2 border border-slate-300 text-right">지육율 (%)</th>
                          <th className="p-2 border border-slate-300 text-right">1등급 이상 (%)</th>
                          <th className="p-2 border border-slate-300 text-right text-emerald-700">실 정산액 (원)</th>
                        </tr>
                      </thead>
                      <tbody>
                        {selectedShipmentMonth.items.length === 0 ? (
                          <tr>
                            <td className="p-2 bg-slate-100 border border-slate-300 font-black text-center text-slate-400">2</td>
                            <td colSpan="6" className="p-6 text-center text-slate-400 font-sans">이 달에 등록된 출하 정산 기록이 없습니다.</td>
                          </tr>
                        ) : (
                          selectedShipmentMonth.items.map((item, idx) => (
                            <tr key={idx} className="hover:bg-slate-50 transition-colors">
                              <td className="p-2 bg-slate-100 border border-slate-300 font-black text-center text-slate-400">{idx + 2}</td>
                              <td className="p-2 border border-slate-300 text-center font-sans font-bold">{item.date || '-'}</td>
                              <td className="p-2 border border-slate-300 text-center font-sans font-black text-slate-900">{item.count}</td>
                              <td className="p-2 border border-slate-300 text-right font-sans text-slate-700 font-bold">{item.totalWeight.toLocaleString()}</td>
                              <td className="p-2 border border-slate-300 text-right font-sans text-slate-500">{item.yieldRate.toFixed(1)}</td>
                              <td className="p-2 border border-slate-300 text-right font-sans font-bold text-indigo-600">{item.topRatio}</td>
                              <td className="p-2 border border-slate-300 text-right font-black font-sans text-emerald-700">{Math.round(item.revenue).toLocaleString()}</td>
                            </tr>
                          ))
                        )}
                        <tr className="bg-emerald-50/50 font-black text-slate-900">
                          <td className="p-2.5 bg-slate-200 border border-slate-300 text-center text-slate-500">{selectedShipmentMonth.items.length + 2}</td>
                          <td className="p-2.5 border border-slate-300 text-center font-sans">합계 (Total)</td>
                          <td className="p-2.5 border border-slate-300 text-center text-slate-800">{selectedShipmentMonth.count.toLocaleString()}</td>
                          <td className="p-2.5 border border-slate-300 text-right text-slate-800">{selectedShipmentMonth.items.reduce((acc, curr) => acc + curr.totalWeight, 0).toLocaleString()}</td>
                          <td className="p-2.5 border border-slate-300 text-center"></td>
                          <td className="p-2.5 border border-slate-300 text-center"></td>
                          <td className="p-2.5 border border-slate-300 text-right text-emerald-700 text-sm font-black font-sans">{Math.round(selectedShipmentMonth.revenue).toLocaleString()}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
                
                <div className="bg-slate-50 p-4 border-t border-slate-100 flex justify-end gap-2">
                  <button onClick={() => setSelectedShipmentMonth(null)} className="bg-slate-800 hover:bg-slate-950 text-white font-black py-2.5 px-6 rounded-xl text-xs active:scale-95 transition-all">닫기</button>
                </div>
              </div>
            </div>
          )}

          {/* --- 사육단계별 월간 폐사/도태 상세조회 스프레드시트 모달 --- */}
          {selectedMortalityDetail && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[90] flex items-center justify-center p-4 animate-fade-in">
              <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl border border-slate-200 flex flex-col overflow-hidden max-h-[85vh]">
                <div className="bg-slate-800 p-4 text-white flex justify-between items-center">
                  <div className="flex items-center gap-2">
                    <TableIcon className="w-5 h-5 text-rose-400" />
                    <span className="font-black text-sm">성암농장 [{selectedMortalityDetail.category}] - {selectedMortalityDetail.monthLabel} 상세 기록</span>
                  </div>
                  <button onClick={() => setSelectedMortalityDetail(null)} className="p-2 bg-slate-100 rounded-lg transition-colors"><X className="w-5 h-5" /></button>
                </div>
                
                <div className="p-5 flex-1 overflow-y-auto space-y-4">
                  <p className="text-xs font-bold text-slate-500">
                    * {selectedMortalityDetail.category} 사육단계의 해당 월 상세 배치별 폐사/도태 수합 내역입니다.
                  </p>

                  <div className="overflow-x-auto border border-slate-300 rounded-xl bg-white shadow-inner max-h-[350px] no-scrollbar">
                    <table className="w-full text-xs font-mono border-collapse excel-table text-slate-700">
                      <thead>
                        <tr className="bg-slate-100 text-slate-500 font-bold text-center select-none">
                          <th className="p-1 bg-slate-200 border border-slate-300 w-10"></th>
                          <th className="p-1 bg-slate-200 border border-slate-300">A</th>
                          <th className="p-1 bg-slate-200 border border-slate-300">B</th>
                          <th className="p-1 bg-slate-200 border border-slate-300">C</th>
                        </tr>
                        <tr className="bg-slate-50 text-slate-700 font-black text-center">
                          <th className="p-2 bg-slate-100 border border-slate-300 text-slate-400">1</th>
                          <th className="p-2 border border-slate-300">배치 번호 (Batch ID)</th>
                          <th className="p-2 border border-slate-300 text-right">폐사/도태 수합 (Loss)</th>
                          <th className="p-2 border border-slate-300 text-right bg-rose-50/50">비중 (%)</th>
                        </tr>
                      </thead>
                      <tbody>
                        {selectedMortalityDetail.details.length === 0 ? (
                          <tr>
                            <td className="p-2 bg-slate-100 border border-slate-300 font-black text-center text-slate-400">2</td>
                            <td colSpan="3" className="p-6 text-center text-slate-400 font-sans">해당 기간에 보고된 폐사/도태 데이터가 없습니다.</td>
                          </tr>
                        ) : (
                          selectedMortalityDetail.details.map((item, idx) => {
                            const percentage = selectedMortalityDetail.total > 0 
                              ? ((item.count / selectedMortalityDetail.total) * 100).toFixed(1) 
                              : 0;
                            return (
                              <tr key={idx} className="hover:bg-slate-50 transition-colors">
                                <td className="p-2 bg-slate-100 border border-slate-300 font-black text-center text-slate-400">{idx + 2}</td>
                                <td className="p-2 border border-slate-300 text-center font-black text-slate-800">
                                  {String(item.batchId) === '8' ? '후보사' : `${item.batchId} 배치`}
                                </td>
                                <td className="p-2 border border-slate-300 text-right text-rose-600 font-black">{item.count} 두</td>
                                <td className="p-2 border border-slate-300 text-right font-black bg-rose-50/20 text-rose-800">{percentage}%</td>
                              </tr>
                            );
                          })
                        )}
                        {/* Total Row */}
                        <tr className="bg-amber-50/50 font-black text-slate-900">
                          <td className="p-2.5 bg-slate-200 border border-slate-300 text-center text-slate-500">{selectedMortalityDetail.details.length + 2}</td>
                          <td className="p-2.5 border border-slate-300 text-center font-sans">합계 (Total)</td>
                          <td className="p-2.5 border border-slate-300 text-right text-rose-700">{selectedMortalityDetail.total} 두</td>
                          <td className="p-2.5 border border-slate-300 text-right">100%</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
                
                <div className="bg-slate-50 p-4 border-t border-slate-100 flex justify-end gap-2">
                  <button onClick={() => setSelectedMortalityDetail(null)} className="bg-slate-800 hover:bg-slate-950 text-white font-black py-2.5 px-6 rounded-xl text-xs active:scale-95 transition-all">닫기</button>
                </div>
              </div>
            </div>
          )}
          
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
