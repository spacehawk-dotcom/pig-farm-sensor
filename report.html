    const CustomAlert = ({ message, onClose }) => (

    const CustomConfirm = ({ message, onConfirm, onCancel }) => (

        <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 animate-[slideUp_0.2s_ease-out]">

          <div className="flex justify-end gap-2">

          </div>

    );

    const fbInitConfig = {
      apiKey: "AIzaSyBlptGu2gTAQKVy_yDomKkNEd_el6c1PL0",
      authDomain: "sungamfarm.firebaseapp.com",
      projectId: "sungamfarm",
      storageBucket: "sungamfarm.firebasestorage.app",
      messagingSenderId: "811107235779",
      appId: "1:811107235779:web:ea65a74d09c37ba2136f76",
      databaseURL: "https://sungamfarm-default-rtdb.firebaseio.com"
    };

    if (!firebase.apps.length) firebase.initializeApp(fbInitConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const SOWS_COLLECTION_PATH = 'farms/sungamfarm/sows';
    const WEANING_RECORDS_PATH = 'farms/sungamfarm/weaning_records'; 
    const SETTINGS_PATH = 'farms/sungamfarm/settings'; 
    const SHIPMENTS_COLLECTION_PATH = 'farms/sungamfarm/shipments';
    const SHIPMENT_SUMMARIES_PATH = 'farms/sungamfarm/shipment_summaries';
    const GROWER_PATH = 'farms/sungamfarm/grower';
    const WEANING_PATH = 'farms/sungamfarm/weaning';
    const ACCIDENTS_PATH = 'farms/sungamfarm/accidents';
    const FEEDS_COLLECTION_PATH = 'farms/sungamfarm/feed_orders';

    const TempTable = ({ shipment, onAvgCalculated }) => {
      const [calcTemps, setCalcTemps] = useState(null);
      const [loadingTemp, setLoadingTemp] = useState(true);

      useEffect(() => {
        if (!shipment || !shipment.date) {
          setCalcTemps(null);
          setLoadingTemp(false);
          return;
        }

        const rtdb = firebase.database();
        
        // 입식일자 파악 (20일령 기준)
        const stockDate = shipment.stockingDate && shipment.stockingDate !== '9999-99-99'
          ? new Date(shipment.stockingDate)
          : new Date(new Date(shipment.date).getTime() - (115 * 86400000)); 

        const addDays = (date, days) => {
          const d = new Date(date);
          d.setDate(d.getDate() + days);
          return d;
        };

        // 구간별 날짜(시간) 범위 세팅
        const pStart = addDays(stockDate, 10);
        const pEnd = addDays(stockDate, 40);
        const gStart = addDays(stockDate, 41);
        const gEnd = addDays(stockDate, 80);
        const fStart = addDays(stockDate, 81);
        
        const fEnd = new Date(shipment.date);
        fEnd.setHours(23, 59, 59, 999);

        // 조기 출하 시, 각 구간의 마지막 날짜가 출하일을 넘지 못하게 차단
        const actualPEnd = new Date(Math.min(pEnd.getTime(), fEnd.getTime()));
        const actualGEnd = new Date(Math.min(gEnd.getTime(), fEnd.getTime()));
        const actualFEnd = fEnd;

        const startTimeStr = pStart.getTime().toString();
        const endTimeStr = fEnd.getTime().toString();

        rtdb.ref('history_logs').orderByKey().startAt(startTimeStr).endAt(endTimeStr).once('value')
          .then(snapshot => {
            const logs = snapshot.val();
            if (!logs) {
              setCalcTemps(null);
              setLoadingTemp(false);
              if (onAvgCalculated) onAvgCalculated('-');
              return;
            }

            let pSum = 0, pCount = 0;
            let gSum = 0, gCount = 0;
            let fSum = 0, fCount = 0;

            const batchIds = shipment.batchIds || [];

            // 해당 배치의 온도만 정밀하게 솎아내는 로직
            Object.entries(logs).forEach(([timestampMs, zones]) => {
              const logTime = Number(timestampMs);
              if (logTime > fEnd.getTime()) return; // 출하 이후 데이터 스킵

              Object.entries(zones).forEach(([zoneName, zoneData]) => {
                if (!zoneData || !zoneData.temp || zoneData.temp === "--") return;
                if (zoneName.includes('외부')) return;

                const t = Number(zoneData.temp);
                if (isNaN(t) || t < -10 || t > 50) return; // 통신 불량 등 비정상 온도(-99도 등) 배제

                let isTargetZone = false;

                // 1순위: 완벽한 배치 매칭 ('1배치' 찾을 때 '11배치'가 끌려오지 않도록 정규식 사용)
                if (batchIds.length > 0) {
                  isTargetZone = batchIds.some(bId => {
                    const regex = new RegExp(`(^|[^0-9])${bId}배치`);
                    return regex.test(zoneName);
                  });
                }

                // 2순위: 엉뚱한 배치(다른 방)의 기록이 내 데이터에 섞이는 현상 원천 차단
                if (zoneName.includes('배치') && !isTargetZone) return;

                // 타겟으로 확정된 배치(방)의 온도만 기간에 맞춰 합산
                if (isTargetZone || (!zoneName.includes('배치') && batchIds.length === 0)) {
                  if (logTime >= pStart.getTime() && logTime <= actualPEnd.getTime()) {
                    if (isTargetZone || zoneName.includes('이유') || zoneName.includes('자돈') || zoneName.includes('포유')) {
                      pSum += t; pCount++;
                    }
                  } 
                  else if (logTime >= gStart.getTime() && logTime <= actualGEnd.getTime()) {
                    if (isTargetZone || zoneName.includes('육성') || zoneName.includes('비육')) {
                      gSum += t; gCount++;
                    }
                  } 
                  else if (logTime >= fStart.getTime() && logTime <= actualFEnd.getTime()) {
                    if (isTargetZone || zoneName.includes('육성') || zoneName.includes('비육')) {
                      fSum += t; fCount++;
                    }
                  }
                }
              });
            });

            const pigletTemp = pCount > 0 ? (pSum / pCount).toFixed(1) : null;
            const growerTemp = gCount > 0 ? (gSum / gCount).toFixed(1) : null;
            const finisherTemp = fCount > 0 ? (fSum / fCount).toFixed(1) : null;

            setCalcTemps({ piglet: pigletTemp, grower: growerTemp, finisher: finisherTemp });
            
            let validSums = 0; let validCounts = 0;
            if(pigletTemp) { validSums += parseFloat(pigletTemp); validCounts++; }
            if(growerTemp) { validSums += parseFloat(growerTemp); validCounts++; }
            if(finisherTemp) { validSums += parseFloat(finisherTemp); validCounts++; }
            
            if (onAvgCalculated) {
              onAvgCalculated(validCounts > 0 ? (validSums / validCounts).toFixed(1) : '-');
            }
            setLoadingTemp(false);
          })
          .catch(err => {
            console.error("온도 데이터 로드 실패:", err);
            setLoadingTemp(false);
            if (onAvgCalculated) onAvgCalculated('-');
          });
      }, [shipment, onAvgCalculated]);

      if (loadingTemp) {
        return <div className="text-center py-4 text-xs font-bold text-slate-400 animate-pulse">온도 데이터 조회 중...</div>;
      }

      if (!calcTemps) {
        return <div className="text-center py-4 text-xs font-bold text-slate-400">온도 데이터 없음</div>;
      }

      return (
        <div className="grid grid-cols-3 gap-2 text-center text-xs font-bold text-slate-700">
          <div className="bg-white p-2 rounded-lg border border-slate-200">
            <span className="block text-[10px] text-slate-400 mb-1">자돈 (30~60일)</span>
            <span className="text-blue-600">{calcTemps.piglet || '-'}℃</span>
          </div>
          <div className="bg-white p-2 rounded-lg border border-slate-200">
            <span className="block text-[10px] text-slate-400 mb-1">육성 (61~100일)</span>
            <span className="text-emerald-600">{calcTemps.grower || '-'}℃</span>
          </div>
          <div className="bg-white p-2 rounded-lg border border-slate-200">
            <span className="block text-[10px] text-slate-400 mb-1">비육 (101일~출하)</span>
            <span className="text-rose-600">{calcTemps.finisher || '-'}℃</span>
          </div>
        </div>
      );
    };

    const App = () => {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      
      const [sows, setSows] = useState([]);
      const [weaningRecords, setWeaningRecords] = useState({});
      const [farmSettings, setFarmSettings] = useState({});
      const [shipments, setShipments] = useState([]);
      const [shipmentSummaries, setShipmentSummaries] = useState({});
      const [gBatches, setGBatches] = useState([]);
      const [wBatches, setWBatches] = useState([]);
      const [accidents, setAccidents] = useState([]);
      const [feedRecords, setFeedRecords] = useState([]);
      const [onepassBatches, setOnepassBatches] = useState([]);

      const [alertMsg, setAlertMsg] = useState(null);
      const [toastMsg, setToastMsg] = useState(null);
      const [confirmConfig, setConfirmConfig] = useState(null);

      const [searchQuery, setSearchQuery] = useState('');
      const [listFilter, setListFilter] = useState(null);

      const [selectedSowId, setSelectedSowId] = useState(null);
      const [showSowListModal, setShowSowListModal] = useState(false);
      
      const [showWeaningModal, setShowWeaningModal] = useState(false);
      const [isEditingWeaning, setIsEditingWeaning] = useState(false);
      const [weaningForm, setWeaningForm] = useState({ date: '', sowCount: '', totalWeaned: '' });
      const [confirmWeaningDelete, setConfirmWeaningDelete] = useState(false);
      
      const [showFormulaModal, setShowFormulaModal] = useState(false);
      const [showParityModal, setShowParityModal] = useState(false);
      const [showMonthlySowModal, setShowMonthlySowModal] = useState(false);
      const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());
      
      const [showAddSow, setShowAddSow] = useState(false);
      const [newSow, setNewSow] = useState({ sowNo: '', parity: 0, currentStatus: '이유' });

      const [selectedShipment, setSelectedShipment] = useState(null);
      const [modalAvgTemp, setModalAvgTemp] = useState('-');
      const [selectedFeedMonth, setSelectedFeedMonth] = useState(null);
      const [selectedSettlementMonth, setSelectedSettlementMonth] = useState(null);
      const [selectedMortalityDetail, setSelectedMortalityDetail] = useState(null);

      const [isFeedScheduleOpen, setIsFeedScheduleOpen] = useState(false);
      const [isFarrowingScheduleOpen, setIsFarrowingScheduleOpen] = useState(false);
      const [isMortalityScheduleOpen, setIsMortalityScheduleOpen] = useState(false);
      const [isShipmentScheduleOpen, setIsShipmentScheduleOpen] = useState(false);
      const [isSettlementScheduleOpen, setIsSettlementScheduleOpen] = useState(false);

      const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(null), 3000); };
      const showAlert = (msg) => setAlertMsg(msg);

      useEffect(() => {
        auth.signInAnonymously().catch(err => console.warn(err));
        const unsubscribeAuth = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          if (!currentUser) setLoading(false);
        });
        return () => unsubscribeAuth();
      }, []);

      useEffect(() => {
        if (!user) return;
        const unsubs = [];

        unsubs.push(db.collection(SOWS_COLLECTION_PATH).onSnapshot(s => {
          const sowsData = s.docs.map(doc => ({ id: doc.id, ...doc.data() })).filter(sow => sow.sowNo); 
          sowsData.sort((a, b) => String(a.sowNo || '').localeCompare(String(b.sowNo || '')));
          setSows(sowsData); setLoading(false);
        }, e => { console.error(e); setLoading(false); }));

        unsubs.push(db.collection(WEANING_RECORDS_PATH).onSnapshot(s => {
          const records = {}; s.docs.forEach(doc => { records[doc.id] = doc.data(); });
          setWeaningRecords(records);
        }));

        unsubs.push(db.collection(SETTINGS_PATH).doc('main').onSnapshot(doc => {
          if (doc.exists) setFarmSettings(doc.data());
        }));

        unsubs.push(db.collection(SHIPMENTS_COLLECTION_PATH).onSnapshot(s => setShipments(s.docs.map(doc => doc.data()))));
        unsubs.push(db.collection(SHIPMENT_SUMMARIES_PATH).onSnapshot(s => {
          const summaries = {}; s.docs.forEach(doc => summaries[doc.id] = doc.data()); setShipmentSummaries(summaries);
        }));

        unsubs.push(db.collection(GROWER_PATH).onSnapshot(s => setGBatches(s.docs.map(doc => ({ id: doc.data().id || parseInt(doc.id.replace('batch_', '')), ...doc.data() })))));
        unsubs.push(db.collection(WEANING_PATH).onSnapshot(s => setWBatches(s.docs.map(doc => ({ id: doc.data().id || parseInt(doc.id.replace('batch_', '')), ...doc.data() })))));
        unsubs.push(db.collection(ACCIDENTS_PATH).onSnapshot(s => setAccidents(s.docs.map(doc => ({ id: doc.id, ...doc.data() })))));
        unsubs.push(db.collection(FEEDS_COLLECTION_PATH).onSnapshot(s => setFeedRecords(s.docs.map(doc => doc.data()))));
        unsubs.push(db.collection('pig_onepass_batches').onSnapshot(s => setOnepassBatches(s.docs.map(doc => doc.data()))));

        return () => unsubs.forEach(unsub => unsub());
      }, [user]);

      const parseValidDate = (dateStr) => {
        if (!dateStr) return null;
        const str = String(dateStr).trim();
        if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return new Date(str);
        const parts = str.split(/[-/.]/);
        if (parts.length === 3) return new Date(parts[0].length === 2 ? 2000 + parseInt(parts[0]) : parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
        else if (parts.length === 2) return new Date(new Date().getFullYear(), parseInt(parts[0]) - 1, parseInt(parts[1]));
        const parsed = new Date(str); return isNaN(parsed.getTime()) ? null : parsed;
      };

      const formatDate = (dateObj) => {
        if (!dateObj) return '';
        return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
      };

      const getExpectedFarrow = (matingDate) => { const d = parseValidDate(matingDate); if (!d) return ''; d.setDate(d.getDate() + 115); return formatDate(d); };
      const getWeaningThursday = (farrowDateStr) => { const d = parseValidDate(farrowDateStr); if (!d) return null; d.setDate(d.getDate() + (d.getDay() === 0 ? -6 : 1 - d.getDay()) + 24); return formatDate(d); };
      const addDays = (dateStr, days) => { const d = parseValidDate(dateStr); if (!d) return ''; d.setDate(d.getDate() + days); return formatDate(d); };
      const subtractDays = (dateStr, days) => { const d = parseValidDate(dateStr); if (!d) return ''; d.setDate(d.getDate() - days); return formatDate(d); };
      const getMonday = (dateStr) => { const d = parseValidDate(dateStr); if (!d) return null; d.setDate(d.getDate() + (d.getDay() === 0 ? -6 : 1 - d.getDay())); return formatDate(d); };
      const getDiffDays = (d1, d2) => { const t1=new Date(d1).getTime(), t2=new Date(d2).getTime(); return isNaN(t1)||isNaN(t2) ? 0 : Math.floor((t2-t1)/86400000); };

      const getStatusColor = (status) => {
        switch(status) { case '포유': return 'text-emerald-600 bg-emerald-50 border-emerald-200'; case '임신': return 'text-blue-600 bg-blue-50 border-blue-200'; case '재발': return 'text-rose-600 bg-rose-50 border-rose-200'; default: return 'text-slate-600 bg-slate-100 border-slate-200'; }
      };

      const filteredSows = useMemo(() => {
        let result = sows.filter(Boolean);
        if (listFilter) {
          if (listFilter.type === 'status') result = result.filter(s => (s.currentStatus || '이유') === listFilter.value);
          else if (listFilter.type === 'parity') result = result.filter(s => Number(s.parity || 0) === Number(listFilter.value));
          else if (listFilter.type === 'expectedMonth') result = result.filter(s => { if (!s.matingDate || s.currentStatus === '포유' || s.currentStatus === '재발') return false; const exp = getExpectedFarrow(s.matingDate); return exp && exp.startsWith(listFilter.value); });
          else if (listFilter.type === 'farrowingWeek') result = result.filter(s => { const currMon = getMonday(formatDate(new Date())); const mAct = s.history?.some(r => r.date && getMonday(r.date) === listFilter.value); const exp = s.matingDate && s.currentStatus !== '재발' ? getExpectedFarrow(s.matingDate) : null; const mExp = exp && getMonday(exp) === listFilter.value; const mFall = !s.matingDate && s.currentStatus === '포유' && listFilter.value === currMon; return mAct || mExp || mFall; });
          else if (listFilter.type === 'activityMonth') result = result.filter(s => { let mThis = false; if (s.matingDate) { const p = parseValidDate(s.matingDate); if (p && formatDate(p).startsWith(listFilter.value)) mThis = true; } let fThis = false; if (s.history) fThis = s.history.some(r => { if (r.date) { const p = parseValidDate(r.date); return p && formatDate(p).startsWith(listFilter.value); } return false; }); return mThis || fThis; });
        }
        if (searchQuery) result = result.filter(s => String(s.sowNo || '').toLowerCase().includes(searchQuery.toLowerCase()));
        return result;
      }, [sows, searchQuery, listFilter]);

      const dashboardStats = useMemo(() => {
        const stats = {
          total: sows.filter(s => { const p = Number(s.parity)||0; return p >= 1 || (p === 0 && s.currentStatus === '임신'); }).length,
          status: { '이유': 0, '임신': 0, '포유': 0, '재발': 0 }, parity: {}
        };
        const oneYearAgoStr = formatDate(new Date(new Date().setFullYear(new Date().getFullYear() - 1)));
        
        sows.forEach(s => {
          const p = Number(s.parity) || 0;
          if (p === 0 && s.currentStatus !== '임신') return; 
          const status = s.currentStatus || '이유';
          if (stats.status[status] !== undefined) stats.status[status]++;
          stats.parity[p] = (stats.parity[p] || 0) + 1;
        });

        let manualYearlyWeaned = 0;
        Object.entries(weaningRecords).forEach(([d, v]) => { if (d >= oneYearAgoStr && v) manualYearlyWeaned += Number(v.totalWeaned || 0); });

        let farmingStatusYearlyShipped = 0;
        let yearlyWeightGainKg = 0; let yearlyTotalShippedWeight = 0; 

        shipments.forEach(record => {
          if (record && record.date && record.date >= oneYearAgoStr) {
            const count = Number(record.count || 0);
            farmingStatusYearlyShipped += count;
            const summary = shipmentSummaries[record.date];
            const avgWeight = summary && summary.avgWeight && !isNaN(Number(summary.avgWeight)) ? Number(summary.avgWeight) : 115;
            yearlyTotalShippedWeight += (avgWeight * count);
            yearlyWeightGainKg += (Math.max(0, avgWeight - 6) * count);
          }
        });

        if (farmingStatusYearlyShipped === 0) {
            onepassBatches.forEach(b => {
                if (b.date && b.date >= oneYearAgoStr) {
                    farmingStatusYearlyShipped += (b.headCount || 0);
                    yearlyTotalShippedWeight += (b.liveWeight || 0); 
                    const avgLw = b.headCount > 0 ? (b.liveWeight / b.headCount) : 115;
                    yearlyWeightGainKg += (Math.max(0, avgLw - 6) * (b.headCount || 0));
                }
            });
        }

        let yearlyTotalFeedKg = 0; let yearlyMarketFeedKg = 0;  
        feedRecords.forEach(record => {
          const receiptDate = record.deliveryDate || record.receivingDate || record.date || '';
          if (receiptDate >= oneYearAgoStr) {
            const weightKg = (Number(record.quantity) || Number(record.amount) || Number(record.weight) || 0) * 1000; 
            yearlyTotalFeedKg += weightKg;
            const type = record.feedType || record.type || record.feedName || '기타';
            if (type === '젖돈' || type === '육성') yearlyMarketFeedKg += weightKg;
          }
        });

        const avgSows = farmSettings.avgSowCount > 0 ? farmSettings.avgSowCount : stats.total;
        const autoShipped = Math.floor(manualYearlyWeaned * 0.95);
        const yearlyShipped = farmingStatusYearlyShipped > 0 ? farmingStatusYearlyShipped : autoShipped;

        stats.psy = avgSows > 0 ? (manualYearlyWeaned / avgSows).toFixed(1) : "0.0";
        stats.msy = avgSows > 0 ? (yearlyShipped / avgSows).toFixed(1) : "0.0";
        stats.avgSows = avgSows; stats.manualYearlyWeaned = manualYearlyWeaned; stats.yearlyShipped = yearlyShipped;
        stats.dbYearlyShipped = farmingStatusYearlyShipped; stats.autoShipped = autoShipped;
        
        stats.yearlyTotalFeedKg = yearlyTotalFeedKg; stats.yearlyMarketFeedKg = yearlyMarketFeedKg;
        stats.yearlyWeightGainKg = yearlyWeightGainKg; stats.yearlyTotalShippedWeight = yearlyTotalShippedWeight;
        stats.totalFcr = yearlyWeightGainKg > 0 ? (yearlyTotalFeedKg / yearlyWeightGainKg).toFixed(2) : "0.00";
        stats.marketFcr = yearlyWeightGainKg > 0 ? (yearlyMarketFeedKg / yearlyWeightGainKg).toFixed(2) : "0.00";

        return stats;
      }, [sows, weaningRecords, farmSettings, shipments, shipmentSummaries, feedRecords, onepassBatches]);

      const monthlyActivityStats = useMemo(() => {
        const sm = {};
        sows.forEach(s => {
          if (s.matingDate) { const d = parseValidDate(s.matingDate); if (d) { const ym = formatDate(d).substring(0,7); sm[ym] = sm[ym] || {month:ym, mated:0, farrowed:0}; sm[ym].mated++; } }
          if (s.history) s.history.forEach(r => { if (r.date) { const d = parseValidDate(r.date); if (d) { const ym = formatDate(d).substring(0,7); sm[ym] = sm[ym] || {month:ym, mated:0, farrowed:0}; sm[ym].farrowed++; } } });
        });
        return Object.values(sm).sort((a, b) => b.month.localeCompare(a.month));
      }, [sows]);

      const monthlyFeedStats = useMemo(() => {
        const cy = new Date().getFullYear().toString(); const stats = {};
        for (let i = 1; i <= new Date().getMonth() + 1; i++) stats[`${cy}-${String(i).padStart(2,'0')}`] = { total: 0, types: {}, orders: [] };
        feedRecords.forEach(r => {
          const dt = r.deliveryDate || r.receivingDate || r.date || ''; if (!dt.startsWith(cy)) return;
          const ym = dt.substring(0, 7); 
          let type = r.feedType || r.type || r.feedName || '기타 사료'; 
          const bulkBin = r.bulkBin || '';
          const amt = Number(r.quantity) || Number(r.amount) || Number(r.weight) || Number(r.kg) || 0;
          
          if (String(bulkBin).includes('지대') && !String(type).includes('첨가제')) {
            const num = String(bulkBin).match(/\d+/); 
            type = num ? `지대 ${num[0]}` : '지대';
          }
          
          if (!stats[ym]) stats[ym] = { total: 0, types: {}, orders: [] };
          stats[ym].total += amt; stats[ym].types[type] = (stats[ym].types[type] || 0) + amt; stats[ym].orders.push(r);
        });
        Object.keys(stats).forEach(ym => stats[ym].orders.sort((a,b) => (b.deliveryDate||b.date||'').localeCompare(a.deliveryDate||a.date||'')));
        return Object.entries(stats).map(([ym, d]) => ({ ym, ...d })).sort((a, b) => b.ym.localeCompare(a.ym));
      }, [feedRecords]);

      const monthlyCategoryDeathStats = useMemo(() => {
        const currentYear = new Date().getFullYear().toString();
        const stats = { '이유': {}, '육성': {} };
        ['이유', '육성'].forEach(cat => {
            for (let m = 1; m <= 12; m++) {
                const mm = String(m).padStart(2, '0');
                stats[cat][mm] = { total: 0, details: [] };
            }
        });
        
        accidents.forEach(acc => {
            if (!acc) return;
            const dateStr = acc.date || '';
            if (dateStr && dateStr.startsWith(currentYear)) {
                const m = dateStr.substring(5, 7);
                const count = Number(acc.count) || 0;
                if (count <= 0) return;
                const stage = acc.stage || '';
                const cat = (stage === 'weaning') ? '이유' : '육성';
                const batchId = acc.batchId || "알수없음";
                if (stats[cat] && stats[cat][m]) {
                    stats[cat][m].total += count;
                    const existing = stats[cat][m].details.find(d => String(d.batchId) === String(batchId));
                    if (existing) {
                        existing.count += count;
                    } else {
                        stats[cat][m].details.push({ batchId, count });
                    }
                }
            }
        });
        return stats;
      }, [accidents]);

      const monthlySettlementStats = useMemo(() => {
        const cy = new Date().getFullYear().toString(); 
        const stats = {};

        onepassBatches.forEach(b => {
          if (!b.date || !b.date.startsWith(cy)) return;
          const ym = b.date.substring(0, 7);
          if (!stats[ym]) stats[ym] = { ym, count: 0, revenue: 0, liveWeight: 0, topGradeCount: 0, gradeCount: 0, batches: [] };
          stats[ym].count += (b.headCount || 0);
          stats[ym].revenue += (b.realPrice !== undefined ? b.realPrice : (b.totalPrice || 0));
          stats[ym].liveWeight += (b.liveWeight || 0);
          b.details?.forEach(d => { stats[ym].gradeCount++; if (d.grade === '1+' || d.grade === '1') stats[ym].topGradeCount++; });
          stats[ym].batches.push(b);
        });

        if (cy === '2026') {
          const historicalData = {
            '2026-01': { count: 375, revenue: 162660014, weight: 42000, topRatio: 58.9 },
            '2026-02': { count: 302, revenue: 131215088, weight: 35662, topRatio: 57.3 },
            '2026-03': { count: 524, revenue: 225939714, weight: 61600, topRatio: 45.8 },
            '2026-04': { count: 374, revenue: 179311755, weight: 41590, topRatio: 50.3 },
            '2026-05': { count: 376, revenue: 198974082, weight: 41790, topRatio: 57.7 },
            '2026-06': { count: 376, revenue: 199780987, weight: 42140, topRatio: 60.1 }
          };

          Object.keys(historicalData).forEach(ym => {
            const data = historicalData[ym];
            stats[ym] = {
              ym: ym,
              count: data.count,
              revenue: data.revenue,
              liveWeight: data.weight,
              gradeCount: data.count,
              topGradeCount: Math.round(data.count * (data.topRatio / 100)),
              batches: [{ 
                date: `${ym}-28`, 
                headCount: data.count,
                liveWeight: data.weight,
                topRatio: data.topRatio,
                realPrice: data.revenue
              }]
            };
          });
        }
        return Object.values(stats).sort((a, b) => b.ym.localeCompare(a.ym));
      }, [onepassBatches]);

      const sortedWeaningRecords = useMemo(() => {
        return Object.entries(weaningRecords)
          .filter(([_, data]) => Boolean(data))
          .map(([date, data]) => ({ date, ...data }))
          .sort((a, b) => b.date.localeCompare(a.date));
      }, [weaningRecords]);

      const groupedShipments = useMemo(() => {
        const grps = {};
        shipments.forEach(s => {
          if (!s.date) return;
          if (!grps[s.date]) grps[s.date] = { date: s.date, totalCount: 0, sumAgeWeight: 0, validAgeCount: 0, isExpected: false, stockingDate: '9999-99-99', batchIds: new Set() };
          const c = Number(s.count) || 0; grps[s.date].totalCount += c;
          let rDate = s.stockingDate || '';
          if (!rDate && s.batchId) { const b = gBatches.find(x => x.id === s.batchId); if(b) rDate = b.penDates?.[s.penIndex] || b.weaningDate || b.date; }
          if (rDate && rDate < grps[s.date].stockingDate) grps[s.date].stockingDate = rDate;
          if (s.batchId) grps[s.date].batchIds.add(s.batchId);
          if (rDate) { const a = getDiffDays(rDate, s.date) + 20; if (a > 0) { grps[s.date].sumAgeWeight += a * c; grps[s.date].validAgeCount += c; } }
        });
        gBatches.forEach(b => {
          b.pendingShipments?.forEach(ps => {
            if (!ps.date) return;
            if (!grps[ps.date]) grps[ps.date] = { date: ps.date, totalCount: 0, sumAgeWeight: 0, validAgeCount: 0, isExpected: true, stockingDate: '9999-99-99', batchIds: new Set() };
            else grps[ps.date].isExpected = true;
            ps.items?.forEach(item => {
              const c = Number(item.count) || 0; const pIdx = item.pIdx || 0; const pd = b.penDates?.[pIdx] || b.weaningDate || b.date;
              grps[ps.date].totalCount += c;
              if (pd && pd < grps[ps.date].stockingDate) grps[ps.date].stockingDate = pd;
              grps[ps.date].batchIds.add(b.id);
              if (pd) { const a = getDiffDays(pd, ps.date) + 20; if (a > 0) { grps[ps.date].sumAgeWeight += a * c; grps[ps.date].validAgeCount += c; } }
            });
          });
        });
        const todayStr = formatDate(new Date());
        return Object.values(grps).map(g => ({
          date: g.date, count: g.totalCount, age: g.validAgeCount > 0 ? Math.round(g.sumAgeWeight / g.validAgeCount) : '-',
          weight: shipmentSummaries[g.date]?.avgWeight || '-', isExpected: g.date > todayStr || g.isExpected,
          stockingDate: g.stockingDate !== '9999-99-99' ? g.stockingDate : null, batchIds: Array.from(g.batchIds)
        })).sort((a, b) => b.date.localeCompare(a.date));
      }, [shipments, gBatches, shipmentSummaries]);

      const openAllList = () => { setListFilter(null); setSearchQuery(''); setShowSowListModal(true); };
      const openFilteredList = (type, value) => { setListFilter({ type, value }); setSearchQuery(''); setShowSowListModal(true); };

      const openWeaningModal = (stat = null) => {
        if (stat) { setIsEditingWeaning(true); setWeaningForm({ date: stat.date, sowCount: stat.sowCount, totalWeaned: stat.totalWeaned }); setConfirmWeaningDelete(false); } 
        else { setIsEditingWeaning(false); setWeaningForm({ date: formatDate(new Date()), sowCount: '', totalWeaned: '' }); }
        setShowWeaningModal(true);
      };

      const handleSaveWeaning = (e) => {
        e.preventDefault();
        const d = weaningForm.date; if (!d) return;
        db.collection(WEANING_RECORDS_PATH).doc(d).set({ date: d, sowCount: Number(weaningForm.sowCount), totalWeaned: Number(weaningForm.totalWeaned), updatedAt: new Date().toISOString() }, { merge: true })
          .then(() => { showToast("저장되었습니다."); setShowWeaningModal(false); })
          .catch(err => { console.error(err); showAlert("저장 중 오류가 발생했습니다."); });
      };

      const handleDeleteWeaning = () => {
        if (!isEditingWeaning || !weaningForm.date) return;
        db.collection(WEANING_RECORDS_PATH).doc(weaningForm.date).delete()
          .then(() => { showToast("삭제되었습니다."); setShowWeaningModal(false); })
          .catch(err => { console.error(err); showAlert("삭제 중 오류가 발생했습니다."); });
      };

      const handleSaveSetting = (key, value) => {
        db.collection(SETTINGS_PATH).doc('main').set({ [key]: Number(value), updatedAt: new Date().toISOString() }, { merge: true })
          .then(() => showToast("설정이 저장되었습니다."));
      };

      const handleSaveMonthlySowCount = (ym, val) => {
        const numVal = Number(val);
        db.collection(SETTINGS_PATH).doc('main').set({ monthlySowCounts: { [ym]: numVal > 0 ? numVal : null } }, { merge: true });
      };

      const handleAddSow = (e) => {
        e.preventDefault();
        if (!newSow.sowNo) return;
        db.collection(SOWS_COLLECTION_PATH).add({ sowNo: newSow.sowNo, parity: Number(newSow.parity), currentStatus: newSow.currentStatus, createdAt: new Date().toISOString() })
          .then(() => { showToast("등록 완료!"); setShowAddSow(false); setNewSow({ sowNo: '', parity: 0, currentStatus: '이유' }); })
          .catch(() => showAlert("등록 실패"));
      };

      const downloadMonthlyFeedExcel = (mStat) => {
        if (!mStat?.orders?.length) return;
        const ed = mStat.orders.map((o, i) => {
            const rd = o.deliveryDate || o.receivingDate || o.date || '-';
            let bStr = `벌크 ${o.bulkBin}호`; let tStr = o.feedType || '-';
            if (String(o.bulkBin).includes('지대')) { 
              const n = String(o.bulkBin).match(/\d+/); 
              bStr = n ? `${n[0]}` : '-'; 
              if (!tStr.includes('첨가제')) tStr = '지대'; 
            }
            return { 'No.': i+1, '입고 일시': rd, '사료 종류': tStr, '벌크통 번호': bStr, '주문량 (톤)': parseFloat(o.quantity||0).toFixed(1), '단위': o.unit||'톤' };
        });
        ed.push({ 'No.': '합계', '입고 일시': '', '사료 종류': '', '벌크통 번호': '', '주문량 (톤)': parseFloat(mStat.total||0).toFixed(1), '단위': '톤' });
        const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ed), "사료입고내역"); XLSX.writeFile(wb, `성암농장_사료입고내역_${mStat.ym}.xlsx`); showToast("다운로드 완료");
      };

      const downloadSettlementExcel = (mStat) => {
        if (!mStat?.batches?.length) return;
        const ed = mStat.batches.map(b => {
            const avgLw = b.headCount > 0 ? Number((b.liveWeight / b.headCount).toFixed(1)) : 0;
            return { '출하 일자': b.date||'-', '출하 두수 (두)': b.headCount||0, '총 생체중 (kg)': b.liveWeight||0, '두당 생체중 (kg)': avgLw, '1등급 이상 출현율 (%)': b.topRatio||0, '실 정산금액 (원)': b.realPrice!==undefined ? b.realPrice : (b.totalPrice||0) };
        });
        const avgTotLw = mStat.count > 0 ? Number((mStat.liveWeight / mStat.count).toFixed(1)) : 0;
        const avgTopR = mStat.gradeCount > 0 ? Math.round((mStat.topGradeCount / mStat.gradeCount)*100) : 0;
        ed.push({ '출하 일자': '합계 / 평균', '출하 두수 (두)': mStat.count, '총 생체중 (kg)': mStat.liveWeight, '두당 생체중 (kg)': avgTotLw, '1등급 이상 출현율 (%)': avgTopR, '실 정산금액 (원)': mStat.revenue });
        const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ed), "출하정산내역"); XLSX.writeFile(wb, `성암농장_출하정산내역_${mStat.ym}.xlsx`); showToast("다운로드 완료");
      };

      const downloadWeaningExcel = () => {
        const ed = sortedWeaningRecords.map(r => ({ '이유일': r.date, '모돈수': r.sowCount, '이유두수': r.totalWeaned }));
        if(ed.length === 0) { showAlert("데이터가 없습니다."); return; }
        const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ed), "주간이유성적"); XLSX.writeFile(wb, `성암농장_주간이유성적.xlsx`); showToast("다운로드 완료");
      };

      const downloadMortalityExcel = () => {
        const ed = [];
        ['이유', '육성'].forEach(cat => {
            Object.entries(monthlyCategoryDeathStats[cat]).forEach(([mm, data]) => {
                if(data.total > 0) {
                    data.details.forEach(d => {
                        ed.push({ '사육단계': cat, '월': `${mm}월`, '배치': String(d.batchId) === '8' ? '후보사' : `${d.batchId} 배치`, '폐사/도태(두)': d.count });
                    });
                }
            });
        });
        if(ed.length === 0) { showAlert("다운로드할 데이터가 없습니다."); return; }
        const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ed), "월간폐사도태"); XLSX.writeFile(wb, `성암농장_월간폐사도태.xlsx`); showToast("다운로드 완료");
      };

      if (loading) return <div className="flex items-center justify-center h-screen bg-slate-50"><p className="text-lg font-bold text-slate-500 animate-pulse">데이터베이스 연결 중...</p></div>;

      return (
        <div className="min-h-screen bg-slate-50 pb-24 font-sans">
          {alertMsg && <CustomAlert message={alertMsg} onClose={() => setAlertMsg(null)} />}
          {confirmConfig && <CustomConfirm message={confirmConfig.message} onConfirm={confirmConfig.onConfirm} onCancel={confirmConfig.onCancel} />}
          {toastMsg && <div className="fixed bottom-6 left-6 z-[100] bg-slate-900 text-white px-5 py-3.5 rounded-xl shadow-xl flex items-center gap-2.5 animate-[slideUp_0.2s_ease-out]"><span>✔️</span><span className="text-xs font-bold">{toastMsg}</span></div>}

          <header className="bg-white border-b border-slate-200 sticky top-0 z-10 p-4 shadow-sm">
            <div className="max-w-3xl mx-auto flex justify-between items-center">
              <h1 className="text-xl font-black text-slate-800 tracking-tight flex items-center">
                <Baby c="w-6 h-6 mr-2 text-rose-500" /> 성적 분석 <span className="ml-2 text-[10px] bg-slate-100 text-slate-500 px-2 py-1 rounded-md font-bold">LIVE</span>
              </h1>
              <div className="flex items-center gap-2">
                <a href="onepass.html" className="bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-1.5 rounded-lg shadow-sm text-[11px] font-bold flex items-center gap-1 active:scale-95 transition hover:bg-emerald-100"><TableIcon c="w-3.5 h-3.5" /> 원패스</a>
                <a href="index.html" className="bg-indigo-50 text-indigo-700 border border-indigo-200 px-2.5 py-1.5 rounded-lg shadow-sm text-[11px] font-bold flex items-center gap-1 active:scale-95 transition hover:bg-indigo-100"><Activity c="w-3.5 h-3.5" /> 사육현황</a>
                <button onClick={openAllList} className="bg-slate-800 text-white px-2.5 py-1.5 rounded-lg shadow-sm text-[11px] font-bold flex items-center gap-1 active:scale-95 transition hover:bg-slate-700"><Search c="w-3.5 h-3.5" /> 검색/목록</button>
              </div>
            </div>
          </header>

          <main className="max-w-3xl mx-auto p-4">
            {sows.length > 0 ? (
              <div className="mb-6 space-y-5 animate-[slideUp_0.3s_ease-out]">
                
                {/* 생산성 주요 연산 카드 그리드 */}
                <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                  <div onClick={() => setShowMonthlySowModal(true)} className="bg-slate-800 text-white p-3.5 rounded-2xl flex flex-col justify-between shadow-md cursor-pointer hover:shadow-lg active:scale-95 transition-all relative overflow-hidden">
                    <div className="flex flex-col mb-2 relative z-10"><div className="flex justify-between items-start"><span className="text-[11px] font-bold text-slate-300">연평균 상시 모돈수</span><ChevronRight c="w-4 h-4 text-slate-500" /></div><span className="text-[9px] text-slate-500 mt-0.5">월말 기록 입력 및 평균 계산</span></div>
                    <div className="flex items-baseline relative z-10"><span className="text-3xl font-black text-white px-1">{(farmSettings || {}).avgSowCount > 0 ? (farmSettings || {}).avgSowCount : ((dashboardStats || {}).total || 0)}</span><span className="text-xs ml-1 font-bold text-slate-400">두</span></div>
                  </div>

                          const pct = selectedMortalityDetail.total > 0 ? ((item.count / selectedMortalityDetail.total) * 100).toFixed(1) : 0;
                          return (
                            <tr key={idx} className="hover:bg-slate-50 transition-colors">
                              <td className="p-2 bg-slate-100 border border-slate-300 font-black text-center text-slate-400">{idx + 2}</td><td className="p-2 border border-slate-300 text-center font-black text-slate-800">{String(item.batchId) === '8' ? '후보사' : `${item.batchId} 배치`}</td><td className="p-2 border border-slate-300 text-right text-rose-600 font-black">{item.count} 두</td><td className="p-2 border border-slate-300 text-right font-black bg-rose-50/20 text-rose-800">{pct}%</td>
                            </tr>
                          );
                        })}
                        <tr className="bg-amber-50/50 font-black text-slate-900"><td className="p-2.5 bg-slate-200 border border-slate-300 text-center text-slate-500">{selectedMortalityDetail.details.length + 2}</td><td className="p-2.5 border border-slate-300 text-center font-sans">합계 (Total)</td><td className="p-2.5 border border-slate-300 text-right text-rose-700">{selectedMortalityDetail.total} 두</td><td className="p-2.5 border border-slate-300 text-right">100%</td></tr>
                      </tbody>
                    </table>
                  </div>
                </div>
                <div className="bg-slate-50 p-4 border-t border-slate-100 flex justify-end gap-2"><button onClick={() => setSelectedMortalityDetail(null)} className="bg-slate-800 hover:bg-slate-950 text-white font-black py-2.5 px-6 rounded-xl text-xs active:scale-95 transition-all">닫기</button></div>
              </div>
            </div>
          )}
        </div>
      );
    }
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
