<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>성암농장 사료 주문</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM (Production v18) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel (안정적인 버전 7.23.6 고정) -->
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>

    <!-- Firebase SDK (호환 버전: 단일 HTML 환경용) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        /* Excel Table borders styling */
        .excel-table th, .excel-table td {
            border: 1px solid #cbd5e1; /* slate-300 */
        }
        .excel-table th {
            background-color: #f1f5f9; /* slate-100 */
        }
        @keyframes slideUp { 
            from { transform: translateY(100%); opacity: 0; } 
            to { transform: translateY(0); opacity: 1; } 
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* Input number spinner 제거 */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="bg-stone-100 text-slate-800 antialiased">

    <div id="root"></div>

    <script type="text/babel">
        /* @jsx React.createElement */
        /* @jsxFrag React.Fragment */

        const { useState, useEffect, useMemo, useRef } = React;

        // --- 내장 SVG 아이콘 컴포넌트 ---
        const Container = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" class={className}><rect width="20" height="12" x="2" y="6" rx="2"/><path d="M12 12h.01"/><path d="M17 12h.01"/><path d="M7 12h.01"/></svg>;
        const PenTool = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class={className}><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>;
        const CalendarIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class={className}><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>;
        const ChevronDown = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class={className}><path d="m6 9 6 6 6-6"/></svg>;
        const ChevronLeft = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class={className}><path d="m15 18-6-6 6-6"/></svg>;
        const ChevronRight = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class={className}><path d="m9 18 6-6-6-6"/></svg>;
        const PlusCircle = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class={className}><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>;
        const Calculator = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class={className}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>;
        const Table = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class={className}><path d="M12 3v18"/><path d="M3 12h18"/><rect width="18" height="18" x="3" y="3" rx="2"/></svg>;
        const MessageSquare = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class={className}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>;
        const Trash2 = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>;
        const Edit3 = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class={className}><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>;
        const CalendarRange = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class={className}><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M3 10h18"/><path d="M8 2v4"/><path d="M17 14h-6"/><path d="M13 18H7"/><path d="M7 14h.01"/><path d="M17 18h.01"/></svg>;
        const X = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;
        const Send = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class={className}><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>;
        const Share2 = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class={className}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg>;
        const Copy = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class={className}><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>;

        // --- Firebase Init ---
        const firebaseConfig = {
            apiKey: "AIzaSyBlptGu2gTAQKVy_yDomKkNEd_el6c1PL0",
            authDomain: "sungamfarm.firebaseapp.com",
            projectId: "sungamfarm",
            storageBucket: "sungamfarm.firebasestorage.app",
            messagingSenderId: "811107235779",
            appId: "1:811107235779:web:ea65a74d09c37ba2136f76"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        const FEED_ORDERS_COLLECTION_PATH = 'farms/sungamfarm/feed_orders';
        const WEANING_RECORDS_COLLECTION_PATH = 'farms/sungamfarm/weaning_records';
        const WEANING_BATCHES_COLLECTION_PATH = 'farms/sungamfarm/weaning';
        const GROWER_BATCHES_COLLECTION_PATH = 'farms/sungamfarm/grower';

        // --- 모달 헬퍼 컴포넌트 ---
        const CustomAlert = ({ message, onClose }) => (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full p-5 text-center animate-[slideUp_0.2s_ease-out]">
                    <div className="w-12 h-12 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-3">
                        <span className="text-amber-500 text-xl font-bold">!</span>
                    </div>
                    <p className="text-sm font-bold text-slate-700 mb-5">{message}</p>
                    <button onClick={onClose} className="w-full bg-slate-800 text-white font-black py-3 rounded-xl hover:bg-slate-700 active:scale-95 transition-all">
                        확인
                    </button>
                </div>
            </div>
        );

        const CustomConfirm = ({ message, onConfirm, onCancel }) => (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full p-5 text-center animate-[slideUp_0.2s_ease-out]">
                    <div className="w-12 h-12 bg-rose-100 rounded-full flex items-center justify-center mx-auto mb-3">
                        <span className="text-rose-500 text-xl font-bold">?</span>
                    </div>
                    <p className="text-sm font-bold text-slate-700 mb-5">{message}</p>
                    <div className="flex gap-2">
                        <button onClick={onCancel} className="flex-1 bg-slate-100 text-slate-600 font-black py-3 rounded-xl hover:bg-slate-200 active:scale-95 transition-all">취소</button>
                        <button onClick={onConfirm} className="flex-1 bg-rose-500 text-white font-black py-3 rounded-xl hover:bg-rose-600 active:scale-95 transition-all">확인</button>
                    </div>
                </div>
            </div>
        );

        function App() {
            const [user, setUser] = useState(null);
            const [orders, setOrders] = useState([]);
            const [loading, setLoading] = useState(true);

            // 공통 토스트 및 팝업
            const [alertMsg, setAlertMsg] = useState(null);
            const [confirmConfig, setConfirmConfig] = useState(null);
            const [toastConfig, setToastConfig] = useState({ show: false, message: '', bgColor: 'bg-slate-900' });

            // 오늘 다음날 날짜 획득 함수 (기본 입고일용)
            const getTomorrowDateString = () => {
                const tomorrow = new Date();
                tomorrow.setDate(tomorrow.getDate() + 1);
                const year = tomorrow.getFullYear();
                const month = String(tomorrow.getMonth() + 1).padStart(2, '0');
                const day = String(tomorrow.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            // 벌크 사료 주문 상태 및 입고 날짜 입력 상태
            const [bulkFeedType, setBulkFeedType] = useState('젖돈');
            const [bulkBin, setBulkBin] = useState('1');
            const [bulkQuantity, setBulkQuantity] = useState('');
            const [bulkDeliveryDate, setBulkDeliveryDate] = useState(getTomorrowDateString());

            // 수정 관련 제어
            const [editingOrderId, setEditingOrderId] = useState(null);

            // 공유 및 달력 모달 제어
            const [showShareModal, setShowShareModal] = useState(false);
            const [showCalendarModal, setShowCalendarModal] = useState(false);
            const [shareNote, setShareNote] = useState('');
            const [shareType, setShareType] = useState('bag'); // 'bag' or 'bulk'
            
            const [calendarYear, setCalendarYear] = useState(new Date().getFullYear());
            const [calendarMonth, setCalendarMonth] = useState(new Date().getMonth());

            // 계산기 접기/펴기
            const [showCalculator, setShowCalculator] = useState(false);

            // 사육현황 앱 실시간 동기화용 수집 상태
            const [weaningRecords, setWeaningRecords] = useState({});
            const [batchList, setBatchList] = useState([]);

            // 계산기 지대 수동 재고 입력창 상태
            const [stockF1, setStockF1] = useState('');
            const [stockF2, setStockF2] = useState('');
            const [stockF3, setStockF3] = useState('');

            // 실주문량 수동 입력/자동 계산 연동 상태
            const [netF1, setNetF1] = useState(0);
            const [netF2, setNetF2] = useState(0);
            const [netF3, setNetF3] = useState(0);

            // 계산기 지대 입고 날짜 입력창 상태 (추가됨)
            const [calcDeliveryDate, setCalcDeliveryDate] = useState(getTomorrowDateString());

            // 첨가제 추가 주문 입력 상태
            const [orderFishMeal, setOrderFishMeal] = useState('');       // 어분
            const [orderSpecialPlus, setOrderSpecialPlus] = useState(''); // 스페셜플러스

            // 돈사별 지대 배치 메모 입력 상태 (자돈 A, B, C동)
            const [alloc, setAlloc] = useState({
                barnA: { f1: '', f2: '', f3: '' },
                barnB: { f1: '', f2: '', f3: '' },
                barnC: { f1: '', f2: '', f3: '' }
            });

            // 목요일 기준 역산 4주치 날짜 구조 빌드
            const targetThursdays = useMemo(() => {
                const dates = [];
                const today = new Date();
                const dayOfWeek = today.getDay();
                const daysToThursday = (4 - dayOfWeek + 7) % 7;
                const targetThursday = new Date(today);
                targetThursday.setDate(today.getDate() + daysToThursday);

                for (let i = 3; i >= 0; i--) {
                    const d = new Date(targetThursday);
                    d.setDate(targetThursday.getDate() - (i * 7));
                    const year = d.getFullYear();
                    const month = String(d.getMonth() + 1).padStart(2, '0');
                    const day = String(d.getDate()).padStart(2, '0');
                    dates.push({
                        dbKey: `${year}-${month}-${day}`,
                        display: `${month}/${day}`,
                        weekLabel: i === 3 ? 'w3' : i === 2 ? 'w2' : i === 1 ? 'w1' : 'w0'
                    });
                }
                return dates;
            }, []);

            // 금주 1호 사료 수동 입력두수 상태
            const [manualW0, setManualW0] = useState('');

            const showAlert = (message) => setAlertMsg(message);
            const showConfirm = (message, onConfirm) => {
                setConfirmConfig({ message, onConfirm: () => { onConfirm(); setConfirmConfig(null); }, onCancel: () => setConfirmConfig(null) });
            };
            const showToast = (message, bgColor = 'bg-slate-900') => {
                setToastConfig({ show: true, message, bgColor });
                setTimeout(() => setToastConfig({ show: false, message: '', bgColor: 'bg-slate-900' }), 3000);
            };

            const todayDateString = useMemo(() => {
                const today = new Date();
                const year = today.getFullYear();
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const day = String(today.getDate()).padStart(2, '0');
                const weekDays = ['일', '월', '화', '수', '목', '금', '토'];
                return `${year}년 ${month}월 ${day}일 (${weekDays[today.getDay()]})`;
            }, []);

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        await auth.signInAnonymously();
                        db.collection(FEED_ORDERS_COLLECTION_PATH).onSnapshot(
                            snapshot => setOrders(snapshot.docs.map(doc => {
                                const data = doc.data();
                                return data ? { id: doc.id, ...data } : null;
                            }).filter(Boolean).sort((a,b) => b.date.localeCompare(a.date))),
                            err => console.error("Firestore Error:", err)
                        );
                    } catch (e) {
                        console.error("Auth Init Error:", e);
                    }
                };
                initAuth();
            }, []);

            useEffect(() => {
                auth.signInAnonymously().catch(err => console.warn("익명 로그인 실패:", err));
                const unsubscribeAuth = auth.onAuthStateChanged((currentUser) => {
                    setUser(currentUser);
                    if (!currentUser) setLoading(false);
                });
                return () => unsubscribeAuth();
            }, []);

            useEffect(() => {
                if (!user) return;

                const unsubscribeWeaningRecords = db.collection(WEANING_RECORDS_COLLECTION_PATH)
                    .onSnapshot(
                        (snapshot) => {
                            const records = {};
                            snapshot.docs.forEach(doc => {
                                const data = doc.data();
                                if (data) records[doc.id] = data;
                            });
                            setWeaningRecords(records);
                        },
                        (error) => console.warn("사육현황 성적 수집 실패:", error)
                    );

                const unsubscribeWeaningBatches = db.collection(WEANING_BATCHES_COLLECTION_PATH)
                    .onSnapshot(
                        (snapshot) => {
                            const weaningList = snapshot.docs.map(doc => ({ id: doc.id, type: 'weaning', ...doc.data() }));
                            setBatchList(prev => [...prev.filter(b => b.type !== 'weaning'), ...weaningList]);
                        },
                        (error) => console.warn("이유사 배치 수집 실패:", error)
                    );

                const unsubscribeGrowerBatches = db.collection(GROWER_BATCHES_COLLECTION_PATH)
                    .onSnapshot(
                        (snapshot) => {
                            const growerList = snapshot.docs.map(doc => ({ id: doc.id, type: 'grower', ...doc.data() }));
                            setBatchList(prev => [...prev.filter(b => b.type !== 'grower'), ...growerList]);
                        },
                        (error) => console.warn("육성사 배치 수집 실패:", error)
                    );

                return () => {
                    unsubscribeWeaningRecords();
                    unsubscribeWeaningBatches();
                    unsubscribeGrowerBatches();
                };
            }, [user]);

            const computedWeanCounts = useMemo(() => {
                const getCountForDate = (dateStr) => {
                    if (weaningRecords[dateStr] && weaningRecords[dateStr].totalWeaned > 0) {
                        return { count: weaningRecords[dateStr].totalWeaned, source: 'record' };
                    }

                    let sum = 0;
                    batchList.forEach(b => {
                        if (b.penDates && b.penDetails) {
                            b.penDates.forEach((pd, idx) => {
                                if (pd === dateStr) {
                                    sum += (b.penDetails[idx] || 0);
                                }
                            });
                        }
                    });

                    if (sum > 0) {
                        return { count: sum, source: 'batch' };
                    }

                    return { count: 0, source: 'none' };
                };

                const w3Data = getCountForDate(targetThursdays[0].dbKey);
                const w2Data = getCountForDate(targetThursdays[1].dbKey);
                const w1Data = getCountForDate(targetThursdays[2].dbKey);
                const w0Data = getCountForDate(targetThursdays[3].dbKey);
                
                return {
                    w3: w3Data,
                    w2: w2Data,
                    w1: w1Data,
                    w0: w0Data
                };
            }, [weaningRecords, batchList, targetThursdays]);

            useEffect(() => {
                if (computedWeanCounts.w0.count > 0 && manualW0 === '') {
                    setManualW0(computedWeanCounts.w0.count.toString());
                }
            }, [computedWeanCounts.w0]);

            // 사료 주문 계산기 상의 주차별 데이터 우선순위 분기 로직 적용
            const weanCountsForCalc = useMemo(() => {
                const getSourceForWeek = (weekLabel, index) => {
                    const dbKey = targetThursdays[index].dbKey;
                    const recordVal = weaningRecords[dbKey]?.totalWeaned || 0;
                    
                    // 배치 수량 연산
                    let batchSum = 0;
                    batchList.forEach(b => {
                        if (b.penDates && b.penDetails) {
                            b.penDates.forEach((pd, idx) => {
                                if (pd === dbKey) {
                                    batchSum += (b.penDetails[idx] || 0);
                                }
                            });
                        }
                    });

                    if (weekLabel === 'w0') {
                        // 금주(w0)는 수기 성적이 우선 (1순위: record, 2순위: batch)
                        if (recordVal > 0) return { count: recordVal, source: 'record' };
                        if (batchSum > 0) return { count: batchSum, source: 'batch' };
                        return { count: 0, source: 'none' };
                    } else {
                        // 지난 주차(w1, w2, w3)는 돈방 배치 데이터가 우선 (1순위: batch, 2순위: record)
                        if (batchSum > 0) return { count: batchSum, source: 'batch' };
                        if (recordVal > 0) return { count: recordVal, source: 'record' };
                        return { count: 0, source: 'none' };
                    }
                };

                const w3Obj = getSourceForWeek('w3', 0);
                const w2Obj = getSourceForWeek('w2', 1);
                const w1Obj = getSourceForWeek('w1', 2);
                const w0Obj = getSourceForWeek('w0', 3);

                return {
                    w3: w3Obj.count,
                    w2: w2Obj.count,
                    w1: w1Obj.count,
                    w0: manualW0 !== '' ? (parseInt(manualW0) || 0) : w0Obj.count,
                    w3Source: w3Obj.source,
                    w2Source: w2Obj.source,
                    w1Source: w1Obj.source,
                    w0Source: w0Obj.source
                };
            }, [weaningRecords, batchList, targetThursdays, manualW0]);

            // Fetching real-time pen locations matching target dates
            const getActiveBarnsForDate = (dateStr) => {
                const activeBarns = [];
                batchList.forEach(b => {
                    const numId = b.id ? String(b.id).replace('batch_', '') : '';
                    const hasDateInPens = b.penDates && b.penDates.some((pd, idx) => pd === dateStr && (b.penDetails?.[idx] > 0));
                    if (hasDateInPens) {
                        const shortName = b.type === 'weaning' ? `이유 ${numId}` : (numId === '8' ? '후보사' : `육성 ${numId}`);
                        if (!activeBarns.includes(shortName)) {
                            activeBarns.push(shortName);
                        }
                    }
                });
                return activeBarns.length > 0 ? activeBarns.join(', ') : '-';
            };

            const dailyOrders = useMemo(() => {
                const todayStr = `${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}-${String(new Date().getDate()).padStart(2, '0')}`;
                const filtered = orders.filter(o => o.date.startsWith(todayStr));
                const typeOrder = { '젖돈': 1, '육성': 2, '임신': 3, '포유': 4, '후보돈': 5, '첨가제': 6 };
                return filtered.sort((a, b) => {
                    if (typeOrder[a.feedType] !== typeOrder[b.feedType]) return typeOrder[a.feedType] - typeOrder[b.feedType];
                    return b.date.localeCompare(a.date);
                });
            }, [orders]);

            const bagOrders = useMemo(() => {
                return dailyOrders
                    .filter(o => o.bulkBin && o.bulkBin.startsWith('지대'))
                    .sort((a, b) => String(a.bulkBin).localeCompare(String(b.bulkBin), undefined, { numeric: true }));
            }, [dailyOrders]);

            const bulkOrders = useMemo(() => {
                return dailyOrders.filter(o => !o.bulkBin || !o.bulkBin.startsWith('지대'));
            }, [dailyOrders]);

            const dailySummaryStats = useMemo(() => {
                const stats = { 
                    '젖돈': 0, '육성': 0, '임신': 0, '포유': 0, '후보돈': 0, 
                    '1호': 0, '2호': 0, '3호': 0, '어분': 0, '스페셜플러스': 0, 
                    'total': 0 
                };
                dailyOrders.forEach(order => {
                    const q = parseFloat(order.quantity) || 0;
                    const bin = order.bulkBin || '';
                    
                    if (bin.startsWith('지대')) {
                        if (bin === '지대 1') stats['1호'] += q;
                        else if (bin === '지대 2') stats['2호'] += q;
                        else if (bin === '지대 3') stats['3호'] += q;
                        else if (bin === '지대 어분') stats['어분'] += q;
                        else if (bin === '지대 스페셜플러스') stats['스페셜플러스'] += q;
                    } else {
                        if (stats[order.feedType] !== undefined) {
                            stats[order.feedType] += q;
                        }
                    }
                    stats.total += q;
                });
                return {
                    '젖돈': parseFloat(stats['젖돈'].toFixed(1)),
                    '육성': parseFloat(stats['육성'].toFixed(1)),
                    '임신': parseFloat(stats['임신'].toFixed(1)),
                    '포유': parseFloat(stats['포유'].toFixed(1)),
                    '후보돈': parseFloat(stats['후보돈'].toFixed(1)),
                    '1호': parseFloat(stats['1호'].toFixed(3)),
                    '2호': parseFloat(stats['2호'].toFixed(3)),
                    '3호': parseFloat(stats['3호'].toFixed(3)),
                    '어분': parseFloat(stats['어분'].toFixed(3)),
                    '스페셜플러스': parseFloat(stats['스페셜플러스'].toFixed(3)),
                    'total': parseFloat(stats.total.toFixed(3))
                };
            }, [dailyOrders]);

            const calcProgramResults = useMemo(() => {
                const parseVal = (v) => isNaN(parseInt(v)) ? 0 : parseInt(v);
                
                const n3 = Math.ceil(parseVal(weanCountsForCalc.w3) / 33) || 0;
                const n2 = Math.ceil(parseVal(weanCountsForCalc.w2) / 33) || 0;
                const n1 = Math.ceil(parseVal(weanCountsForCalc.w1) / 33) || 0;
                const n0 = Math.ceil(parseVal(weanCountsForCalc.w0) / 33) || 0;

                const w3_f3 = n3 * 5 * 1.3;
                const w2_f3 = n2 * 8;
                const w1_f2 = n1 * 8 * 0.8;
                const w0_f1 = n0 > 0 ? (n0 * 3) + 10 : 0;
                const w0_f2 = n0 * 1.5;

                const totalF1 = parseFloat(w0_f1.toFixed(1));
                const totalF2 = parseFloat((w1_f2 + w0_f2).toFixed(1));
                const totalF3 = parseFloat((w3_f3 + w2_f3).toFixed(1));

                return {
                    n3, n2, n1, n0,
                    w3_f3, w2_f3, w1_f2, w0_f1, w0_f2,
                    totalF1, totalF2, totalF3
                };
            }, [weanCountsForCalc]);

            // 재고 및 실주문량 산출 (수기 입력이 가능하도록 자동 계산값을 상태에 반영)
            useEffect(() => {
                const s1 = parseFloat(stockF1) || 0;
                const s2 = parseFloat(stockF2) || 0;
                const s3 = parseFloat(stockF3) || 0;

                const rawNet1 = Math.max(0, calcProgramResults.totalF1 - s1);
                const rawNet2 = Math.max(0, calcProgramResults.totalF2 - s2);
                const rawNet3 = Math.max(0, calcProgramResults.totalF3 - s3);

                const roundTo5Unit = (val) => {
                    const rounded = Math.round(val / 5) * 5;
                    return Math.max(0, rounded);
                };

                setNetF1(roundTo5Unit(rawNet1));
                setNetF2(roundTo5Unit(rawNet2));
                setNetF3(roundTo5Unit(rawNet3));
            }, [calcProgramResults.totalF1, calcProgramResults.totalF2, calcProgramResults.totalF3, stockF1, stockF2, stockF3]);

            // 실시간 돈사 배치 입력 누계 검산
            const allocTotals = useMemo(() => {
                let f1 = 0, f2 = 0, f3 = 0;
                ['barnA', 'barnB', 'barnC'].forEach(bKey => {
                    f1 += parseInt(alloc[bKey].f1) || 0;
                    f2 += parseInt(alloc[bKey].f2) || 0;
                    f3 += parseInt(alloc[bKey].f3) || 0;
                });
                return { f1, f2, f3 };
            }, [alloc]);

            const handleAddCalculatorToOrders = () => {
                const nF1 = parseInt(netF1) || 0;
                const nF2 = parseInt(netF2) || 0;
                const nF3 = parseInt(netF3) || 0;

                showConfirm(`재고 차감 및 확인된 최종 실주문량 1호(${nF1}포), 2호(${nF2}포), 3호(${nF3}포)를 당일 주문에 즉시 추가하시겠습니까?`, async () => {
                    try {
                        const now = new Date();
                        const dateString = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                        const deliveryDateString = calcDeliveryDate; // 계산기 입고 날짜 적용
                        
                        const batch = db.batch();
                        let count = 0;

                        if (nF1 > 0) {
                            const ref = db.collection(FEED_ORDERS_COLLECTION_PATH).doc();
                            const qtyTons = parseFloat((nF1 * 10 / 1000).toFixed(3));
                            batch.set(ref, {
                                feedType: '젖돈',
                                bulkBin: '지대 1',
                                quantity: qtyTons,
                                unit: '톤',
                                date: dateString,
                                deliveryDate: deliveryDateString
                            });
                            count++;
                        }
                        if (nF2 > 0) {
                            const ref = db.collection(FEED_ORDERS_COLLECTION_PATH).doc();
                            const qtyTons = parseFloat((nF2 * 20 / 1000).toFixed(3));
                            batch.set(ref, {
                                feedType: '젖돈',
                                bulkBin: '지대 2',
                                quantity: qtyTons,
                                unit: '톤',
                                date: dateString,
                                deliveryDate: deliveryDateString
                            });
                            count++;
                        }
                        if (nF3 > 0) {
                            const ref = db.collection(FEED_ORDERS_COLLECTION_PATH).doc();
                            const qtyTons = parseFloat((nF3 * 20 / 1000).toFixed(3));
                            batch.set(ref, {
                                feedType: '젖돈',
                                bulkBin: '지대 3',
                                quantity: qtyTons,
                                unit: '톤',
                                date: dateString,
                                deliveryDate: deliveryDateString
                            });
                            count++;
                        }

                        // 어분(Fish Meal) 추가 등록
                        const fMeal = parseInt(orderFishMeal) || 0;
                        if (fMeal > 0) {
                            const ref = db.collection(FEED_ORDERS_COLLECTION_PATH).doc();
                            batch.set(ref, {
                                feedType: '젖돈',
                                bulkBin: '지대 어분',
                                quantity: parseFloat((fMeal * 20 / 1000).toFixed(3)),
                                unit: '톤',
                                date: dateString,
                                deliveryDate: deliveryDateString
                            });
                            count++;
                        }

                        // 스페셜플러스 추가 등록
                        const sPlus = parseInt(orderSpecialPlus) || 0;
                        if (sPlus > 0) {
                            const ref = db.collection(FEED_ORDERS_COLLECTION_PATH).doc();
                            batch.set(ref, {
                                feedType: '젖돈',
                                bulkBin: '지대 스페셜플러스',
                                quantity: parseFloat((sPlus * 20 / 1000).toFixed(3)),
                                unit: '톤',
                                date: dateString,
                                deliveryDate: deliveryDateString
                            });
                            count++;
                        }

                        if (count > 0) {
                            await batch.commit();
                            showToast("✨ 실주문량 산출값 " + count + "건이 규격톤수로 변환되어 추가되었습니다!", "bg-emerald-600");
                            
                            // 계산기 완료 시 인풋 상태 초기화
                            setOrderFishMeal('');
                            setOrderSpecialPlus('');
                            setShowCalculator(false);
                        } else {
                            showAlert("실제 추가할 주문 수량이 존재하지 않습니다. (재고가 필요량보다 많거나 보정 후 0포가 됨)");
                        }
                    } catch (err) {
                        showAlert("주문 추가 실패: " + err.message);
                    }
                });
            };

            const resetForms = () => {
                setEditingOrderId(null);
                setBulkFeedType('젖돈');
                setBulkBin('1');
                setBulkQuantity('');
                setBulkDeliveryDate(getTomorrowDateString());
            };

            const handleSubmitBulkOrder = async (e) => {
                e.preventDefault();
                if (!user) return;

                const qVal = parseFloat(bulkQuantity);
                if (!bulkFeedType || !bulkBin || isNaN(qVal) || qVal <= 0) {
                    showAlert("모든 값을 올바르게 기입해 주세요.");
                    return;
                }

                const now = new Date();
                const dateString = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

                try {
                    if (editingOrderId) {
                        await db.collection(FEED_ORDERS_COLLECTION_PATH).doc(editingOrderId).update({
                            feedType: bulkFeedType, 
                            bulkBin, 
                            quantity: qVal, 
                            date: dateString + " (수정됨)",
                            deliveryDate: bulkDeliveryDate
                        });
                        showToast("📝 벌크 사료 주문서가 수정되었습니다.", "bg-amber-600");
                    } else {
                        await db.collection(FEED_ORDERS_COLLECTION_PATH).add({
                            feedType: bulkFeedType, 
                            bulkBin, 
                            quantity: qVal, 
                            unit: '톤', 
                            date: dateString,
                            deliveryDate: bulkDeliveryDate
                        });
                        showToast("✨ 새 벌크 주문이 등록되었습니다!", "bg-emerald-600");
                    }
                    resetForms();
                } catch (err) {
                    showAlert("저장 실패: " + err.message);
                }
            };

            const handleEditClick = (order) => {
                const isBag = order.bulkBin.startsWith('지대');
                if (isBag) {
                    showToast("💡 지대 사료는 계산기를 통해 등록되므로, 삭제 후 계산기에서 다시 등록해 주세요.", "bg-amber-600");
                    return;
                }
                setEditingOrderId(order.id);
                setBulkFeedType(order.feedType);
                setBulkBin(order.bulkBin);
                setBulkQuantity(order.quantity);
                setBulkDeliveryDate(order.deliveryDate || getTomorrowDateString());
                window.scrollTo({ top: 0, behavior: 'smooth' });
                showToast("✏️ 벌크 사료 주문 정보 수정 상태로 돌입합니다.", "bg-indigo-600");
            };

            const handleDeleteClick = (id) => {
                showConfirm("이 주문 내역을 삭제하시겠습니까?", async () => {
                    try {
                        await db.collection(FEED_ORDERS_COLLECTION_PATH).doc(id).delete();
                        showToast("🗑️ 성공적으로 삭제되었습니다.", "bg-slate-700");
                        if (editingOrderId === id) resetForms();
                    } catch (err) {
                        showAlert("삭제 실패: " + err.message);
                    }
                });
            };

            // Formatting Kakao text for copy and share memo
            const generatedKakaoText = useMemo(() => {
                if (dailyOrders.length === 0) return "당일 등록된 사료 주문 내역이 없습니다.";

                let text = `-------------------------\n`;
                if (shareType === 'bag') {
                    text += `■ 지대 사료 주문\n`;
                    bagOrders.forEach((order) => {
                        const bags = order.bulkBin === '지대 1' ? Math.round(parseFloat(order.quantity) * 100) : Math.round(parseFloat(order.quantity) * 50);
                        const label = order.bulkBin.replace('지대 1', '1호').replace('지대 2', '2호').replace('지대 3', '3호').replace('지대 ', '');
                        text += `${label} ${bags}포\n`;
                    });

                    // 돈사별 배치 계획 메모 실시간 주입 ('자돈 A', '자돈 B', '자돈 C' 반영)
                    const hasAlloc = ['barnA', 'barnB', 'barnC'].some(b => ['f1', 'f2', 'f3'].some(f => (parseInt(alloc[b][f]) || 0) > 0));
                    if (hasAlloc) {
                        text += `\n[🏡 돈사별 지대 배치 계획]\n`;
                        ['A', 'B', 'C'].forEach(barnLetter => {
                            const key = `barn${barnLetter}`;
                            const f1 = parseInt(alloc[key].f1) || 0;
                            const f2 = parseInt(alloc[key].f2) || 0;
                            const f3 = parseInt(alloc[key].f3) || 0;
                            if (f1 > 0 || f2 > 0 || f3 > 0) {
                                const details = [];
                                if (f1 > 0) details.push(`1호 ${f1}포`);
                                if (f2 > 0) details.push(`2호 ${f2}포`);
                                if (f3 > 0) details.push(`3호 ${f3}포`);
                                const labelName = barnLetter === 'A' ? '자돈 A' : barnLetter === 'B' ? '자돈 B' : '자돈 C';
                                text += `- ${labelName}: ${details.join(', ')}\n`;
                            }
                        });
                    }
                } else {
                    // unique 입고 예정일 추출하여 벌크 상단에 단 한 번만 배치
                    const uniqueDates = [...new Set(bulkOrders.map(o => o.deliveryDate).filter(Boolean))].sort();
                    if (uniqueDates.length > 0) {
                        const formattedDates = uniqueDates.map(d => {
                            const parts = d.split('-');
                            return parts.length >= 3 ? `${parts[1]}/${parts[2]}` : d;
                        }).join(', ');
                        text += `■ 입고 예정일: ${formattedDates}\n`;
                    }

                    // 벌크 사료 종류별 총합 우선 집계 및 상단 표기
                    const bulkSummary = {};
                    bulkOrders.forEach(order => {
                        if (!bulkSummary[order.feedType]) bulkSummary[order.feedType] = 0;
                        bulkSummary[order.feedType] += parseFloat(order.quantity) || 0;
                    });

                    Object.keys(bulkSummary).forEach(type => {
                        text += `- ${type}: ${bulkSummary[type].toFixed(1)} 톤\n`;
                    });
                    text += `-------------------------\n\n`;
                    text += `■ 벌크통 사료 개별 주문 내역\n`;
                    bulkOrders.forEach((order) => {
                        // 개별 라인 뒤에 붙던 입고 날짜 꼬리표를 제거하여 가독성 강화
                        text += `${order.bulkBin}번 [${order.feedType}] ${parseFloat(order.quantity).toFixed(1)}톤\n`;
                    });
                }

                if (shareNote.trim() !== '') {
                    text += `\n-------------------------\n`;
                    text += `${shareNote}`;
                }

                return text.trim();
            }, [dailyOrders, bagOrders, bulkOrders, shareNote, shareType, alloc]);

            const sendNativeShare = async () => {
                if (navigator.share) {
                    try {
                        await navigator.share({ title: '성암농장 사료 주문서', text: generatedKakaoText });
                        showToast('💬 주문서 공유가 완료되었습니다.', 'bg-emerald-600');
                        setShowShareModal(false);
                    } catch (err) {
                        if (err.name !== 'AbortError') showToast('공유가 중단되었습니다.');
                    }
                } else {
                    copyShareText();
                }
            };

            const copyShareText = () => {
                const tempTextArea = document.createElement("textarea");
                tempTextArea.value = generatedKakaoText;
                tempTextArea.style.position = "fixed";
                document.body.appendChild(tempTextArea);
                tempTextArea.select();
                tempTextArea.setSelectionRange(0, 99999);
                try {
                    if (document.execCommand('copy')) {
                        showToast('📋 텍스트가 복사되었습니다! 카톡을 실행합니다.', 'bg-indigo-600');
                        setTimeout(() => window.location.href = "kakaolink://", 800);
                    } else {
                        showToast('❌ 복사에 실패했습니다.', 'bg-rose-600');
                    }
                } catch (err) {
                    showToast('❌ 클립보드를 지원하지 않는 환경입니다.', 'bg-rose-600');
                }
                document.body.removeChild(tempTextArea);
            };

            const calendarDaysData = useMemo(() => {
                const firstDayIndex = new Date(calendarYear, calendarMonth, 1).getDay();
                const totalDaysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();
                const today = new Date();

                const cells = [];
                let currentMonthTotal = 0;

                for (let i = 0; i < firstDayIndex; i++) cells.push({ isEmpty: true });

                for (let day = 1; day <= totalDaysInMonth; day++) {
                    const compareDateStr = `${calendarYear}-${String(calendarMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                    
                    // 매치 타겟: 입고 예정일(deliveryDate)이 있으면 사용하고, 없을 시 등록 시각(date)의 앞 10자리를 기준으로 달력 매칭
                    const dayOrders = orders.filter(o => {
                        const targetDate = o.deliveryDate ? o.deliveryDate : o.date.substring(0, 10);
                        return targetDate === compareDateStr;
                    });
                    
                    let dayTotal = 0;

                    const badges = dayOrders.map(o => {
                        const q = parseFloat(o.quantity) || 0;
                        dayTotal += q;
                        currentMonthTotal += q;
                        return { type: o.feedType, bin: o.bulkBin, qty: q };
                    });

                    cells.push({
                        isEmpty: false,
                        dayNum: day,
                        dayOfWeek: new Date(calendarYear, calendarMonth, day).getDay(),
                        isToday: today.getDate() === day && today.getMonth() === calendarMonth && today.getFullYear() === calendarYear,
                        dayTotal,
                        badges
                    });
                }
                return { cells, currentMonthTotal };
            }, [orders, calendarYear, calendarMonth]);

            const handlePrevMonth = () => {
                if (calendarMonth === 0) { setCalendarMonth(11); setCalendarYear(y => y - 1); } 
                else setCalendarMonth(m => m - 1);
            };
            const handleNextMonth = () => {
                if (calendarMonth === 11) { setCalendarMonth(0); setCalendarYear(y => y + 1); } 
                else setCalendarMonth(m => m + 1);
            };

            return (
                <div className="max-w-6xl mx-auto px-4 py-6 md:py-10">
                    
                    {alertMsg && <CustomAlert message={alertMsg} onClose={() => setAlertMsg(null)} />}
                    {confirmConfig && <CustomConfirm message={confirmConfig.message} onConfirm={confirmConfig.onConfirm} onCancel={confirmConfig.onCancel} />}

                    <div className={`fixed bottom-6 right-6 z-[100] text-white px-5 py-3.5 rounded-xl shadow-xl flex items-center gap-2.5 transition-all duration-300 transform ${toastConfig.show ? 'translate-y-0 opacity-100' : 'translate-y-10 opacity-0 pointer-events-none'} ${toastConfig.bgColor}`}>
                        <span>✔️</span>
                        <span className="text-sm font-medium">{toastConfig.message}</span>
                    </div>

                    <header className="mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-stone-200/60">
                        <div className="flex items-center gap-3">
                            <div className="p-3 bg-amber-100 rounded-xl text-amber-700">
                                <Container className="w-8 h-8" />
                            </div>
                            <div>
                                <h1 className="text-2xl font-bold tracking-tight text-slate-900">성암농장 사료 주문</h1>
                                <p class="text-sm text-slate-500 mt-0.5">사료 벌크통 잔량 관리 및 당일 주문 시스템</p>
                            </div>

                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-md rounded-2xl shadow-2xl border border-slate-100 flex flex-col overflow-hidden animate-[slideUp_0.2s_ease-out]">
                                <div className={`${shareType === 'bag' ? 'bg-amber-500 text-slate-950' : 'bg-blue-600 text-white'} p-5 flex justify-between items-center transition-colors duration-300`}>
                                    <div className="flex items-center gap-2 font-bold text-base">
                                        <Send className="w-5 h-5" />
                                        <span>{shareType === 'bag' ? '지대 사료 주문 카톡 전송' : '벌크통 사료 주문 카톡 전송'}</span>
                                    </div>
                                    <button onClick={() => setShowShareModal(false)} className={`hover:bg-white/20 p-1.5 rounded-lg transition-all ${shareType === 'bag' ? 'text-slate-900 hover:text-black' : 'text-slate-200 hover:text-white'}`}><X className="w-5 h-5" /></button>
                                </div>
                                <div className="p-6 space-y-4 flex-1">
                                    <div className="space-y-1.5">
                                        <label className="block text-xs font-bold text-slate-700">실시간 미리보기</label>
                                        <div className="w-full bg-stone-50 border border-stone-200 text-stone-800 p-4 rounded-xl text-xs font-mono h-56 overflow-y-auto whitespace-pre-wrap leading-relaxed shadow-inner">
                                            {generatedKakaoText}
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-slate-700 mb-1.5">전달사항 추가</label>
                                        <div className="flex flex-col gap-2">
                                            <div className="relative">
                                                <select onChange={e => { if (e.target.value !== 'direct') { setShareNote(e.target.value); e.target.value = 'direct'; } }}
                                                    defaultValue="direct" className="w-full pl-3.5 pr-8 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-500 text-xs font-bold appearance-none cursor-pointer">
                                                    <option value="direct">자주 쓰는 전달사항 선택 (클릭)</option>
                                                    <option value="스페셜플러스">스페셜플러스</option>
                                                    <option value="내일 첫차 배송 부탁드립니다.">내일 첫차 배송 부탁드립니다.</option>
                                                    <option value="내일 막차 배송 부탁드립니다.">내일 막차 배송 부탁드립니다.</option>
                                                    <option value="오늘 막차 배송 부탁드립니다.">오늘 막차 배송 부탁드립니다.</option>
                                                    <option value="경사로 진입 시 주의 부탁드립니다.">경사로 진입 시 주의 부탁드립니다.</option>
                                                </select>
                                                <div className="absolute right-2.5 top-2 text-slate-400 pointer-events-none"><ChevronDown className="w-4.5 h-4.5" /></div>
                                            </div>
                                            <textarea 
                                                value={shareNote} 
                                                onChange={e => setShareNote(e.target.value)} 
                                                placeholder="직접 기입하거나 수정할 수 있습니다. (엔터를 눌러 여러 줄 입력 가능)" 
                                                rows="3"
                                                className="w-full px-3.5 py-2 bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 text-xs font-bold shadow-sm resize-none"
                                            ></textarea>
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-slate-50 p-4 border-t border-slate-100 flex flex-col gap-2">
                                    <button onClick={sendNativeShare} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl text-xs flex items-center justify-center gap-2 shadow-md transition-all">
                                        <Share2 className="w-4 h-4" />모바일 카톡 직접 전송
                                    </button>
                                    <div className="flex gap-2">
                                        <button onClick={copyShareText} className="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 px-4 rounded-xl text-xs flex items-center justify-center gap-1.5 transition-all">
                                            <Copy className="w-4 h-4" />복사 후 톡 실행
                                        </button>
                                        <button onClick={() => setShowShareModal(false)} className="bg-slate-200 hover:bg-slate-300 text-slate-600 font-bold py-3 px-4 rounded-xl text-xs transition-all">닫기</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showCalendarModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-4xl rounded-2xl shadow-2xl border border-slate-100 flex flex-col overflow-hidden animate-[slideUp_0.2s_ease-out] max-h-[90vh]">
                                <div className="bg-slate-800 p-4 text-white flex justify-between items-center">
                                    <div className="flex items-center gap-2 font-bold text-base"><CalendarRange className="w-5 h-5 text-amber-400" /><span>주문 일정표 달력</span></div>
                                    <button onClick={() => setShowCalendarModal(false)} className="text-slate-300 hover:text-white hover:bg-white/10 p-1.5 rounded-lg transition-all"><X className="w-5 h-5" /></button>
                                </div>
                                <div className="p-4 sm:p-6 space-y-4 overflow-y-auto flex-1">
                                    <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-b border-slate-100 pb-4">
                                        <div className="flex items-center gap-4 bg-slate-100 p-1.5 rounded-xl self-center sm:self-auto">
                                            <button onClick={handlePrevMonth} className="p-2 bg-white rounded-lg shadow-sm text-slate-600 hover:text-blue-600 transition-colors"><ChevronLeft className="w-4 h-4" /></button>
                                            <span className="font-black text-slate-800 min-w-[100px] text-center tracking-tight text-lg">{calendarYear}년 {calendarMonth + 1}월</span>
                                            <button onClick={handleNextMonth} className="p-2 bg-white rounded-lg shadow-sm text-slate-600 hover:text-blue-600 transition-colors"><ChevronRight className="w-4 h-4" /></button>
                                        </div>
                                        <div className="bg-amber-50 border border-amber-200 text-amber-950 px-4 py-3 rounded-xl font-bold text-xs flex items-center justify-between sm:justify-start gap-3 w-full sm:w-auto">
                                            <span>선택 월 총합계</span>
                                            <span className="text-lg text-amber-600 font-black">{calendarDaysData.currentMonthTotal.toFixed(3)} <span className="text-xs">톤</span></span>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-7 gap-1 text-center font-bold text-xs bg-slate-100 rounded-lg p-2 mb-2 text-slate-600">
                                        <div className="text-rose-500">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div className="text-blue-500">토</div>
                                    </div>
                                    <div className="grid grid-cols-7 gap-1 md:gap-2">
                                        {calendarDaysData.cells.map((cell, idx) => {
                                            if (cell.isEmpty) return <div key={`empty-${idx}`} className="bg-slate-50 border border-slate-200/50 min-h-[5.5rem] rounded-xl opacity-30"></div>;
                                            let dayLabelColor = 'text-slate-800';
                                            if (cell.dayOfWeek === 0) dayLabelColor = 'text-rose-500';
                                            if (cell.dayOfWeek === 6) dayLabelColor = 'text-blue-500';
                                            const badgeColors = {
                                                '젖돈': 'bg-blue-50 text-blue-700 border-blue-200', '육성': 'bg-emerald-50 text-emerald-700 border-emerald-200',
                                                '임신': 'bg-purple-50 text-purple-700 border-purple-200', '포유': 'bg-pink-50 text-pink-700 border-pink-200', '후보돈': 'bg-amber-50 text-amber-700 border-amber-200'
                                            };
                                            return (
                                                <div key={`day-${cell.dayNum}`} className={`border border-slate-200 rounded-xl min-h-[6rem] flex flex-col p-1.5 transition-all hover:border-slate-400 ${cell.isToday ? 'ring-2 ring-amber-500 bg-amber-50/20' : 'bg-white'}`}>
                                                    <div className="flex justify-between items-start mb-1">
                                                        <span className={`text-[13px] font-black font-mono leading-none ${dayLabelColor}`}>{cell.dayNum}</span>
                                                        {cell.dayTotal > 0 && <span className="bg-slate-800 text-white text-[9px] font-black px-1.5 py-0.5 rounded leading-none">{cell.dayTotal.toFixed(3)}t</span>}
                                                    </div>
                                                    <div className="space-y-1 mt-1 flex-1 flex flex-col justify-end">
                                                        {cell.badges.map((badge, bIdx) => {
                                                            const isBag = badge.bin && badge.bin.startsWith('지대');
                                                            const bagsVal = isBag ? (badge.bin === '지대 1' ? Math.round(badge.qty * 100) : Math.round(badge.qty * 50)) : 0;
                                                            // 지대 사료인 경우 젖돈 대신 지대1, 2, 3으로 표시하고 포대 수량과 톤수가 함께 노출되도록 스타일링
                                                            const bgStyle = isBag ? 'bg-amber-50 text-amber-700 border-amber-200 font-bold' : (badgeColors[badge.type] || 'bg-slate-100 text-slate-700 border-slate-200');
                                                            
                                                            return (
                                                                <div key={bIdx} className={`px-1 py-0.5 rounded text-[8.5px] font-sans font-black flex justify-between items-center border ${bgStyle} tracking-tighter`}>
                                                                    {isBag ? (
                                                                        <React.Fragment>
                                                                            <span className="font-bold">{badge.bin.replace(' ', '')}</span>
                                                                            <span className="text-right">{bagsVal}포({badge.qty.toFixed(2)}t)</span>
                                                                        </React.Fragment>
                                                                    ) : (
                                                                        <React.Fragment>
                                                                            <span className="truncate w-1/3">{badge.type}</span>
                                                                            <span className="text-center w-1/3 opacity-75">{badge.bin}번</span>
                                                                            <span className="text-right w-1/3">{badge.qty.toFixed(1)}t</span>
                                                                        </React.Fragment>
                                                                    )}
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                                <div className="bg-slate-50 p-4 border-t border-slate-100 flex justify-end">
                                    <button onClick={() => setShowCalendarModal(false)} className="bg-slate-800 hover:bg-slate-950 text-white font-bold py-2.5 px-6 rounded-xl text-xs transition-all">닫기</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(App ? <App /> : <div>Loading...</div>);
    </script>
</body>
</html>
