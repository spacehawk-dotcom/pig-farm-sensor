<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>성암농장 사료 주문</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM (Production v18) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel (브라우저에서 JSX 실시간 해석) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDK (호환 버전: 단일 HTML 환경용) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        /* Excel Table borders styling */
        .excel-table th, .excel-table td {
            border: 1px solid #cbd5e1; /* slate-300 */
        }
        .excel-table th {
            background-color: #f1f5f9; /* slate-100 */
        }
        @keyframes slideUp { 
            from { transform: translateY(100%); opacity: 0; } 
            to { transform: translateY(0); opacity: 1; } 
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* Input number spinner 제거 */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body className="bg-stone-100 text-slate-800 antialiased">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- 내장 SVG 아이콘 컴포넌트 ---
        const Container = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="12" x="2" y="6" rx="2"/><path d="M12 12h.01"/><path d="M17 12h.01"/><path d="M7 12h.01"/></svg>;
        const PenTool = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>;
        const CalendarIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>;
        const ChevronDown = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m6 9 6 6 6-6"/></svg>;
        const ChevronLeft = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m15 18-6-6 6-6"/></svg>;
        const ChevronRight = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m9 18 6-6-6-6"/></svg>;
        const PlusCircle = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>;
        const Calculator = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>;
        const Table = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 3v18"/><path d="M3 12h18"/><rect width="18" height="18" x="3" y="3" rx="2"/></svg>;
        const MessageSquare = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>;
        const Trash2 = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>;
        const Edit3 = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>;
        const CalendarRange = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M3 10h18"/><path d="M8 2v4"/><path d="M17 14h-6"/><path d="M13 18H7"/><path d="M7 14h.01"/><path d="M17 18h.01"/></svg>;
        const X = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;
        const Send = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>;
        const Share2 = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg>;
        const Copy = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>;
        const Timer = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg>;

        // --- 성암농장 실제 Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyBlptGu2gTAQKVy_yDomKkNEd_el6c1PL0",
            authDomain: "sungamfarm.firebaseapp.com",
            projectId: "sungamfarm",
            storageBucket: "sungamfarm.firebasestorage.app",
            messagingSenderId: "811107235779",
            appId: "1:811107235779:web:ea65a74d09c37ba2136f76"
        };

        // Firebase 초기화
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // 성암농장 사료 주문 컬렉션 경로
        const FEED_ORDERS_COLLECTION_PATH = 'farms/sungamfarm/feed_orders';

        // 알림창 컴포넌트
        const CustomAlert = ({ message, onClose }) => (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full p-5 text-center animate-[slideUp_0.2s_ease-out]">
                    <div className="w-12 h-12 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-3">
                        <span className="text-amber-500 text-xl font-bold">!</span>
                    </div>
                    <p className="text-sm font-bold text-slate-700 mb-5">{message}</p>
                    <button 
                        onClick={onClose}
                        className="w-full bg-slate-800 text-white font-black py-3 rounded-xl hover:bg-slate-700 active:scale-95 transition-all"
                    >
                        확인
                    </button>
                </div>
            </div>
        );

        // 확인창 컴포넌트
        const CustomConfirm = ({ message, onConfirm, onCancel }) => (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full p-5 text-center animate-[slideUp_0.2s_ease-out]">
                    <div className="w-12 h-12 bg-rose-100 rounded-full flex items-center justify-center mx-auto mb-3">
                        <span className="text-rose-500 text-xl font-bold">?</span>
                    </div>
                    <p className="text-sm font-bold text-slate-700 mb-5">{message}</p>
                    <div className="flex gap-2">
                        <button 
                            onClick={onCancel}
                            className="flex-1 bg-slate-100 text-slate-600 font-black py-3 rounded-xl hover:bg-slate-200 active:scale-95 transition-all"
                        >
                            취소
                        </button>
                        <button 
                            onClick={onConfirm}
                            className="flex-1 bg-rose-500 text-white font-black py-3 rounded-xl hover:bg-rose-600 active:scale-95 transition-all"
                        >
                            확인
                        </button>
                    </div>
                </div>
            </div>
        );

        function App() {
            const [user, setUser] = useState(null);
            const [orders, setOrders] = useState([]);
            const [loading, setLoading] = useState(true);

            // 알림 및 확인 상태 관리
            const [alertMsg, setAlertMsg] = useState(null);
            const [confirmConfig, setConfirmConfig] = useState(null);

            // UI 폼 입력 상태 관리
            const [feedType, setFeedType] = useState('젖돈');
            const [bulkBin, setBulkBin] = useState('1');
            const [quantity, setQuantity] = useState('');
            const [editingOrderId, setEditingOrderId] = useState(null);

            // 모달 상태 및 카카오톡 전송 상태
            const [showShareModal, setShowShareModal] = useState(false);
            const [showCalendarModal, setShowCalendarModal] = useState(false);
            const [shareNote, setShareNote] = useState('');
            
            // 달력 네비게이션 제어용 상태 (이전/다음 달 이동을 위해 현재 연도/월 추적)
            const [calendarYear, setCalendarYear] = useState(new Date().getFullYear());
            const [calendarMonth, setCalendarMonth] = useState(new Date().getMonth());

            // 알림 도우미 함수
            const showAlert = (message) => setAlertMsg(message);
            const showConfirm = (message, onConfirm) => {
                setConfirmConfig({
                    message,
                    onConfirm: () => { onConfirm(); setConfirmConfig(null); },
                    onCancel: () => setConfirmConfig(null)
                });
            };

            // 토스트 상태 알림 창
            const [toastConfig, setToastConfig] = useState({ show: false, message: '', bgColor: 'bg-slate-900' });
            const showToast = (message, bgColor = 'bg-slate-900') => {
                setToastConfig({ show: true, message, bgColor });
                setTimeout(() => {
                    setToastConfig({ show: false, message: '', bgColor: 'bg-slate-900' });
                }, 3000);
            };

            // 1. Firebase 익명 로그인 및 상태 트래킹
            useEffect(() => {
                auth.signInAnonymously().catch(err => {
                    console.warn("익명 로그인 실패:", err);
                });

                const unsubscribeAuth = auth.onAuthStateChanged((currentUser) => {
                    setUser(currentUser);
                    if (!currentUser) setLoading(false);
                });

                return () => unsubscribeAuth();
            }, []);

            // 2. Firestore 실시간 사료 주문 데이터 스트림 연동
            useEffect(() => {
                if (!user) return;

                const unsubscribeOrders = db.collection(FEED_ORDERS_COLLECTION_PATH)
                    .onSnapshot(
                        (snapshot) => {
                            const ordersData = snapshot.docs.map(doc => {
                                const data = doc.data();
                                return data ? { id: doc.id, ...data } : null;
                            }).filter(Boolean);

                            // 정렬: 최신 날짜순 정렬 (기본)
                            ordersData.sort((a, b) => b.date.localeCompare(a.date));
                            setOrders(ordersData);
                            setLoading(false);
                        },
                        (error) => {
                            console.error("사료 주문 데이터 갱신 실패:", error);
                            setLoading(false);
                        }
                    );

                return () => unsubscribeOrders();
            }, [user]);

            // 오늘 날짜 한글 요일 계산 포맷팅
            const todayDateString = useMemo(() => {
                const today = new Date();
                const year = today.getFullYear();
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const day = String(today.getDate()).padStart(2, '0');
                const weekDays = ['일', '월', '화', '수', '목', '금', '토'];
                const weekDay = weekDays[today.getDay()];
                return `${year}년 ${month}월 ${day}일 (${weekDay})`;
            }, []);

            // 당일 날짜 짧은 포맷 (예: 6월 14일)
            const todayShort = useMemo(() => {
                const today = new Date();
                return `${today.getMonth() + 1}월 ${today.getDate()}일`;
            }, []);

            // 사료 종류별 합산 통계 산출 (오직 '당일' 주문 내역만 합산되도록 변경)
            const dailySummaryStats = useMemo(() => {
                const stats = {
                    '젖돈': 0,
                    '육성': 0,
                    '임신': 0,
                    '포유': 0,
                    '후보돈': 0,
                    'total': 0
                };
                
                // 오늘 날짜 포맷 (YYYY-MM-DD) 추출
                const today = new Date();
                const targetDayPrefix = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

                orders.forEach(order => {
                    // 당일 날짜로 시작하는 주문만 합산에 포함
                    if (order.date.startsWith(targetDayPrefix)) {
                        const q = parseFloat(order.quantity) || 0;
                        if (stats[order.feedType] !== undefined) {
                            stats[order.feedType] += q;
                        }
                        stats.total += q;
                    }
                });

                // 소수점 1자리 고정 반환
                return {
                    '젖돈': parseFloat(stats['젖돈'].toFixed(1)),
                    '육성': parseFloat(stats['육성'].toFixed(1)),
                    '임신': parseFloat(stats['임신'].toFixed(1)),
                    '포유': parseFloat(stats['포유'].toFixed(1)),
                    '후보돈': parseFloat(stats['후보돈'].toFixed(1)),
                    'total': parseFloat(stats.total.toFixed(1))
                };
            }, [orders]);

            // --- 데이터베이스 핸들러 작성 ---
            // 주문서 신규 제출 및 수정 처리
            const handleSubmitOrder = async (e) => {
                e.preventDefault();
                if (!user) return;

                const qVal = parseFloat(quantity);
                if (!feedType || !bulkBin || isNaN(qVal) || qVal <= 0) {
                    showAlert("모든 값을 올바르게 기입해 주세요.");
                    return;
                }

                const now = new Date();
                const dateString = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

                try {
                    if (editingOrderId) {
                        // 수정 모드
                        await db.collection(FEED_ORDERS_COLLECTION_PATH).doc(editingOrderId).update({
                            feedType,
                            bulkBin,
                            quantity: qVal,
                            date: dateString + " (수정됨)"
                        });
                        showToast("📝 사료 주문서가 성공적으로 수정되었습니다.", "bg-amber-600");
                        setEditingOrderId(null);
                    } else {
                        // 신규 저장 모드
                        await db.collection(FEED_ORDERS_COLLECTION_PATH).add({
                            feedType,
                            bulkBin,
                            quantity: qVal,
                            unit: '톤',
                            date: dateString
                        });
                        showToast("✨ 새 사료 주문이 등록되어 요약 합계에 반영되었습니다!", "bg-emerald-600");
                    }
                    resetForm();
                } catch (err) {
                    console.error("주문 저장 실패:", err);
                    showAlert("데이터 저장 실패: " + err.message);
                }
            };

            // 수정 모드 실행 트리거
            const handleEditClick = (order) => {
                setEditingOrderId(order.id);
                setFeedType(order.feedType);
                setBulkBin(order.bulkBin);
                setQuantity(order.quantity);
                window.scrollTo({ top: 0, behavior: 'smooth' });
                showToast("✏️ 주문 정보 수정 상태입니다.", "bg-indigo-600");
            };

            // 단일 항목 삭제
            const handleDeleteClick = (id) => {
                showConfirm("이 사료 주문 내역을 삭제하시겠습니까?", async () => {
                    try {
                        await db.collection(FEED_ORDERS_COLLECTION_PATH).doc(id).delete();
                        showToast("🗑️ 주문 내역이 완전히 삭제되었습니다.", "bg-slate-700");
                        if (editingOrderId === id) resetForm();
                    } catch (err) {
                        showAlert("삭제 실패: " + err.message);
                    }
                });
            };

            // 전체 삭제 처리
            const handleClearAllClick = () => {
                if (orders.length === 0) return;
                showConfirm("정말로 모든 사료 주문 기록을 초기화하시겠습니까?", async () => {
                    try {
                        const batch = db.batch();
                        const snapshot = await db.collection(FEED_ORDERS_COLLECTION_PATH).get();
                        snapshot.docs.forEach(doc => {
                            batch.delete(doc.ref);
                        });
                        await batch.commit();
                        showToast("🗑️ 모든 사료 기록이 초기화되었습니다.", "bg-rose-700");
                        resetForm();
                    } catch (err) {
                        showAlert("초기화 실패: " + err.message);
                    }
                });
            };

            // 입력 폼 리셋
            const resetForm = () => {
                setEditingOrderId(null);
                setFeedType('젖돈');
                setBulkBin('1');
                setQuantity('');
            };

            // 카카오톡 텍스트 자동 제너레이터 (당일 주문 기준 집계)
            const generatedKakaoText = useMemo(() => {
                if (orders.length === 0) return "현재 등록된 사료 주문서 내역이 없습니다.";

                let text = `[성암농장 ${todayShort} 사료 주문서]\n\n`;

                text += `■ 당일 사료 주문 합계\n`;
                text += `-------------------------\n`;
                Object.keys(dailySummaryStats).forEach(type => {
                    if (type !== 'total' && dailySummaryStats[type] > 0) {
                        text += `- ${type}: ${dailySummaryStats[type].toFixed(1)} 톤\n`;
                    }
                });
                text += `-------------------------\n`;
                text += `★ 당일 총 주문 수량: ${dailySummaryStats.total.toFixed(1)} 톤\n\n`;

                text += `■ 발주 상세 목록 (당일)\n`;
                
                // 당일에 해당하는 주문만 필터하여 텍스트에 삽입
                const today = new Date();
                const targetDayPrefix = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
                const dailyOrders = orders.filter(o => o.date.startsWith(targetDayPrefix));

                if (dailyOrders.length === 0) {
                    text += `- 당일 등록된 상세 내역 없음\n`;
                } else {
                    dailyOrders.forEach((order, idx) => {
                        // 일자만 짧게 표시 (예: 6월 13일)
                        const shortDate = order.date.substring(5, 10).replace('-', '월 ') + '일';
                        text += `[${shortDate}] 벌크 ${order.bulkBin}호통 [${order.feedType}] ${parseFloat(order.quantity).toFixed(1)}톤\n`;
                    });
                }

                if (shareNote.trim() !== '') {
                    text += `\n-------------------------\n`;
                    text += `${shareNote}`;
                }

                return text;
            }, [orders, dailySummaryStats, shareNote, todayShort]);

            // 모바일 네이티브 다이렉트 전송
            const sendNativeShare = async () => {
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: '성암농장 사료 주문서',
                            text: generatedKakaoText
                        });
                        showToast('💬 주문서 공유가 성공적으로 완료되었습니다.', 'bg-emerald-600');
                        setShowShareModal(false);
                    } catch (err) {
                        if (err.name !== 'AbortError') {
                            showToast('공유가 중단되었습니다.');
                        }
                    }
                } else {
                    copyShareText();
                }
            };

            // 클립보드 강제 우회 복사
            const copyShareText = () => {
                const tempTextArea = document.createElement("textarea");
                tempTextArea.value = generatedKakaoText;
                tempTextArea.style.position = "fixed";
                document.body.appendChild(tempTextArea);
                tempTextArea.select();
                tempTextArea.setSelectionRange(0, 99999);

                try {
                    const successful = document.execCommand('copy');
                    if (successful) {
                        showToast('📋 주문서가 클립보드에 복사되었습니다! 카톡을 실행합니다.', 'bg-indigo-600');
                        setTimeout(() => {
                            window.location.href = "kakaolink://";
                        }, 800);
                    } else {
                        showToast('❌ 복사에 실패했습니다.', 'bg-rose-600');
                    }
                } catch (err) {
                    showToast('❌ 클립보드를 지원하지 않는 환경입니다.', 'bg-rose-600');
                }
                document.body.removeChild(tempTextArea);
            };

            // 달력 렌더링용 변수 연산 (이전 달 / 다음 달 동적 반영)
            const calendarDaysData = useMemo(() => {
                const firstDayIndex = new Date(calendarYear, calendarMonth, 1).getDay(); // 시작 요일
                const totalDaysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate(); // 해당 월의 총 일수
                const today = new Date();

                const cells = [];
                let currentMonthTotal = 0;

                // 1. 앞쪽 공백 처리
                for (let i = 0; i < firstDayIndex; i++) {
                    cells.push({ isEmpty: true });
                }

                // 2. 일별 데이터 매핑 루프
                for (let day = 1; day <= totalDaysInMonth; day++) {
                    const dayStr = String(day).padStart(2, '0');
                    const compareDateStr = `${calendarYear}-${String(calendarMonth + 1).padStart(2, '0')}-${dayStr}`;

                    const dayOrders = orders.filter(o => o.date.startsWith(compareDateStr));
                    let dayTotal = 0;

                    const badges = dayOrders.map(o => {
                        const q = parseFloat(o.quantity) || 0;
                        dayTotal += q;
                        currentMonthTotal += q;
                        return {
                            type: o.feedType,
                            bin: o.bulkBin,
                            qty: q
                        };
                    });

                    cells.push({
                        isEmpty: false,
                        dayNum: day,
                        dayOfWeek: new Date(calendarYear, calendarMonth, day).getDay(),
                        isToday: today.getDate() === day && today.getMonth() === calendarMonth && today.getFullYear() === calendarYear,
                        dayTotal,
                        badges
                    });
                }

                return { cells, currentMonthTotal };
            }, [orders, calendarYear, calendarMonth]);

            // 캘린더 달력 이동 컨트롤러
            const handlePrevMonth = () => {
                if (calendarMonth === 0) {
                    setCalendarMonth(11);
                    setCalendarYear(y => y - 1);
                } else {
                    setCalendarMonth(m => m - 1);
                }
            };

            const handleNextMonth = () => {
                if (calendarMonth === 11) {
                    setCalendarMonth(0);
                    setCalendarYear(y => y + 1);
                } else {
                    setCalendarMonth(m => m + 1);
                }
            };

            // --- 🔔 벌크통 사료 소진 및 주문 예측 알고리즘 ---
            const binPredictions = useMemo(() => {
                if (orders.length === 0) return [];

                const grouped = {};
                orders.forEach(o => {
                    if (!grouped[o.bulkBin]) grouped[o.bulkBin] = [];
                    grouped[o.bulkBin].push(o);
                });

                const predictions = [];
                const today = new Date();
                today.setHours(0,0,0,0);

                Object.keys(grouped).forEach(bin => {
                    // 날짜 오름차순 정렬 (오래된 순)
                    const binOrders = grouped[bin].sort((a, b) => {
                        const da = new Date(a.date.replace(' (수정됨)', '').replace(/-/g, '/'));
                        const db = new Date(b.date.replace(' (수정됨)', '').replace(/-/g, '/'));
                        return da - db;
                    });

                    // 최소 2건 이상의 주문 기록이 있어야 일수 계산 가능
                    if (binOrders.length >= 2) {
                        const lastOrder = binOrders[binOrders.length - 1]; // 가장 최근 주문
                        const prevOrder = binOrders[binOrders.length - 2]; // 직전 주문

                        const t1 = new Date(prevOrder.date.replace(' (수정됨)', '').replace(/-/g, '/'));
                        const t2 = new Date(lastOrder.date.replace(' (수정됨)', '').replace(/-/g, '/'));
                        
                        t1.setHours(0,0,0,0);
                        t2.setHours(0,0,0,0);

                        let diffDays = Math.ceil((t2.getTime() - t1.getTime()) / (1000 * 60 * 60 * 24));
                        
                        // 테스트 시 당일 다중 입력을 위한 보정 (동일 날짜 입력 시 1일 경과로 산주)
                        if (diffDays <= 0) diffDays = 1; 

                        const prevQty = parseFloat(prevOrder.quantity);
                        const lastQty = parseFloat(lastOrder.quantity);
                        
                        const dailyUsage = prevQty / diffDays;
                        const expectedDays = Math.ceil(lastQty / dailyUsage);

                        const nextDate = new Date(t2);
                        nextDate.setDate(nextDate.getDate() + expectedDays);

                        const remainTime = nextDate.getTime() - today.getTime();
                        const remainDays = Math.ceil(remainTime / (1000 * 60 * 60 * 24));

                        predictions.push({
                            bin,
                            feedType: lastOrder.feedType,
                            dailyUsage,
                            nextDate,
                            remainDays,
                            expectedDays
                        });
                    }
                });

                // 임박한 순서대로 정렬 (남은 일수가 적은 순)
                return predictions.sort((a, b) => a.remainDays - b.remainDays);
            }, [orders]);

            if (loading) {

                    <div className="flex items-center justify-center h-screen bg-stone-100">
                        <p className="text-lg font-bold text-slate-500 animate-pulse">성암농장 데이터베이스 연결 중...</p>
                    </div>
                );

            return (

                        <span>✔️</span>

                    </div>

                    {/* Header */}
                    <header className="mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-stone-200/60">
                        <div className="flex items-center gap-3">
                            <div className="p-3 bg-amber-100 rounded-xl text-amber-700">
                                <Container className="w-8 h-8" />
                            </div>
                            <div>
                                <h1 className="text-2xl font-bold tracking-tight text-slate-900">성암농장 사료 주문</h1>
                                <p className="text-sm text-slate-500 mt-0.5">사료 벌크통 잔량 관리 및 주문 예약 시스템</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2 text-xs font-semibold bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-full border border-emerald-100">
                            <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            실시간 작동 중
                        </div>
                    </header>

                    {/* Main Workspace */}
                    <div className="grid grid-cols-1 gap-8">
                        
                        {/* 최상단: 주문 양식 및 합계표 좌우 분할 그리드 */}
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                            {/* Input Form Section (좌측 넓게) */}
                            <section className="lg:col-span-8 bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-stone-200/60">
                                <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 mb-6 border-b border-slate-100 pb-4">
                                    <div className="flex items-center gap-2">
                                        <PenTool className="w-5 h-5 text-amber-600" />
                                        <h2 className="text-lg font-bold text-slate-800">신규 사료 주문 정보 등록</h2>
                                    </div>
                                    <div className="text-xs sm:text-sm font-bold text-slate-500 flex items-center gap-1.5 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200/50 self-start sm:self-auto">
                                        <CalendarIcon className="w-4 h-4 text-amber-600" />
                                        <span>{todayDateString}</span>
                                    </div>
                                </div>

                                <form onSubmit={handleSubmitOrder} className="space-y-4">

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                                        
                                        {/* 1. Feed Type Dropdown */}
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1.5">사료 종류 <span className="text-rose-500">*</span></label>
                                            <div className="relative">
                                                <select 
                                                    value={feedType} 
                                                    onChange={e => setFeedType(e.target.value)}
                                                    required
                                                    className="w-full pl-4 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm font-bold text-slate-800 appearance-none cursor-pointer"
                                                >
                                                    <option value="젖돈">젖돈</option>
                                                    <option value="육성">육성</option>
                                                    <option value="임신">임신</option>
                                                    <option value="포유">포유</option>
                                                    <option value="후보돈">후보돈</option>
                                                </select>
                                                <div className="absolute right-3.5 top-3.5 text-slate-500 pointer-events-none">
                                                    <ChevronDown className="w-4.5 h-4.5" />
                                                </div>
                                            </div>
                                        </div>

                                        {/* 2. Bulk Bin Selector (Dropdown) */}
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1.5">벌크통 번호 <span className="text-rose-500">*</span></label>
                                            <div className="relative">
                                                <select 
                                                    value={bulkBin} 
                                                    onChange={e => setBulkBin(e.target.value)}
                                                    required
                                                    className="w-full pl-10 pr-10 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm font-bold text-slate-800 appearance-none cursor-pointer"
                                                >
                                                    <option value="" disabled>번호 선택</option>
                                                    <option value="1">벌크 1호통</option>
                                                    <option value="2">벌크 2호통</option>
                                                    <option value="3">벌크 3호통</option>
                                                    <option value="4A">벌크 4A호통</option>
                                                    <option value="4B">벌크 4B호통</option>
                                                    <option value="5">벌크 5호통</option>
                                                    <option value="6">벌크 6호통</option>
                                                    <option value="7">벌크 7호통</option>
                                                    <option value="8">벌크 8호통</option>
                                                    <option value="9">벌크 9호통</option>
                                                    <option value="10">벌크 10호통</option>

                                                </select>
                                                <div className="absolute left-3.5 top-3.5 text-slate-400 pointer-events-none">
                                                    <Container className="w-4.5 h-4.5" />
                                                </div>
                                                <div className="absolute right-3.5 top-3.5 text-slate-500 pointer-events-none">
                                                    <ChevronDown className="w-4.5 h-4.5" />
                                                </div>
                                            </div>
                                        </div>

                                        {/* 3. Feed Quantity */}
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 mb-1.5">사료 주문량 (톤) <span className="text-rose-500">*</span></label>
                                            <div className="flex gap-2">
                                                <input

                                                    className="flex-1 px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-500 text-base font-black text-slate-800"
                                                />
                                                <span className="flex items-center justify-center px-3 bg-slate-100 border border-slate-200 rounded-xl text-xs font-bold text-slate-600">
                                                    톤
                                                </span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Buttons */}
                                    <div className="flex gap-3 pt-4 border-t border-slate-100">
                                        {editingOrderId && (
                                            <button 
                                                type="button"

                                        <button

                                                    <td className="p-2 text-right font-bold text-blue-600">{dailySummaryStats['젖돈'].toFixed(1)}</td>

                                                <tr>
                                                    <td className="p-2 bg-slate-50/50 font-sans font-semibold text-center">포유</td>

                                                </tr>
                                                <tr>
                                                    <td className="p-2 bg-slate-50/50 font-sans font-semibold text-center">후보돈</td>
                                                    <td className="p-2 text-right font-bold text-amber-600">{dailySummaryStats['후보돈'].toFixed(1)}</td>
                                                </tr>
                                                <tr className="bg-amber-50/30 border-t-2 border-b-4 border-double border-slate-400 font-bold">
                                                    <td className="p-2.5 font-sans text-center text-slate-900">당일 전체 합계</td>
                                                    <td className="p-2.5 text-right text-base text-slate-950">{dailySummaryStats.total.toFixed(1)}</td>

                        </div>

                        {/* 🔔 예측 알림 작동 현황 Panel (배치 이동됨) */}
                        <section className="bg-white rounded-2xl p-6 shadow-sm border border-stone-200/60 flex flex-col space-y-4">
                            <div className="flex flex-col sm:flex-row justify-between sm:items-center border-b border-slate-100 pb-3 gap-2">
                                <div className="flex items-center gap-2">
                                    <Timer className="text-rose-500 w-5 h-5" />

                            </div>

                            {binPredictions.length === 0 ? (
                                <div className="text-center py-8 bg-slate-50 border border-dashed border-slate-200 rounded-xl">

                                </div>
                            ) : (

                                    {binPredictions.map((pred, idx) => {
                                        let statusColor = 'border-slate-200 bg-white';

                                        if (pred.remainDays < 0) {

                                        return (

                                                    <div className="flex items-center gap-1.5">
                                                        <span className="text-[14px] font-black text-slate-800">벌크 {pred.bin}호통</span>
                                                        <span className="text-[10px] font-bold text-slate-500 bg-white px-1.5 py-0.5 rounded border border-slate-200">{pred.feedType}</span>
                                                    </div>
                                                    <span className={`text-[11px] font-black px-2 py-1 rounded-md shadow-sm ${badgeColor}`}>
                                                        {urgencyText}
                                                    </span>
                                                </div>
                                                <div className="flex justify-between items-center text-xs font-semibold">
                                                    <span className="text-slate-500">일평균 소모량:</span>
                                                    <span className="text-slate-700 font-mono text-[13px]">{pred.dailyUsage.toFixed(2)} 톤/일</span>
                                                </div>
                                                <div className="flex justify-between items-center text-xs font-semibold">
                                                    <span className="text-slate-500">주문 필요일 (예상):</span>
                                                    <span className="text-slate-900 font-black tracking-tight bg-white px-2 py-0.5 rounded border border-slate-200">
                                                        {pred.nextDate.getFullYear()}년 {pred.nextDate.getMonth()+1}월 {pred.nextDate.getDate()}일경
                                                    </span>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </section>

                        {/* Middle: Registered Order Lists (엑셀 테이블 스타일) - 주문일시 삭제 됨 */}
                        <section className="w-full bg-white rounded-2xl p-6 shadow-sm border border-stone-200/60 space-y-4">
                            <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                                <div className="flex items-center gap-2">
                                    <Table className="text-slate-600 w-5 h-5" />
                                    <h2 className="text-lg font-bold text-slate-800">등록된 주문 전체 리스트 (<span id="orderCount">{orders.length}</span>건)</h2>
                                </div>
                                <div className="flex items-center gap-2">
                                    <button 
                                        onClick={() => {
                                            if(orders.length === 0) {
                                                showToast("❌ 전송할 주문서가 없습니다.", "bg-amber-600");
                                                return;
                                            }
                                            setShowShareModal(true);
                                        }} 
                                        className="text-xs font-semibold bg-amber-500 hover:bg-amber-600 text-slate-950 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1 shadow-sm"
                                    >
                                        <MessageSquare className="w-3.5 h-3.5" /> {todayShort} 카톡 전송
                                    </button>
                                    <button 
                                        onClick={handleClearAllClick} 
                                        className="text-xs font-semibold text-rose-500 hover:text-rose-700 transition-colors flex items-center gap-1"
                                    >
                                        <Trash2 className="w-3.5 h-3.5" /> 기록 전체 삭제
                                    </button>
                                </div>
                            </div>

                            <div className="overflow-x-auto">
                                <table className="w-full text-xs font-mono excel-table border-collapse text-slate-700 min-w-[500px]">
                                    <thead>
                                        <tr className="text-center font-bold">
                                            <th className="p-2.5 w-16 bg-slate-100">No.</th>
                                            <th className="p-2.5 w-32 bg-slate-100">사료 종류</th>
                                            <th className="p-2.5 w-32 bg-slate-100">벌크통 번호</th>
                                            <th className="p-2.5 w-32 bg-slate-100 text-right pr-4">주문량 (톤)</th>
                                            <th className="p-2.5 w-24 bg-slate-100">관리</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {orders.length === 0 ? (
                                            <tr>
                                                <td colSpan="5" className="p-8 text-center text-slate-400 font-sans">
                                                    저장된 사료 주문 내역이 없습니다.
                                                </td>
                                            </tr>
                                        ) : (
                                            orders.map((order, index) => {
                                                const rowNo = orders.length - index;
                                                return (
                                                    <tr key={order.id} className="hover:bg-slate-50 transition-all text-sm text-slate-800">
                                                        <td className="p-3 text-center bg-slate-50/70 font-black border border-slate-300 text-slate-400">{rowNo}</td>
                                                        <td className="p-3 text-center font-sans font-black border border-slate-300 text-slate-900">{order.feedType}</td>
                                                        <td className="p-3 text-center font-sans font-black border border-slate-300 text-amber-700">벌크 {order.bulkBin}호</td>
                                                        <td className="p-3 text-right pr-4 font-black border border-slate-300 text-slate-950">{parseFloat(order.quantity).toFixed(1)} 톤</td>
                                                        <td className="p-2 text-center border border-slate-300">
                                                            <div className="flex justify-center gap-1.5">
                                                                <button onClick={() => handleEditClick(order)} title="수정" className="p-1.5 bg-white hover:bg-slate-100 text-slate-600 hover:text-indigo-600 border border-slate-300 rounded shadow-sm transition-all">
                                                                    <Edit3 className="w-4 h-4" />
                                                                </button>
                                                                <button onClick={() => handleDeleteClick(order.id)} title="삭제" className="p-1.5 bg-white hover:bg-rose-50 text-slate-600 hover:text-rose-600 border border-slate-300 rounded shadow-sm transition-all">
                                                                    <Trash2 className="w-4 h-4" />
                                                                </button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                );
                                            })
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </section>

                        {/* Bottom Actions (캘린더 보기 하단 고정) */}
                        <div className="pb-10">
                            <section className="bg-white rounded-2xl p-5 shadow-sm border border-stone-200/60 flex items-center justify-center">
                                <button 
                                    type="button" 
                                    onClick={() => {
                                        const today = new Date();
                                        setCalendarYear(today.getFullYear());
                                        setCalendarMonth(today.getMonth());
                                        setShowCalendarModal(true);
                                    }} 
                                    className="w-full sm:max-w-md mx-auto bg-slate-800 hover:bg-slate-950 text-white font-bold py-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-3 animate-pulse"
                                >
                                    <CalendarRange className="w-5 h-5 text-amber-400" />
                                    <span>📅 달력으로 전체 일정 보기</span>
                                </button>
                            </section>
                        </div>
                    </div>

                    {/* --- Modals --- */}
                    
                    {/* KakaoTalk Sharing Modal */}
                    {showShareModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-md rounded-2xl shadow-2xl border border-slate-100 flex flex-col overflow-hidden animate-[slideUp_0.2s_ease-out]">
                                <div className="bg-amber-500 p-5 text-slate-950 flex justify-between items-center">
                                    <div className="flex items-center gap-2 font-bold text-base">
                                        <Send className="w-5 h-5" />
                                        카카오톡 주문서 전송 ({todayShort})
                                    </div>
                                    <button onClick={() => setShowShareModal(false)} className="text-slate-900 hover:text-black hover:bg-white/20 p-1.5 rounded-lg transition-all">
                                        <X className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="p-6 space-y-4 flex-1">
                                    <div className="space-y-1.5">
                                        <label className="block text-xs font-bold text-slate-700">실시간 미리보기</label>
                                        <div className="w-full bg-stone-50 border border-stone-200 text-stone-800 p-4 rounded-xl text-xs font-mono h-56 overflow-y-auto whitespace-pre-wrap leading-relaxed shadow-inner">
                                            {generatedKakaoText}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1.5">전달사항 추가</label>
                                        <div className="flex flex-col gap-2">
                                            <div className="relative">
                                                <select 
                                                    onChange={e => {
                                                        if (e.target.value !== 'direct') {
                                                            setShareNote(e.target.value);
                                                            e.target.value = 'direct'; // 리셋하여 재선택 가능하게
                                                        }
                                                    }}
                                                    defaultValue="direct"
                                                    className="w-full pl-3.5 pr-8 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-500 text-xs font-bold appearance-none cursor-pointer"
                                                >
                                                    <option value="direct">자주 쓰는 전달사항 선택 (클릭)</option>
                                                    <option value="내일 첫차 배송 부탁드립니다.">내일 첫차 배송 부탁드립니다.</option>
                                                    <option value="내일 막차 배송 부탁드립니다.">내일 막차 배송 부탁드립니다.</option>
                                                    <option value="오늘 막차 배송 부탁드립니다.">오늘 막차 배송 부탁드립니다.</option>
                                                    <option value="경사로 진입 시 주의 부탁드립니다.">경사로 진입 시 주의 부탁드립니다.</option>
                                                </select>
                                                <div className="absolute right-2.5 top-2 text-slate-400 pointer-events-none">
                                                    <ChevronDown className="w-4 h-4" />
                                                </div>
                                            </div>
                                            <input 
                                                type="text" 
                                                value={shareNote} 
                                                onChange={e => setShareNote(e.target.value)}
                                                placeholder="직접 기입하거나 수정할 수 있습니다."
                                                className="w-full px-3.5 py-2 bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 text-xs font-bold shadow-sm"
                                            />
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-slate-50 p-4 border-t border-slate-100 flex flex-col gap-2">
                                    <button onClick={sendNativeShare} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl text-xs flex items-center justify-center gap-2 shadow-md transition-all">
                                        <Share2 className="w-4 h-4" />
                                        모바일 카톡/메시지 직접 열기
                                    </button>
                                    <div className="flex gap-2">
                                        <button onClick={copyShareText} className="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 px-4 rounded-xl text-xs flex items-center justify-center gap-1.5 transition-all">
                                            <Copy className="w-4 h-4" />
                                            텍스트 복사 후 톡 실행
                                        </button>
                                        <button onClick={() => setShowShareModal(false)} className="bg-slate-200 hover:bg-slate-300 text-slate-600 font-bold py-3 px-4 rounded-xl text-xs transition-all">
                                            닫기
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Calendar Popup Modal */}
                    {showCalendarModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-4xl rounded-2xl shadow-2xl border border-slate-100 flex flex-col overflow-hidden animate-[slideUp_0.2s_ease-out] max-h-[90vh]">
                                
                                <div className="bg-slate-800 p-4 text-white flex justify-between items-center">
                                    <div className="flex items-center gap-2 font-bold text-base">
                                        <CalendarRange className="w-5 h-5 text-amber-400" />
                                        <span>주문 일정표 달력</span>
                                    </div>
                                    <button onClick={() => setShowCalendarModal(false)} className="text-slate-300 hover:text-white hover:bg-white/10 p-1.5 rounded-lg transition-all">
                                        <X className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="p-4 sm:p-6 space-y-4 overflow-y-auto flex-1">
                                    
                                    {/* 달력 상단 네비게이션 컨트롤러 */}
                                    <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-b border-slate-100 pb-4">
                                        <div className="flex items-center gap-4 bg-slate-100 p-1.5 rounded-xl self-center sm:self-auto">
                                            <button onClick={handlePrevMonth} className="p-2 bg-white rounded-lg shadow-sm text-slate-600 hover:text-blue-600 transition-colors">
                                                <ChevronLeft className="w-4 h-4" />
                                            </button>
                                            <span className="font-black text-slate-800 min-w-[100px] text-center tracking-tight text-lg">
                                                {calendarYear}년 {calendarMonth + 1}월
                                            </span>
                                            <button onClick={handleNextMonth} className="p-2 bg-white rounded-lg shadow-sm text-slate-600 hover:text-blue-600 transition-colors">
                                                <ChevronRight className="w-4 h-4" />
                                            </button>
                                        </div>

                                        <div className="bg-amber-50 border border-amber-200 text-amber-950 px-4 py-3 rounded-xl font-bold text-xs flex items-center justify-between sm:justify-start gap-3 w-full sm:w-auto">
                                            <span>선택 월 총합계</span>
                                            <span className="text-lg text-amber-600 font-black">{calendarDaysData.currentMonthTotal.toFixed(1)} <span className="text-xs">톤</span></span>
                                        </div>
                                    </div>

                                    {/* Weeks Header */}
                                    <div className="grid grid-cols-7 gap-1 text-center font-bold text-xs bg-slate-100 rounded-lg p-2 mb-2 text-slate-600">
                                        <div className="text-rose-500">일</div>
                                        <div>월</div>
                                        <div>화</div>
                                        <div>수</div>
                                        <div>목</div>
                                        <div>금</div>
                                        <div className="text-blue-500">토</div>
                                    </div>

                                    {/* Cells Grid */}
                                    <div className="grid grid-cols-7 gap-1 md:gap-2">
                                        {calendarDaysData.cells.map((cell, idx) => {
                                            if (cell.isEmpty) {
                                                return <div key={`empty-${idx}`} className="bg-slate-50 border border-slate-200/50 min-h-[5.5rem] rounded-xl opacity-30"></div>;
                                            }

                                            let dayLabelColor = 'text-slate-800';
                                            if (cell.dayOfWeek === 0) dayLabelColor = 'text-rose-500';
                                            if (cell.dayOfWeek === 6) dayLabelColor = 'text-blue-500';

                                            const badgeColors = {
                                                '젖돈': 'bg-blue-50 text-blue-700 border-blue-200',
                                                '육성': 'bg-emerald-50 text-emerald-700 border-emerald-200',
                                                '임신': 'bg-purple-50 text-purple-700 border-purple-200',
                                                '포유': 'bg-pink-50 text-pink-700 border-pink-200',
                                                '후보돈': 'bg-amber-50 text-amber-700 border-amber-200'
                                            };

                                            return (
                                                <div 
                                                    key={`day-${cell.dayNum}`} 
                                                    className={`border border-slate-200 rounded-xl min-h-[6rem] flex flex-col p-1.5 transition-all hover:border-slate-400 ${cell.isToday ? 'ring-2 ring-amber-500 bg-amber-50/20' : 'bg-white'}`}
                                                >
                                                    <div className="flex justify-between items-start mb-1">
                                                        <span className={`text-[13px] font-black font-mono leading-none ${dayLabelColor}`}>{cell.dayNum}</span>
                                                        {cell.dayTotal > 0 && (
                                                            <span className="bg-slate-800 text-white text-[9px] font-black px-1.5 py-0.5 rounded leading-none">
                                                                {cell.dayTotal.toFixed(1)}t
                                                            </span>
                                                        )}
                                                    </div>
                                                    
                                                    {/* 배지 나열 영역: 사료종류(좌), 통번호(중앙), 수량(우) */}
                                                    <div className="space-y-1 mt-1 flex-1 flex flex-col justify-end">
                                                        {cell.badges.map((badge, bIdx) => (
                                                            <div key={bIdx} className={`px-1 py-0.5 rounded text-[8.5px] font-sans font-black flex justify-between items-center border ${badgeColors[badge.type] || 'bg-slate-100 text-slate-700'} tracking-tighter`}>
                                                                <span className="truncate w-1/3">{badge.type}</span>
                                                                <span className="text-center w-1/3 opacity-75">{badge.bin}</span>
                                                                <span className="text-right w-1/3">{badge.qty.toFixed(1)}t</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="bg-slate-50 p-4 border-t border-slate-100 flex justify-end">
                                    <button onClick={() => setShowCalendarModal(false)} className="bg-slate-800 hover:bg-slate-950 text-white font-bold py-2.5 px-6 rounded-xl text-xs transition-all">
                                        닫기
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
