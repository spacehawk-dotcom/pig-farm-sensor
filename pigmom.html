<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>성암농장 모돈 관리</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel (브라우저에서 JSX 문법 실시간 해석, 안정화 버전 고정) -->
  <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>

  <!-- SheetJS (엑셀 다운로드 라이브러리 추가) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Firebase SDK (호환 버전: 단일 HTML 환경용) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
    body { font-family: 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent; }
    /* 슬라이드 애니메이션 */
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    /* input number 스피너 숨기기 */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">

  <div id="root"></div>

  <!-- 여기서부터 React 코드를 브라우저가 실시간으로 해석합니다 -->
  <script type="text/babel" data-presets="env,react">
    /** @jsx React.createElement */
    /** @jsxFrag React.Fragment */
    const { useState, useEffect, useMemo, useRef } = React;

    // --- 내장 SVG 아이콘 컴포넌트 ---
    const Search = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
    const Plus = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>;
    const ArrowLeft = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>;
    const Trash2 = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>;
    const Activity = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>;
    const Baby = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M8 11.5h.01"/><path d="M16 11.5h.01"/><path d="M9 15.5a4 4 0 0 0 6 0"/></svg>;
    const ChevronRight = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m9 18 6-6-6-6"/></svg>;
    const X = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;
    const Bell = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>;
    const CalendarHeart = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 10V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h7"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/><path d="M21.29 14.7a2.43 2.43 0 0 0-2.65-.52c-.3.12-.57.3-.8.53l-.34.34-.35-.34a2.43 2.43 0 0 0-2.65-.53c-.3.12-.56.3-.79.53-.95.94-1 2.53.2 3.74L17.5 22l3.6-3.55c1.2-1.21 1.14-2.8.19-3.74Z"/></svg>;
    const Download = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>;

    // --- 성암농장 실제 Firebase Configuration ---
    const firebaseConfig = {
      apiKey: "AIzaSyBlptGu2gTAQKVy_yDomKkNEd_el6c1PL0",
      authDomain: "sungamfarm.firebaseapp.com",
      projectId: "sungamfarm",
      storageBucket: "sungamfarm.firebasestorage.app",
      messagingSenderId: "811107235779",
      appId: "1:811107235779:web:ea65a74d09c37ba2136f76"
    };

    // Firebase 초기화
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    const SOWS_COLLECTION_PATH = 'farms/sungamfarm/sows';
    const SETTINGS_PATH = 'farms/sungamfarm/settings'; 
    const SHIPMENTS_COLLECTION_PATH = 'farms/sungamfarm/shipments';

    // 알림창 컴포넌트
    const CustomAlert = ({ message, onClose }) => (
      <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full p-5 text-center animate-[slideUp_0.2s_ease-out]">
          <div className="w-12 h-12 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-3">
            <span className="text-amber-500 text-xl font-bold">!</span>
          </div>
          <p className="text-sm font-bold text-slate-700 mb-5">{message}</p>
          <button 
            onClick={onClose}
            className="w-full bg-slate-800 text-white font-black py-3 rounded-xl hover:bg-slate-700 active:scale-95 transition-all"
          >
            확인
          </button>
        </div>
      </div>
    );

    // 확인창 컴포넌트
    const CustomConfirm = ({ message, onConfirm, onCancel }) => (
      <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
        <div className="bg-white rounded-2xl shadow-xl max-w-sm w-full p-5 text-center animate-[slideUp_0.2s_ease-out]">
          <div className="w-12 h-12 bg-rose-100 rounded-full flex items-center justify-center mx-auto mb-3">
            <span className="text-rose-500 text-xl font-bold">?</span>
          </div>
          <p className="text-sm font-bold text-slate-700 mb-5">{message}</p>
          <div className="flex gap-2">
            <button 
              onClick={onCancel}
              className="flex-1 bg-slate-100 text-slate-600 font-black py-3 rounded-xl hover:bg-slate-200 active:scale-95 transition-all"
            >
              취소
            </button>
            <button 
              onClick={onConfirm}
              className="flex-1 bg-rose-500 text-white font-black py-3 rounded-xl hover:bg-rose-600 active:scale-95 transition-all"
            >
              확인
            </button>
          </div>
        </div>
      </div>
    );

    function App() {
      const [user, setUser] = useState(null);
      const [sows, setSows] = useState([]);
      const [farmSettings, setFarmSettings] = useState({ avgSowCount: 0 }); 
      const [shipments, setShipments] = useState([]); 
      const [loading, setLoading] = useState(true);
      
      // 알림 상태 관리
      const [alertMsg, setAlertMsg] = useState(null);
      const [confirmConfig, setConfirmConfig] = useState(null);

      const showAlert = (message) => setAlertMsg(message);
      const showConfirm = (message, onConfirm) => {
        setConfirmConfig({
          message,
          onConfirm: () => { onConfirm(); setConfirmConfig(null); },
          onCancel: () => setConfirmConfig(null)
        });
      };

      // UI 상태 관리
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedSowId, setSelectedSowId] = useState(null);
      const [showAddSow, setShowAddSow] = useState(false);
      const [showAddRecord, setShowAddRecord] = useState(false);
      const [showSowListModal, setShowSowListModal] = useState(false);
      const [listFilter, setListFilter] = useState(null);
      
      // 팝업 상태
      const [showParityModal, setShowParityModal] = useState(false);
      const [showMonthlyModal, setShowMonthlyModal] = useState(false);
      const [showMonthlySowModal, setShowMonthlySowModal] = useState(false);
      const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());
      const [showDeletedMedicationsModal, setShowDeletedMedicationsModal] = useState(false);
      
      // 분만 완료 입력창 상태 저장용
      const [farrowingInputs, setFarrowingInputs] = useState({});

      // 폼 상태 (산자/포유/이동/이유 필드 분리 적용)
      const [newSow, setNewSow] = useState({ sowNo: '', parity: 0, currentStatus: '이유' });
      const [newRecord, setNewRecord] = useState({ parity: '', date: '', expDate: '', totalBorn: '', born: '', weaned: '', move: '' });

      // 가로 스크롤 포커스를 위한 Ref
      const farrowingScrollRef = useRef(null);
      const expectedFarrowingScrollRef = useRef(null);
      const weaning20ScrollRef = useRef(null);

      // --- Auth & Data Fetching ---
      useEffect(() => {
        // 1. 익명 로그인 시도
        auth.signInAnonymously().catch(err => {
          console.warn("익명 로그인 실패 (무시하고 데이터 호출 시도):", err);
        });
        
        // 2. 인증 상태 변경 감지
        const unsubscribeAuth = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          if (!currentUser) setLoading(false);
        });
        
        return () => unsubscribeAuth();
      }, []);

      useEffect(() => {
        if (!user) return;

        // 1. 모돈 정보 가져오기
        const unsubSows = db.collection(SOWS_COLLECTION_PATH).onSnapshot(
          (snapshot) => {
            const sowsData = snapshot.docs
              .map(doc => {
                const data = doc.data();
                return data ? { id: doc.id, ...data } : null;
              })
              .filter(sow => sow && (sow || {}).sowNo); 
            
            sowsData.sort((a, b) => String((a || {}).sowNo || '').localeCompare(String((b || {}).sowNo || '')));
            setSows(sowsData);
            setLoading(false);
          },
          (error) => {
            console.error("Error fetching sows:", error);
            setLoading(false);
          }
        );

        // 2. 농장 설정(평균 상시 모돈수 등) 가져오기
        const unsubSettings = db.collection(SETTINGS_PATH).doc('main').onSnapshot(
          (doc) => {
            if (doc.exists && doc.data()) {
              setFarmSettings(doc.data());
            }
          },
          (error) => console.error("Error fetching settings:", error)
        );

        // 3. 사육현황 출하 기록 가져오기 (자동 연동)
        const unsubShipments = db.collection(SHIPMENTS_COLLECTION_PATH).onSnapshot(
          (snapshot) => {
            const records = snapshot.docs.map(doc => doc.data());
            setShipments(records);
          },
          (error) => console.error("Error fetching shipments:", error)
        );

        return () => { unsubSows(); unsubSettings(); unsubShipments(); };
      }, [user]);

      // 헬퍼: 범용 날짜 파싱
      const parseValidDate = (dateStr) => {
        if (!dateStr) return null;
        const str = String(dateStr).trim();
        if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return new Date(str);

        const parts = str.split(/[-/.]/);
        if (parts.length === 3) {
          let y = parts[0].length === 2 ? 2000 + parseInt(parts[0], 10) : parseInt(parts[0], 10);
          let m = parseInt(parts[1], 10) - 1;
          let d = parseInt(parts[2], 10);
          return new Date(y, m, d);
        } else if (parts.length === 2) {
          let y = new Date().getFullYear(); 
          let m = parseInt(parts[0], 10) - 1;
          let d = parseInt(parts[1], 10);
          return new Date(y, m, d);
        }
        
        const parsed = new Date(str);
        return isNaN(parsed.getTime()) ? null : parsed;
      };

      // 헬퍼: 표준 형식으로 재변환
      const formatDate = (dateObj) => {
        if (!dateObj) return '';
        const yy = dateObj.getFullYear();
        const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
        const dd = String(dateObj.getDate()).padStart(2, '0');
        return `${yy}-${mm}-${dd}`;
      };

      // 헬퍼: 모돈의 '가장 최근 분만 기록'을 날짜 기준으로 확실하게 찾는 함수
      const getLatestHistoryRecord = (sow) => {
        if (!sow || !sow.history || !Array.isArray(sow.history)) return null;
        const validRecords = sow.history.filter(r => r && r.date);
        if (validRecords.length === 0) return null;
        validRecords.sort((a, b) => new Date(b.date) - new Date(a.date));
        return validRecords[0]; 
      };

      // 헬퍼: 분만 예정일 계산 (+115일)
      const getExpectedFarrow = (matingDate) => {
        const d = parseValidDate(matingDate);
        if (!d) return '';
        d.setDate(d.getDate() + 115); // 사육현황 앱 기준 114일/115일 혼용 방지를 위해 통일
        return formatDate(d);
      };

      // 헬퍼: 분만일 기준 이유하는 목요일 계산
      const getWeaningThursday = (farrowDateStr) => {
        const d = parseValidDate(farrowDateStr);
        if (!d) return null;
        const currentDay = d.getDay(); 
        const diffToMonday = currentDay === 0 ? -6 : 1 - currentDay; 
        d.setDate(d.getDate() + diffToMonday + 24);
        return formatDate(d);
      };

      // 헬퍼: 날짜 덧셈 (일반적인 n일 이후 계산)
      const addDays = (dateStr, days) => {
        const d = parseValidDate(dateStr);
        if (!d) return '';
        d.setDate(d.getDate() + days);
        return formatDate(d);
      };

      // 헬퍼: 날짜 뺄셈 (일반적인 n일 이전 계산)
      const subtractDays = (dateStr, days) => {
        const d = parseValidDate(dateStr);
        if (!d) return '';
        d.setDate(d.getDate() - days);
        return formatDate(d);
      };

      // 헬퍼: 해당 주차의 월요일 구하기 (분만 주차용)
      const getMonday = (dateStr) => {
        const d = parseValidDate(dateStr);
        if (!d) return null;
        const currentDay = d.getDay(); 
        const diffToMonday = currentDay === 0 ? -6 : 1 - currentDay; 
        d.setDate(d.getDate() + diffToMonday);
        return formatDate(d);
      };

      // 💡 한국형 달력 주차 계산법 (사육현황 앱 동기화 - 달력 1일 기준)
      const getWeekOfMonthString = (mondayDateStr) => {
        const monday = parseValidDate(mondayDateStr);
        if (!monday) return '';
        
        const sunday = new Date(monday);
        sunday.setDate(sunday.getDate() + 6);
        
        const targetMonth = sunday.getMonth();
        const targetYear = sunday.getFullYear();
        
        const firstDayOfMonth = new Date(targetYear, targetMonth, 1);
        const firstDayMonday = parseValidDate(getMonday(formatDate(firstDayOfMonth)));
        
        const diffInDays = Math.floor((monday - firstDayMonday) / (24 * 60 * 60 * 1000));
        const weekNumber = Math.floor(diffInDays / 7) + 1;
        
        return `${targetMonth + 1}월 ${weekNumber}주차`;
      };


      // --- Data Processing ---
      const filteredSows = useMemo(() => {
        let result = sows.filter(Boolean);

        if (listFilter) {
          const filterObj = listFilter || {};
          if (filterObj.type === 'status') {
            result = result.filter(sow => sow && ((sow || {}).currentStatus || '이유') === filterObj.value);
          } else if (filterObj.type === 'parity') {
            result = result.filter(sow => sow && (Number((sow || {}).parity) || 0) === Number(filterObj.value));
          } else if (filterObj.type === 'expectedMonth') {
            result = result.filter(sow => {
              const s = sow || {};
              if (!s.matingDate || s.currentStatus === '포유' || s.currentStatus === '재발') return false;
              const expDateStr = getExpectedFarrow(s.matingDate);
              return expDateStr && expDateStr.substring(0, 7) === filterObj.value;
            });
          } else if (filterObj.type === 'farrowingWeek') {
            result = result.filter(sow => {
              const s = sow || {};
              const currentMonday = getMonday(new Date().toISOString().split('T')[0]);

              // 1. 실제 분만 완료 매칭 (history 기록)
              const matchActual = s.history && Array.isArray(s.history) && s.history.some(r => r && r.date && getMonday(r.date) === filterObj.value);
              // 2. 분만 예정 매칭 (교배일 기준)
              const expDateStr = s.matingDate && s.currentStatus !== '재발' ? getExpectedFarrow(s.matingDate) : null;
              const matchExpected = expDateStr && getMonday(expDateStr) === filterObj.value;
              // 3. 교배일조차 없고 상태만 '포유'인 경우
              const matchFallback = !s.matingDate && s.currentStatus === '포유' && filterObj.value === currentMonday;
              
              return matchActual || matchExpected || matchFallback;
            });
          } else if (filterObj.type === 'weaning20Week') {
             // 필터링 시 모돈 색출 로직 (정확히 20일이 도래하는 날짜가 속한 주차로 묶음)
             result = result.filter(sow => {
              const s = sow || {};
              if ((s.currentStatus || '').trim() !== '포유') return false;
              const r = getLatestHistoryRecord(s);
              if (!r || !r.date) return false;
              const targetWeaningDate = addDays(r.date, 20);
              const targetWeaningWeek = getMonday(targetWeaningDate);
              return targetWeaningWeek === filterObj.value;
            });
          } else if (filterObj.type === 'expectedFarrowingWeek') {
             // 주간 예상 분만 복수 팝업용 필터
             result = result.filter(sow => {
                const s = sow || {};
                if (!s.matingDate || s.currentStatus === '재발' || s.currentStatus === '포유') return false;
                const expDateStr = getExpectedFarrow(s.matingDate);
                return expDateStr && getMonday(expDateStr) === filterObj.value;
             });
          } else if (filterObj.type === 'activityMonth') {
            result = result.filter(sow => {
              const s = sow || {};
              let matedThisMonth = false;
              if (s.matingDate) {
                const parsed = parseValidDate(s.matingDate);
                if (parsed && formatDate(parsed).substring(0, 7) === filterObj.value) matedThisMonth = true;
              }
              let farrowedThisMonth = false;
              if (s.history && Array.isArray(s.history)) {
                farrowedThisMonth = s.history.some(r => {
                  if (r && r.date) {
                    const parsed = parseValidDate(r.date);
                    return parsed && formatDate(parsed).substring(0, 7) === filterObj.value;
                  }
                  return false;
                });
              }
              return matedThisMonth || farrowedThisMonth;
            });
          }
        }

        if (searchQuery) {
          result = result.filter(sow => 
            sow && String((sow || {}).sowNo || '').toLowerCase().includes(String(searchQuery).toLowerCase())
          );
        }

        return result;
      }, [sows, searchQuery, listFilter]);

      const currentSow = useMemo(() => {
        return sows.find(s => s && (s || {}).id === selectedSowId) || null;
      }, [sows, selectedSowId]);

      // 대시보드 통계 계산
      const dashboardStats = useMemo(() => {
        const stats = {
          total: sows.filter(sow => sow && (Number(sow.parity) || 0) > 0).length,
          status: { '이유': 0, '임신': 0, '포유': 0, '재발': 0 },
          parity: {},
          monthlyFarrowing: {}
        };
        
        const oneYearAgo = new Date();
        oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);
        const oneYearAgoStr = formatDate(oneYearAgo);
        
        let historyYearlyWeaned = 0;
        
        sows.filter(Boolean).forEach(sow => {
          const s = sow || {};
          const status = s.currentStatus || '이유';
          if (stats.status[status] !== undefined) stats.status[status]++;
          
          const p = Number(s.parity) || 0;
          if (stats.parity[p] !== undefined) stats.parity[p]++;
          else stats.parity[p] = 1;

          if (s.matingDate && s.currentStatus !== '포유' && s.currentStatus !== '재발') {
            const expDateStr = getExpectedFarrow(s.matingDate);
            if (expDateStr) {
              const ym = expDateStr.substring(0, 7);
              stats.monthlyFarrowing[ym] = (stats.monthlyFarrowing[ym] || 0) + 1;
            }
          }

          if (s.history && Array.isArray(s.history)) {
            s.history.forEach(r => {
               if (r && r.date && r.date >= oneYearAgoStr) {
                 historyYearlyWeaned += Number(r.move || 0);
               }
            });
          }
        });

        let dbYearlyShipped = 0;
        shipments.forEach(record => {
          if (record && record.date && record.date >= oneYearAgoStr) {
            dbYearlyShipped += Number(record.count || 0);
          }
        });

        const fSettings = farmSettings || {};
        const avgSows = fSettings.avgSowCount > 0 ? fSettings.avgSowCount : stats.total;
        const autoShipped = Math.floor(historyYearlyWeaned * 0.95);
        const yearlyShipped = dbYearlyShipped > 0 ? dbYearlyShipped : autoShipped;

        stats.avgSows = avgSows;
        stats.historyYearlyWeaned = historyYearlyWeaned;
        stats.yearlyShipped = yearlyShipped;
        stats.autoShipped = autoShipped;
        stats.dbYearlyShipped = dbYearlyShipped;

        return stats;
      }, [sows, farmSettings, shipments]);

      // 모돈별 통계
      const sowStats = useMemo(() => {
        const s = currentSow || {};
        if (!s.history || !Array.isArray(s.history)) {
          return { totalLitters: 0, avgBorn: 0, avgWeaned: 0 };
        }
        
        const history = s.history.filter(Boolean);
        const totalLitters = history.length;
        const totalBorn = history.reduce((sum, r) => sum + Number(r.totalBorn || r.born || 0), 0);
        const totalWeaned = history.reduce((sum, r) => sum + Number(r.move || 0), 0);
        
        return {
          totalLitters,
          avgBorn: totalLitters > 0 ? (totalBorn / totalLitters).toFixed(1) : "0.0",
          avgWeaned: totalLitters > 0 ? (totalWeaned / totalLitters).toFixed(1) : "0.0"
        };
      }, [currentSow]);

      // 주간별 분만 현황 산출 (기존 로직 유지)
      const weeklyFarrowingStats = useMemo(() => {
        const statsMap = {};
        const todayStr = formatDate(new Date());
        const currentMonday = getMonday(todayStr);

        sows.filter(Boolean).forEach(sow => {
          const s = sow || {};
          
          if (s.history && Array.isArray(s.history)) {
            s.history.filter(Boolean).forEach(record => {
              const r = record || {};
              if (!r.date) return; 
              
              const monday = getMonday(r.date);
              if (!monday) return;

              if (!statsMap[monday]) {
                statsMap[monday] = { date: monday, actual: 0, expected: 0, parity6Plus: 0, nursingPiglets: 0, sows: [] };
              }
              statsMap[monday].actual += 1;
              
              const nursingStart = Number(r.born || 0);
              const transferOut = Number(r.weaned || 0);
              statsMap[monday].nursingPiglets += (nursingStart >= transferOut ? nursingStart - transferOut : 0);
              
              if (Number(s.parity || 0) >= 6) {
                statsMap[monday].parity6Plus += 1;
              }

              if (!statsMap[monday].sows.find(item => item && item.id === s.id)) {
                statsMap[monday].sows.push(s);
              }
            });
          }

          if (s.matingDate && s.currentStatus !== '재발') {
            const expDateStr = getExpectedFarrow(s.matingDate);
            if (expDateStr) {
              const expMonday = getMonday(expDateStr);
              if (expMonday) {
                const hasActualThisWeek = s.history && Array.isArray(s.history) && s.history.some(r => r && r.date && getMonday(r.date) === expMonday);
                
                if (!hasActualThisWeek) {
                  if (!statsMap[expMonday]) {
                    statsMap[expMonday] = { date: expMonday, actual: 0, expected: 0, parity6Plus: 0, nursingPiglets: 0, sows: [] };
                  }
                  
                  if (s.currentStatus === '포유') {
                    statsMap[expMonday].actual += 1;
                    if (Number(s.parity || 0) >= 6) statsMap[expMonday].parity6Plus += 1;
                  } else {
                    statsMap[expMonday].expected += 1;
                    if ((Number(s.parity || 0) + 1) >= 6) statsMap[expMonday].parity6Plus += 1;
                  }

                  if (!statsMap[expMonday].sows.find(item => item && item.id === s.id)) {
                    statsMap[expMonday].sows.push(s);
                  }
                }
              }
            }
          } else if (!s.matingDate && s.currentStatus === '포유' && currentMonday) {
             const hasActualThisWeek = s.history && Array.isArray(s.history) && s.history.some(r => r && r.date && getMonday(r.date) === currentMonday);
             if (!hasActualThisWeek) {
                if (!statsMap[currentMonday]) {
                  statsMap[currentMonday] = { date: currentMonday, actual: 0, expected: 0, parity6Plus: 0, nursingPiglets: 0, sows: [] };
                }
                statsMap[currentMonday].actual += 1;
                if (Number(s.parity || 0) >= 6) statsMap[currentMonday].parity6Plus += 1;
                if (!statsMap[currentMonday].sows.find(item => item && item.id === s.id)) {
                statsMap[currentMonday].sows.push(s);
              }
             }
          }
        });

        return Object.values(statsMap).sort((a, b) => String((a || {}).date || '').localeCompare(String((b || {}).date || '')));
      }, [sows]);

      // 💡 주간 예상 분만 복수 로직 (새롭게 추가된 부분)
      const expectedFarrowingStats = useMemo(() => {
        const statsMap = {};
        const todayStr = formatDate(new Date());
        const currentMonday = getMonday(todayStr);
        // 과거 데이터 정리를 위해 2주 전까지만 표시
        const twoWeeksAgo = subtractDays(currentMonday, 14);

        sows.filter(Boolean).forEach(sow => {
          const s = sow || {};
          
          // 종부일이 있고, 아직 분만하지 않았으며, 재발이나 포유가 아닌 경우만
          if (s.matingDate && s.currentStatus !== '재발' && s.currentStatus !== '포유') {
            const expectedFarrowingDate = getExpectedFarrow(s.matingDate);
            if (expectedFarrowingDate) {
              const weekKey = getMonday(expectedFarrowingDate);
              
              if (weekKey && weekKey >= twoWeeksAgo) {
                if (!statsMap[weekKey]) {
                  statsMap[weekKey] = { date: weekKey, count: 0, sows: [] };
                }
                statsMap[weekKey].count += 1;
                statsMap[weekKey].sows.push(s);
              }
            }
          }
        });

        return Object.values(statsMap).sort((a, b) => String((a || {}).date || '').localeCompare(String((b || {}).date || '')));
      }, [sows]);

      // 20일령(이유) 도래 복수
      const weeklyWeaning20DaysStats = useMemo(() => {
        const statsMap = {};
        const todayStr = formatDate(new Date());
        const currentMonday = getMonday(todayStr);
        const fourWeeksAgo = subtractDays(currentMonday, 28); 

        sows.filter(Boolean).forEach(sow => {
          const s = sow || {};
          if ((s.currentStatus || '').trim() !== '포유') return;
          const r = getLatestHistoryRecord(s); 
          if (!r || !r.date) return;
          
          const targetWeaningDate = addDays(r.date, 20);
          const targetWeaningWeek = getMonday(targetWeaningDate); 
          
          if (targetWeaningWeek >= fourWeeksAgo) {
            if (!statsMap[targetWeaningWeek]) {
              statsMap[targetWeaningWeek] = { date: targetWeaningWeek, count: 0, sows: [] };
            }
            // 중복 방지를 위해 확인 후 삽입
            if (!statsMap[targetWeaningWeek].sows.find(item => item && item.id === s.id)) {
                statsMap[targetWeaningWeek].sows.push(s); 
                statsMap[targetWeaningWeek].count += 1;
            }
          }
        });

        return Object.values(statsMap).sort((a, b) => String((a || {}).date || '').localeCompare(String((b || {}).date || '')));
      }, [sows]);

      // 월별 후보돈 예상 입수 두수 계산
      const monthlyGiltIntroStats = useMemo(() => {
        const statsMap = {};
        
        weeklyFarrowingStats.forEach(stat => {
          const validSowsCount = (stat.actual || 0) + (stat.expected || 0) - (stat.parity6Plus || 0);
          const missingCount = 12 - validSowsCount;

          if (missingCount >= 2) {
            const weaningThursday = getWeaningThursday(stat.date);
            if (weaningThursday) {
              const estMatingDate = addDays(weaningThursday, 4); 
              const giltIntroDate = subtractDays(estMatingDate, 60); 
              const ym = giltIntroDate.substring(0, 7);
              
              if (!statsMap[ym]) statsMap[ym] = 0;
              statsMap[ym] += missingCount;
            }
          }
        });

        const today = new Date();
        const currentYM = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;

        return Object.keys(statsMap)
          .filter(ym => ym >= currentYM)
          .sort()
          .map(ym => ({ month: ym, count: statsMap[ym] }));
      }, [weeklyFarrowingStats]);

      // 예정된 후보돈 약제 투여 알림
      const upcomingMedications = useMemo(() => {
        const today = new Date();
        const yy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        const todayStr = `${yy}-${mm}-${dd}`;
        
        const upcoming = [];
        const deleted = [];
        
        weeklyFarrowingStats.forEach(stat => {
          const validSowsCount = (stat.actual || 0) + (stat.expected || 0) - (stat.parity6Plus || 0);
          const missingCount = 12 - validSowsCount; 

          if (missingCount >= 2) {
            const weaningThursday = getWeaningThursday(stat.date);
            if (weaningThursday) {
              const estMatingDate = addDays(weaningThursday, 4); 
              
              const medEndDate = subtractDays(estMatingDate, 4); 
              const medStartDate = subtractDays(medEndDate, 17); 
              
              const medWeekMonday = getMonday(medStartDate); 
              const matingWeekMonday = getMonday(estMatingDate);
              
              if (estMatingDate >= todayStr) {
                const deleteKey = `medDeleted_${medWeekMonday}`;
                const medData = {
                  medWeekMonday,
                  medStartDate,
                  medEndDate,
                  matingWeekMonday,
                  estMatingDate,
                  autoCount: missingCount
                };
                if (farmSettings && farmSettings[deleteKey]) {
                  deleted.push(medData);
                } else {
                  upcoming.push(medData);
                }
              }
            }
          }
        });

        return {
          upcoming: upcoming.sort((a, b) => a.medStartDate.localeCompare(b.medStartDate)).slice(0, 4),
          deleted: deleted.sort((a, b) => a.medStartDate.localeCompare(b.medStartDate))
        };
      }, [weeklyFarrowingStats, farmSettings]);

      // 월별 실적
      const monthlyActivityStats = useMemo(() => {
        const statsMap = {};
        
        sows.filter(Boolean).forEach(sow => {
          const s = sow || {};
          
          if (s.matingDate) {
            const parsed = parseValidDate(s.matingDate);
            if (parsed) {
              const ym = formatDate(parsed).substring(0, 7);
              if (!statsMap[ym]) statsMap[ym] = { month: ym, mated: 0, farrowed: 0 };
              statsMap[ym].mated += 1;
            }
          }
          
          if (s.history && Array.isArray(s.history)) {
            s.history.filter(Boolean).forEach(r => {
              if (r && r.date) {
                const parsed = parseValidDate(r.date);
                if (parsed) {
                  const ym = formatDate(parsed).substring(0, 7);
                  if (!statsMap[ym]) statsMap[ym] = { month: ym, mated: 0, farrowed: 0 };
                  statsMap[ym].farrowed += 1;
                }
              }
            });
          }
        });

        return Object.values(statsMap).sort((a, b) => String(b.month || '').localeCompare(String(a.month || '')));
      }, [sows]);

      // --- 매월 현재 모돈수 자동 기록 (후보돈 제외 적용) ---
      useEffect(() => {
        if (!user || loading) return;
        
        const currentSowsCount = sows.filter(sow => sow && (Number(sow.parity) || 0) > 0).length;
        if (currentSowsCount === 0) return; 

        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const currentYM = `${yyyy}-${mm}`;

        const savedCounts = (farmSettings || {}).monthlySowCounts || {};
        
        if (savedCounts[currentYM] !== currentSowsCount) {
          const newCounts = { ...savedCounts, [currentYM]: currentSowsCount };
          db.collection(SETTINGS_PATH).doc('main').set({ monthlySowCounts: newCounts }, { merge: true })
            .catch(err => console.error("월별 모돈수 자동 기록 실패:", err));
        }
      }, [sows, farmSettings, user, loading]);

      // --- Handlers ---
      const handleSaveSetting = (field, val) => {
        const numberVal = Number(val);
        db.collection(SETTINGS_PATH).doc('main').set({ [field]: numberVal }, { merge: true }).catch(err => {
          showAlert("설정 저장 실패: " + err.message);
        });
      };

      const handleSaveMonthlySowCount = (yearMonth, val) => {
        const currentCounts = (farmSettings || {}).monthlySowCounts || {};
        const newCounts = { ...currentCounts };
        if (val === '') delete newCounts[yearMonth];
        else newCounts[yearMonth] = Number(val);
        
        db.collection(SETTINGS_PATH).doc('main').set({ monthlySowCounts: newCounts }, { merge: true }).catch(err => {
          console.error("월말 모돈수 저장 실패:", err);
        });
      };

      const handleSaveMedicationOverride = (week, val) => {
        const field = `medOverride_${week}`;
        const updateData = val === '' ? { [field]: null } : { [field]: Number(val) };
        db.collection(SETTINGS_PATH).doc('main').set(updateData, { merge: true }).catch(err => {
          console.error("약제 투여 두수 저장 실패:", err);
        });
      };

      const handleDeleteMedicationSchedule = (week) => {
        showConfirm("이 약제 투여 일정을 삭제(숨김)하시겠습니까?", () => {
          const field = `medDeleted_${week}`;
          db.collection(SETTINGS_PATH).doc('main').set({ [field]: true }, { merge: true }).catch(err => {
            console.error("약제 투여 일정 삭제 실패:", err);
            showAlert("삭제 실패: " + err.message);
          });
        });
      };

      const handleRestoreMedicationSchedule = (week) => {
          const field = `medDeleted_${week}`;
          db.collection(SETTINGS_PATH).doc('main').update({ [field]: firebase.firestore.FieldValue.delete() }).catch(err => {
            console.error("약제 투여 일정 복구 실패:", err);
            showAlert("복구 실패: " + err.message);
          });
      };

      // 💡 개별 모돈 빠른 분만 완료 처리 (주간 예상 분만 팝업용)
      const completeSingleSowFarrowing = async (sowId, weekKey) => {
        const tInpVal = farrowingInputs[sowId];
        const total = tInpVal && tInpVal !== '' ? parseInt(tInpVal) || 0 : 0;
        const born = total;
        
        const sow = sows.find(s => s.id === sowId);
        if (!sow) return;
        
        const today = new Date();
        const todayStr = formatDate(today);
        
        let history = [...(sow.history || [])];
        history.sort((a, b) => (Number(b.parity) || 0) - (Number(a.parity) || 0));
        
        if (history.length === 0 || history[0].date) {
            const expDate = sow.matingDate ? getExpectedFarrow(sow.matingDate) : '';
            history.push({ 
              parity: Number(sow.parity) || 0, 
              expDate: expDate, 
              date: todayStr, 
              totalBorn: total, 
              born: born, 
              weaned: 0, 
              move: 0 
            });
        } else {
            history[0].date = todayStr; 
            history[0].totalBorn = total; 
            history[0].born = born;
        }
        
        try {
            await db.collection(SOWS_COLLECTION_PATH).doc(sowId).update({
              currentStatus: '포유',
              history: history
            });
            showAlert(`${sow.sowNo}번 분만 완료 처리되었습니다.`);
            
            // 입력창 초기화
            setFarrowingInputs(prev => ({...prev, [sowId]: ''}));
            
            // 만약 현재 팝업에 남은 돼지가 없다면 팝업을 닫음
            setTimeout(() => {
                const remaining = sows.filter(s => {
                    if (s.id === sowId) return false; // 방금 처리한 돼지 제외
                    if (!s.matingDate || s.currentStatus === '재발' || s.currentStatus === '포유') return false;
                    const expectedFarrowingDate = getExpectedFarrow(s.matingDate);
                    return expectedFarrowingDate && getMonday(expectedFarrowingDate) === weekKey;
                });
                if (remaining.length === 0) setShowSowListModal(false);
            }, 500);

        } catch (e) { 
            showAlert("실패: " + e.message); 
        }
      };


      const handleAddSow = async (e) => {
        e.preventDefault();
        const ns = newSow || {};
        if (!user || !ns.sowNo) return;
        try {
          await db.collection(SOWS_COLLECTION_PATH).add({
            sowNo: ns.sowNo || '',
            parity: Number(ns.parity) || 0,
            currentStatus: ns.currentStatus || '이유',
            matingDate: '',
            history: []
          });
          setNewSow({ sowNo: '', parity: 0, currentStatus: '이유' });
          setShowAddSow(false);
        } catch (err) {
          console.error("Error adding sow:", err);
          showAlert("추가 실패: " + err.message);
        }
      };

      const handleDeleteSow = async (id) => {
        if (!user) return;
        showConfirm("정말로 이 모돈과 모든 기록을 삭제하시겠습니까?", async () => {
          try {
            await db.collection(SOWS_COLLECTION_PATH).doc(id).delete();
            if (selectedSowId === id) setSelectedSowId(null);
          } catch (err) {
            console.error("Error deleting sow:", err);
            showAlert("삭제 실패: " + err.message);
          }
        });
      };

      const handleUpdateStatus = async (field, value) => {
        const s = currentSow || {};
        if (!user || !s.id) return;
        try {
          await db.collection(SOWS_COLLECTION_PATH).doc(s.id).update({
            [field]: value
          });
        } catch (err) {
          console.error(`Error updating ${field}:`, err);
        }
      };

      const handleAddRecord = async (e) => {
        e.preventDefault();
        const s = currentSow || {};
        const nr = newRecord || {};
        if (!user || !s.id) return;
        try {
          const newHistoryItem = {
            parity: Number(nr.parity) || 0,
            date: nr.date || '',
            expDate: nr.expDate || '',
            totalBorn: Number(nr.totalBorn) || 0, 
            born: Number(nr.born) || 0,           
            weaned: Number(nr.weaned) || 0,       
            move: Number(nr.move) || 0            
          };
          
          const updatedHistory = [...(s.history || []).filter(Boolean), newHistoryItem]
            .sort((a, b) => (Number((b || {}).parity) || 0) - (Number((a || {}).parity) || 0));

          await db.collection(SOWS_COLLECTION_PATH).doc(s.id).update({
            history: updatedHistory,
            parity: Math.max(Number(s.parity) || 0, newHistoryItem.parity || 0)
          });
          
          setNewRecord({ parity: '', date: '', expDate: '', totalBorn: '', born: '', weaned: '', move: '' });
          setShowAddRecord(false);
        } catch (err) {
          console.error("Error adding record:", err);
          showAlert("기록 추가 실패: " + err.message);
        }
      };

      const handleDeleteRecord = async (indexToRemove) => {
        const s = currentSow || {};
        if (!user || !s.id) return;
        showConfirm("이 기록을 삭제하시겠습니까?", async () => {
          try {
            const updatedHistory = (s.history || []).filter(Boolean).filter((_, idx) => idx !== indexToRemove);
            await db.collection(SOWS_COLLECTION_PATH).doc(s.id).update({
              history: updatedHistory
            });
          } catch (err) {
            console.error("Error deleting record:", err);
          }
        });
      };

      const openFilteredList = (type, value) => {
        setListFilter({ type, value });
        setSearchQuery('');
        setShowSowListModal(true);
      };

      const openAllList = () => {
        setListFilter(null);
        setSearchQuery('');
        setShowSowListModal(true);
      };

      const getStatusColor = (status) => {
        switch(status) {
          case '포유': return 'text-emerald-600 bg-emerald-50 border-emerald-200';
          case '임신': return 'text-blue-600 bg-blue-50 border-blue-200';
          case '재발': return 'text-rose-600 bg-rose-50 border-rose-200';
          default: return 'text-slate-600 bg-slate-100 border-slate-200';
        }
      };

      // --- Renderers ---
      if (loading) {
        return <div className="flex items-center justify-center h-screen bg-slate-50"><p className="text-lg font-bold text-slate-500 animate-pulse">농장 데이터베이스 연결 중...</p></div>;
      }

      // --- View 2: 모돈 상세 및 성적 뷰 ---
      if (currentSow) {
        const s = currentSow || {};
        const historyList = (s.history || []).filter(Boolean); 
        
        return (
          <div className="min-h-screen bg-slate-50 pb-20 md:pb-10 font-sans">
            {alertMsg && <CustomAlert message={alertMsg} onClose={() => setAlertMsg(null)} />}
            {confirmConfig && <CustomConfirm message={confirmConfig.message} onConfirm={confirmConfig.onConfirm} onCancel={confirmConfig.onCancel} />}
            
            <header className="bg-white border-b border-slate-200 p-4 sticky top-0 z-10 shadow-sm flex items-center justify-between">
              <button onClick={() => setSelectedSowId(null)} className="flex items-center text-slate-500 hover:text-slate-800 transition p-2 bg-slate-100 rounded-lg">
                <ArrowLeft className="w-5 h-5" />
              </button>
              <div className="flex flex-col items-center">
                <h1 className="text-xl font-black text-slate-800 tracking-tight">No. {s.sowNo || '-'}</h1>
                <span className="text-xs font-bold text-slate-400">{s.parity || 0}산</span>
              </div>
              <button onClick={() => handleDeleteSow(s.id)} className="p-2 text-rose-400 hover:bg-rose-50 rounded-lg transition" title="모돈 삭제">
                <Trash2 className="w-5 h-5" />
              </button>
            </header>

            <main className="max-w-3xl mx-auto p-4 space-y-5">

                        <span className="text-[10px] text-emerald-200 mt-0.5">해당 주간에 20일령이 도래하는 개체 그룹</span>
                      </div>
                      <span className="text-[13px] font-black text-emerald-300">{filteredSows.length}복</span>
                    </div>
                    <div className="grid grid-cols-6 gap-1.5 mt-1">
                      {filteredSows.map(sow => {
                        const s = sow || {};
                        const r = getLatestHistoryRecord(s);
                        const farrowDate = r ? r.date : '-';
                        const weaningDate = r && r.date ? addDays(r.date, 20) : '-'; 

                        return (
                          <div 
                            key={s.id} 
                            onClick={() => { setSelectedSowId(s.id); setShowSowListModal(false); }}
                            className="bg-white p-1 rounded-xl border border-emerald-200 shadow-sm cursor-pointer active:scale-95 transition-all flex flex-col items-center justify-center relative overflow-hidden hover:border-emerald-400"
                          >
                            <div className="flex flex-col items-center gap-0 mb-1 mt-1 w-full px-0.5">
                              <span className="text-[11px] font-black text-slate-800 leading-none tracking-tighter truncate w-full text-center">{s.sowNo || '-'}</span>
                              <span className="text-[8px] font-bold text-slate-400 leading-none mt-0.5">{s.parity || 0}산</span>
                            </div>
                            <div className="w-full flex flex-col items-center py-1 rounded-lg border bg-emerald-50 border-emerald-100">
                              <span className="text-[8px] font-black leading-none mb-0.5 text-emerald-600">분만 {farrowDate.substring(5).replace('-','/')}</span>
                              <span className="text-[8px] font-bold text-slate-600 leading-none tracking-tighter">목표 {weaningDate.substring(5).replace('-','/')}</span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ) : (
                  <div className="grid grid-cols-6 gap-1.5">
                    {filteredSows.map(sow => {
                      const s = sow || {};
                      const statusClass = getStatusColor(s.currentStatus);
                      return (
                        <div 
                          key={s.id} 
                          onClick={() => {
                            setSelectedSowId(s.id);
                            setShowSowListModal(false);
                          }}
                          className="bg-white p-1.5 rounded-xl border border-slate-100 hover:border-blue-300 shadow-sm cursor-pointer active:scale-95 transition-all flex flex-col items-center justify-center relative overflow-hidden"
                        >
                          <div className="flex flex-col items-center gap-0 mb-1.5 mt-1 w-full px-0.5">
                            <span className="text-xs font-black text-slate-800 leading-none tracking-tighter truncate w-full text-center">{s.sowNo || '-'}</span>
                            <span className="text-[9px] font-bold text-slate-400 leading-none mt-0.5">{s.parity || 0}산</span>
                          </div>
                          <span className={"text-[9px] font-black w-full text-center py-1 rounded-lg border leading-none " + statusClass}>
                            {s.currentStatus || '이유'}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* --- 산차별 현황 팝업 --- */}
          {showParityModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[80] flex items-end md:items-center justify-center">
              <div className="bg-white rounded-t-[2rem] md:rounded-[2rem] w-full max-w-sm p-6 shadow-2xl animate-[slideUp_0.2s_ease-out]">
                <div className="flex justify-between items-center mb-6">
                  <div className="flex flex-col">
                    <h3 className="text-lg font-black text-slate-800">산차별 현황</h3>
                    <span className="text-xs font-bold text-indigo-500">클릭하여 해당 산차 목록 확인</span>
                  </div>
                  <button onClick={() => setShowParityModal(false)} className="p-2 bg-slate-100 rounded-full text-slate-500 hover:text-slate-800 transition-colors"><X className="w-5 h-5" /></button>
                </div>
                
                <div className="grid grid-cols-4 sm:grid-cols-5 gap-2 max-h-[60vh] overflow-y-auto no-scrollbar pb-4">
                  {Object.keys((dashboardStats || {}).parity || {}).sort((a,b) => Number(a) - Number(b)).map(p => (
                    <div key={p} onClick={() => { setShowParityModal(false); openFilteredList('parity', Number(p)); }} className="bg-slate-50 border border-slate-200 rounded-xl p-3 flex flex-col items-center shadow-sm cursor-pointer hover:border-blue-300 hover:bg-blue-50 active:scale-95 transition-all">
                      <span className="text-[10px] font-bold text-slate-400 mb-0.5">{p}산</span>
                      <span className="text-lg font-black text-slate-800">{((dashboardStats || {}).parity || {})[p] || 0}<span className="text-[10px] font-bold ml-0.5">두</span></span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* --- 월별 분만 예정 현황 팝업 --- */}
          {showMonthlyModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[80] flex items-end md:items-center justify-center">
              <div className="bg-white rounded-t-[2rem] md:rounded-[2rem] w-full max-w-sm p-6 shadow-2xl animate-[slideUp_0.2s_ease-out]">
                <div className="flex justify-between items-center mb-6">
                  <div className="flex flex-col">
                    <h3 className="text-lg font-black text-slate-800">월별 분만 예정 현황</h3>
                    <span className="text-xs font-bold text-rose-500">교배일 기준 (클릭하여 목록 확인)</span>
                  </div>
                  <button onClick={() => setShowMonthlyModal(false)} className="p-2 bg-slate-100 rounded-full text-slate-500 hover:text-slate-800 transition-colors"><X className="w-5 h-5" /></button>
                </div>
                
                <div className="grid grid-cols-3 sm:grid-cols-4 gap-2 max-h-[60vh] overflow-y-auto no-scrollbar pb-4">
                  {Object.keys((dashboardStats || {}).monthlyFarrowing || {}).length === 0 ? (
                    <div className="col-span-full text-center py-5 bg-slate-50 border border-dashed border-slate-200 rounded-2xl text-xs font-bold text-slate-400">
                      등록된 교배 일정(분만 예정)이 없습니다.
                    </div>
                  ) : (
                    Object.keys((dashboardStats || {}).monthlyFarrowing || {}).sort().map(ym => {
                      const [yyyy, mm] = ym.split('-');
                      return (
                        <div key={ym} onClick={() => { setShowMonthlyModal(false); openFilteredList('expectedMonth', ym); }} className="bg-rose-50 border border-rose-100 rounded-xl p-3 flex flex-col justify-center relative overflow-hidden shadow-sm cursor-pointer hover:border-rose-300 hover:bg-rose-100 active:scale-95 transition-all">
                          <div className="absolute top-0 left-0 w-1.5 h-full bg-rose-400"></div>
                          <span className="text-[11px] font-black text-slate-500 mb-1 pl-1">{yyyy}년 {parseInt(mm)}월</span>
                          <div className="flex items-baseline pl-1">
                            <span className="text-2xl font-black text-rose-600">{((dashboardStats || {}).monthlyFarrowing || {})[ym] || 0}</span>
                            <span className="text-[10px] font-bold ml-0.5 text-rose-400">복</span>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            </div>
          )}

          {/* --- 월말 모돈수 기록 및 연평균 계산 팝업 --- */}
          {showMonthlySowModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[80] flex items-end md:items-center justify-center">
              <div className="bg-white rounded-t-[2rem] md:rounded-[2rem] w-full max-w-sm p-6 shadow-2xl animate-[slideUp_0.2s_ease-out]">
                <div className="flex justify-between items-center mb-6">
                  <div className="flex flex-col">
                    <h3 className="text-lg font-black text-slate-800">월말 상시 모돈수 기록</h3>
                    <span className="text-xs font-bold text-blue-600">현재 달은 자동으로 동기화됩니다</span>
                  </div>
                  <button onClick={() => setShowMonthlySowModal(false)} className="p-2 bg-slate-100 rounded-full text-slate-500 hover:text-slate-800 transition-colors"><X className="w-5 h-5" /></button>
                </div>

                {/* 연도 선택기 */}
                <div className="flex justify-between items-center bg-slate-50 border border-slate-200 p-2 rounded-xl mb-4">
                  <button onClick={() => setSelectedYear(y => y - 1)} className="p-2 hover:bg-slate-200 rounded-lg transition-colors"><ArrowLeft className="w-4 h-4 text-slate-600"/></button>
                  <span className="font-black text-slate-800">{selectedYear}년</span>
                  <button onClick={() => setSelectedYear(y => y + 1)} className="p-2 hover:bg-slate-200 rounded-lg transition-colors"><ChevronRight className="w-4 h-4 text-slate-600"/></button>
                </div>

                {/* 월별 입력 그리드 */}
                <div className="grid grid-cols-3 gap-2 mb-4 max-h-[45vh] overflow-y-auto no-scrollbar pb-2">
                  {Array.from({length: 12}, (_, i) => {
                    const month = String(i + 1).padStart(2, '0');
                    const yearMonth = `${selectedYear}-${month}`;
                    const val = ((farmSettings || {}).monthlySowCounts || {})[yearMonth] || '';
                    
                    const today = new Date();
                    const isCurrentMonth = yearMonth === `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;

                    return (
                      <div key={yearMonth} className={`bg-white border p-2.5 rounded-xl flex flex-col items-center shadow-sm transition-all ${isCurrentMonth ? 'border-blue-400 bg-blue-50/30' : 'border-slate-200 focus-within:border-blue-400 focus-within:ring-1 focus-within:ring-blue-400'}`}>
                        <span className="text-[10px] font-bold text-slate-500 mb-1">
                          {i + 1}월말 {isCurrentMonth && <span className="text-blue-500 font-black tracking-tighter ml-0.5">(자동)</span>}
                        </span>
                        <input
                          type="number"
                          value={val}
                          onChange={(e) => handleSaveMonthlySowCount(yearMonth, e.target.value)}
                          disabled={isCurrentMonth}
                          className="w-full text-center bg-transparent font-black text-slate-800 text-sm outline-none disabled:text-blue-600"
                          placeholder="-"
                        />
                      </div>
                    );
                  })}
                </div>

                {/* 요약 및 적용 */}
                <div className="bg-blue-50 border border-blue-100 p-4 rounded-xl flex flex-col gap-3">
                  <div className="flex justify-between items-center">
                    <span className="text-xs font-bold text-blue-600">{selectedYear}년 입력 월 평균</span>
                    <span className="text-xl font-black text-blue-800">
                      {(() => {
                        const currentYearCounts = Object.keys((farmSettings || {}).monthlySowCounts || {})
                          .filter(k => k.startsWith(`${selectedYear}-`))
                          .map(k => ((farmSettings || {}).monthlySowCounts || {})[k]);
                        return currentYearCounts.length > 0
                          ? Math.round(currentYearCounts.reduce((a, b) => a + b, 0) / currentYearCounts.length)
                          : 0;
                      })()} 두
                    </span>
                  </div>
                  <button 
                    onClick={() => {
                      const currentYearCounts = Object.keys((farmSettings || {}).monthlySowCounts || {})
                        .filter(k => k.startsWith(`${selectedYear}-`))
                        .map(k => ((farmSettings || {}).monthlySowCounts || {})[k]);
                      const calculatedAvg = currentYearCounts.length > 0
                        ? Math.round(currentYearCounts.reduce((a, b) => a + b, 0) / currentYearCounts.length)
                        : 0;
                      
                      if(calculatedAvg > 0) {
                        handleSaveSetting('avgSowCount', calculatedAvg);
                        setShowMonthlySowModal(false);
                      } else {
                        showAlert("입력된 데이터가 없어 평균을 적용할 수 없습니다.");
                      }
                    }} 
                    className="w-full py-3 bg-blue-600 text-white rounded-xl font-black shadow-sm hover:bg-blue-700 active:scale-95 transition-all"
                  >
                    연평균 상시 모돈수로 적용
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* --- 삭제된 약제 투여 일정 복구 팝업 --- */}
          {showDeletedMedicationsModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[80] flex items-end md:items-center justify-center">
              <div className="bg-white rounded-t-[2rem] md:rounded-[2rem] w-full max-w-sm p-6 shadow-2xl animate-[slideUp_0.2s_ease-out]">
                <div className="flex justify-between items-center mb-6">
                  <div className="flex flex-col">
                    <h3 className="text-lg font-black text-slate-800">삭제된 약제 투여 일정</h3>
                    <span className="text-xs font-bold text-slate-500">복구 버튼을 누르면 다시 목록에 나타납니다.</span>
                  </div>
                  <button onClick={() => setShowDeletedMedicationsModal(false)} className="p-2 bg-slate-100 rounded-full text-slate-500 hover:text-slate-800 transition-colors"><X className="w-5 h-5" /></button>
                </div>
                
                <div className="flex flex-col gap-2 max-h-[60vh] overflow-y-auto no-scrollbar pb-4">
                  {(((upcomingMedications || {}).deleted) || []).length === 0 ? (
                     <div className="text-center py-5 text-xs font-bold text-slate-400 bg-slate-50 rounded-xl">삭제된 일정이 없습니다.</div>
                  ) : (
                    ((upcomingMedications || {}).deleted || []).map((medInfo) => (
                      <div key={medInfo.medWeekMonday} className="bg-slate-50 border border-slate-200 p-3 rounded-xl flex items-center justify-between shadow-sm">
                        <div className="flex flex-col">
                          <span className="text-[11px] font-black text-slate-700">시작: {medInfo.medStartDate.substring(5).replace('-', '/')}</span>
                          <span className="text-[10px] font-bold text-slate-500">종부 예정일: {medInfo.estMatingDate.substring(5).replace('-', '/')}</span>
                        </div>
                        <button 
                          onClick={() => handleRestoreMedicationSchedule(medInfo.medWeekMonday)}
                          className="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-[10px] font-black hover:bg-indigo-700 active:scale-95 transition-all shadow-sm"
                        >
                          복구
                        </button>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* 새 모돈 등록 플로팅 버튼 */}
          <button 
            onClick={() => { setShowSowListModal(false); setShowAddSow(true); }}
            className="fixed bottom-6 right-6 bg-slate-800 text-white w-14 h-14 rounded-full shadow-xl flex items-center justify-center hover:bg-slate-700 active:scale-95 transition-transform z-[60]"
          >
            <Plus className="w-6 h-6" />
          </button>

          {/* 새 모돈 등록 모달 */}
          {showAddSow && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[70] flex items-end md:items-center justify-center">
              <div className="bg-white rounded-t-[2rem] md:rounded-[2rem] w-full max-w-sm p-6 shadow-2xl animate-[slideUp_0.2s_ease-out]">
                <div className="flex justify-between items-center mb-6">
                  <h3 className="text-lg font-black text-slate-800">새 모돈 등록</h3>
                  <button onClick={() => setShowAddSow(false)} className="p-2 bg-slate-100 rounded-full text-slate-500"><X className="w-5 h-5" /></button>
                </div>
                <form onSubmit={handleAddSow} className="space-y-4">
                  <div>
                    <label className="text-[11px] font-bold text-slate-500 block mb-1">개체 관리 번호</label>
                    <input 
                      type="text" 
                      required 
                      value={(newSow || {}).sowNo || ''} 
                      onChange={e => setNewSow({...newSow, sowNo: e.target.value})} 
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-black outline-none focus:border-blue-400" 
                      placeholder="예: 23-11" 
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-[11px] font-bold text-slate-500 block mb-1">현재 산차</label>
                      <input 
                        type="number" 
                        value={(newSow || {}).parity || ''} 
                        onChange={e => setNewSow({...newSow, parity: e.target.value})} 
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-black outline-none focus:border-blue-400" 
                      />
                    </div>
                    <div>
                      <label className="text-[11px] font-bold text-slate-500 block mb-1">초기 상태</label>
                      <select 
                        value={(newSow || {}).currentStatus || '이유'} 
                        onChange={e => setNewSow({...newSow, currentStatus: e.target.value})} 
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-black outline-none focus:border-blue-400"
                      >
                        <option value="이유">이유</option>
                        <option value="임신">임신</option>
                        <option value="포유">포유</option>
                        <option value="재발">재발</option>
                      </select>
                    </div>
                  </div>
                  <button type="submit" className="w-full mt-4 py-4 bg-slate-800 text-white rounded-2xl font-black shadow-lg">등록하기</button>
                </form>
              </div>
            </div>
          )}
          
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
