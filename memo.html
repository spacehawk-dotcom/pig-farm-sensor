
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>성암농장 특이사항 일지</title>
    
    <!-- 스타일 라이브러리 및 폰트 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>

    <style>
        body { 
            font-family: 'Noto Sans KR', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            background-color: #f8fafc;
        }
        @keyframes slideUp { 
            from { transform: translateY(20px); opacity: 0; } 
            to { transform: translateY(0); opacity: 1; } 
        }
        @keyframes fadeIn { 
            from { opacity: 0; } 
            to { opacity: 1; } 
        }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
        
        /* 스크롤바 숨기기 (선택사항) */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* 텍스트 영역 리사이즈 제한 */
        textarea { resize: vertical; min-height: 120px; }
    </style>
</head>
<body class="text-slate-900">
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        const { useState, useEffect, useRef } = React;

        // --- 아이콘 컴포넌트 ---
        const Edit3 = ({c}) => <svg className={c} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>;
        const Trash2 = ({c}) => <svg className={c} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
        const Leaf = ({c}) => <svg className={c} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"></path><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path></svg>;

        // --- 토스트 알림 컴포넌트 ---
        const Toast = ({ message, isError, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [message, onClose]);

            if (!message) return null;

            return (
                <div className={`fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] px-5 py-3.5 rounded-xl shadow-xl flex items-center gap-2.5 animate-[slideUp_0.2s_ease-out] ${isError ? 'bg-rose-600 text-white' : 'bg-slate-900 text-white'}`}>
                    <span>{isError ? '⚠️' : '✔️'}</span>
                    <span className="text-xs font-bold whitespace-nowrap">{message}</span>
                </div>
            );
        };

        const App = () => {
            const [memos, setMemos] = useState([]);
            const [loading, setLoading] = useState(true);
            const [title, setTitle] = useState('');
            const [content, setContent] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [toast, setToast] = useState({ show: false, message: '', isError: false });
            
            // Firebase 관련 상태 (전역 변수 참조)
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'sungam-memo';
            const [db, setDb] = useState(null);
            const [currentUserId, setCurrentUserId] = useState(null);
            
            // 토스트 헬퍼 함수
            const showToast = (message, isError = false) => {
                setToast({ show: true, message, isError });
            };

            useEffect(() => {
                let unsubscribeAuth = null;
                let unsubscribeMemos = null;

                const initFirebase = async () => {
                    try {
                        // 1. Firebase 모듈 동적 로드
                        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
                        const { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                        const { getFirestore, collection, onSnapshot } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");

                        // 2. 설정 확인 및 앱 초기화
                        let firebaseConfig = {};
                        if (typeof __firebase_config !== 'undefined') {
                            firebaseConfig = JSON.parse(__firebase_config);
                        } else {
                            throw new Error("Firebase 설정이 없습니다.");
                        }

                        const app = initializeApp(firebaseConfig);
                        const firestoreDb = getFirestore(app);
                        const auth = getAuth(app);
                        setDb(firestoreDb);

                        // 3. 인증 처리 (Rule 3)
                        if (typeof __initial_auth_token !== 'undefined') {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }

                        // 4. 인증 상태 감지 및 데이터 로드 시작
                        unsubscribeAuth = onAuthStateChanged(auth, (user) => {
                            if (user) {
                                setCurrentUserId(user.uid);
                                
                                // Rule 1 & Rule 2: 올바른 경로, 복잡한 쿼리 없이 모든 데이터 가져오기
                                const memosRef = collection(firestoreDb, 'artifacts', appId, 'users', user.uid, 'farmMemos');
                                
                                unsubscribeMemos = onSnapshot(memosRef, (snapshot) => {
                                    const fetchedMemos = [];
                                    snapshot.forEach((doc) => {
                                        const data = doc.data();
                                        fetchedMemos.push({
                                            id: doc.id,
                                            ...data,
                                            // 타임스탬프 처리 (서버 시간이 아직 없으면 로컬 시간)
                                            time: data.createdAt ? data.createdAt.toDate().getTime() : Date.now()
                                        });
                                    });
                                    
                                    // 클라이언트 메모리에서 최신순 정렬
                                    fetchedMemos.sort((a, b) => b.time - a.time);
                                    setMemos(fetchedMemos);
                                    setLoading(false);
                                }, (error) => {
                                    console.error("데이터 수신 오류:", error);
                                    showToast("데이터를 불러오지 못했습니다.", true);
                                    setLoading(false);
                                });

                            } else {
                                setCurrentUserId(null);
                                setMemos([]);
                                setLoading(false);
                            }
                        });

                    } catch (error) {
                        console.error("Firebase 초기화 에러:", error);
                        showToast("시스템 연결에 실패했습니다.", true);
                        setLoading(false);
                    }
                };

                initFirebase();

                return () => {
                    if (unsubscribeAuth) unsubscribeAuth();
                    if (unsubscribeMemos) unsubscribeMemos();
                };
            }, [appId]); // 의존성 배열에 appId 포함

            const handleSubmit = async (e) => {
                e.preventDefault();
                
                if (!title.trim() || !content.trim()) {
                    showToast("제목과 내용을 모두 입력해주세요.", true);
                    return;
                }

                if (!db || !currentUserId) {
                    showToast("인증이 확인되지 않아 저장할 수 없습니다.", true);
                    return;
                }

                setIsSubmitting(true);

                try {
                    // 동적 임포트로 쓰기 함수 가져오기
                    const { collection, addDoc, serverTimestamp } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                    
                    const memosRef = collection(db, 'artifacts', appId, 'users', currentUserId, 'farmMemos');
                    
                    await addDoc(memosRef, {
                        title: title.trim(),
                        content: content.trim(),
                        createdAt: serverTimestamp()
                    });

                    // 폼 초기화
                    setTitle('');
                    setContent('');
                    showToast("성공적으로 저장되었습니다.");
                    
                } catch (error) {
                    console.error("저장 오류:", error);
                    showToast("저장 중 문제가 발생했습니다.", true);
                } finally {
                    setIsSubmitting(false);
                }
            };

            const handleDelete = async (id) => {
                if (!db || !currentUserId) return;
                
                try {
                    const { doc, deleteDoc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                    const docRef = doc(db, 'artifacts', appId, 'users', currentUserId, 'farmMemos', id);
                    
                    await deleteDoc(docRef);
                    showToast("기록이 삭제되었습니다.");
                } catch (error) {
                    console.error("삭제 오류:", error);
                    showToast("삭제 중 오류가 발생했습니다.", true);
                }
            };

            // 날짜 포맷 헬퍼
            const formatDate = (timestamp) => {
                const date = new Date(timestamp);
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                return `${year}.${month}.${day} ${hours}:${minutes}`;
            };

            return (
                <div className="min-h-screen pb-24">
                    {/* 토스트 알림 */}
                    {toast.show && (
                        <Toast 
                            message={toast.message} 
                            isError={toast.isError} 
                            onClose={() => setToast({ ...toast, show: false })} 
                        />
                    )}

                    {/* 헤더 */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm px-4 py-4">
                        <div className="max-w-2xl mx-auto flex justify-between items-center">
                            <h1 className="text-xl font-black text-slate-800 tracking-tight flex items-center">
                                <Leaf c="w-6 h-6 mr-2 text-emerald-600" />
                                성암농장 특이사항 일지
                            </h1>
                        </div>
                    </header>

                    <main className="max-w-2xl mx-auto p-4 animate-slide-up">
                        {/* 입력 폼 영역 */}
                        <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 mb-8">
                            <div className="flex items-center gap-2 mb-4">
                                <Edit3 c="w-5 h-5 text-indigo-600" />
                                <h2 className="text-sm font-black text-slate-800">새로운 기록 남기기</h2>
                            </div>
                            
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label htmlFor="title" className="sr-only">제목</label>
                                    <input 
                                        type="text" 
                                        id="title"
                                        value={title}
                                        onChange={(e) => setTitle(e.target.value)}
                                        placeholder="제목 (예: 1동 온도 조절, 후보돈 전입)" 
                                        disabled={isSubmitting || !currentUserId}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-bold text-slate-800 placeholder:text-slate-400 placeholder:font-medium outline-none focus:border-indigo-400 focus:bg-white transition-colors disabled:opacity-50"
                                        required
                                        autoComplete="off"
                                    />
                                </div>
                                <div>
                                    <label htmlFor="content" className="sr-only">내용</label>
                                    <textarea 
                                        id="content"
                                        value={content}
                                        onChange={(e) => setContent(e.target.value)}
                                        placeholder="상세 내용을 입력해주세요..." 
                                        disabled={isSubmitting || !currentUserId}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-700 placeholder:text-slate-400 outline-none focus:border-indigo-400 focus:bg-white transition-colors disabled:opacity-50 leading-relaxed"
                                        required
                                    ></textarea>
                                </div>
                                <button 
                                    type="submit" 
                                    disabled={isSubmitting || !currentUserId}
                                    className="w-full bg-slate-800 text-white font-black text-sm py-3.5 rounded-xl shadow-md hover:bg-slate-700 active:scale-[0.98] transition-all disabled:bg-slate-300 disabled:shadow-none disabled:cursor-not-allowed"
                                >
                                    {isSubmitting ? '저장 중...' : '기록 저장하기'}
                                </button>
                            </form>
                        </div>

                        {/* 리스트 영역 */}
                        <div>
                            <h2 className="text-sm font-black text-slate-800 mb-4 px-1 flex items-center justify-between">
                                최근 기록
                                <span className="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded-md border border-indigo-100">
                                    총 {memos.length}건
                                </span>
                            </h2>

                            {loading ? (
                                <div className="text-center py-12 bg-white rounded-2xl border border-slate-200 border-dashed">
                                    <div className="w-8 h-8 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mx-auto mb-3"></div>
                                    <p className="text-xs font-bold text-slate-400 animate-pulse">데이터를 불러오는 중입니다...</p>
                                </div>
                            ) : memos.length === 0 ? (
                                <div className="text-center py-16 bg-white rounded-2xl border border-slate-200 border-dashed">
                                    <Leaf c="w-10 h-10 text-slate-300 mx-auto mb-3" />
                                    <p className="text-sm font-black text-slate-500 mb-1">아직 작성된 기록이 없습니다.</p>
                                    <p className="text-xs text-slate-400">위의 양식을 작성하여 첫 기록을 남겨보세요.</p>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    {memos.map(memo => (
                                        <div key={memo.id} className="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 border-l-4 border-l-emerald-500 shadow-sm relative group transition-all hover:shadow-md animate-fade-in">
                                            
                                            {/* 삭제 버튼 (우측 상단) */}
                                            <button 
                                                onClick={() => handleDelete(memo.id)}
                                                className="absolute top-4 right-4 p-1.5 text-slate-300 hover:text-rose-500 hover:bg-rose-50 rounded-lg transition-colors"
                                                title="기록 삭제"
                                            >
                                                <Trash2 c="w-4 h-4" />
                                            </button>

                                            <h3 className="text-base font-black text-slate-800 pr-8 mb-2 leading-tight">
                                                {memo.title}
                                            </h3>
                                            <p className="text-sm text-slate-600 whitespace-pre-wrap leading-relaxed mb-4">
                                                {memo.content}
                                            </p>
                                            
                                            <div className="flex justify-between items-center border-t border-slate-100 pt-3">
                                                <span className="text-[11px] font-bold text-slate-400">
                                                    {formatDate(memo.time)}
                                                </span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
