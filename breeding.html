  <!-- 클라우드 저장소를 위한 Firebase 라이브러리 추가 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Firebase 초기화를 비동기 Promise로 관리하여 React가 안전하게 접근하도록 합니다.
    window.firebaseInitPromise = (async () => {
      try {
        const getAppId = () => typeof __app_id !== 'undefined' ? __app_id : 'farm-app';
        const getFirebaseConfig = () => typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        
        const config = getFirebaseConfig();
        if (!config || Object.keys(config).length === 0) return null; // 로컬 테스트 환경 대비

        const app = initializeApp(config);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        return { db, auth, doc, setDoc, onSnapshot, signInAnonymously, signInWithCustomToken, appId: getAppId() };
      } catch (error) {
        console.error("Firebase 초기화 실패:", error);
        return null;
      }
    })();
  </script>
