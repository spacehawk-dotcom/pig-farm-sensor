<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no">
    <meta name="google" content="notranslate">
    <title>성암농장 사육 현황 - 리포트 강화 버전</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase SDK (호환 버전) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- SheetJS for XLSX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif !important; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .modal-animate { animation: slideUp 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        input, select, textarea { font-size: 16px !important; outline: none; } 
        
        /* 돈방 그리드 설정 */
        .pen-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; flex: 1; }
        .pen-box { aspect-ratio: 1; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; color: white; transition: all 0.2s; border: 1px solid rgba(0,0,0,0.05); position: relative; overflow: hidden; }
        .pen-empty { background-color: #f1f5f9; color: #cbd5e1; border: 1px dashed #cbd5e1; } 
        .pen-wean { background-color: #10b981; box-shadow: inset 0 -2px 0 rgba(0,0,0,0.1); }  
        .pen-grow { background-color: #6366f1; box-shadow: inset 0 -2px 0 rgba(0,0,0,0.1); }  
        .pen-residual { background-color: #f59e0b; box-shadow: inset 0 -2px 0 rgba(0,0,0,0.1); }
        
        /* 배치 입구(문) 스타일 */
        .batch-gate-container { display: flex; align-items: stretch; margin-top: 10px; }
        .batch-gate-bar { width: 5px; border-radius: 3px; margin-right: 8px; opacity: 0.6; }
        .gate-wean { background-color: #10b981; }
        .gate-grow { background-color: #6366f1; }
        .gate-residual { background-color: #f59e0b; }
        .gate-empty { background-color: #cbd5e1; }

        input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="date"] { color: inherit; font-family: inherit; border: 1px solid #e2e8f0; border-radius: 8px; padding: 4px 8px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen pb-24">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-5 py-4 shadow-sm">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-xl font-black text-slate-800 tracking-tight">성암농장 사육 현황</h1>
                    <button onclick="window.openModal('shipment_history')" class="p-1.5 bg-green-50 text-green-600 rounded-lg hover:bg-green-100 transition-colors active:scale-95">
                        <i data-lucide="file-spreadsheet" class="w-5 h-5"></i>
                    </button>
                </div>
                <p id="current-date" class="text-xs text-slate-500 font-semibold mt-0.5"></p>
            </div>
            <div class="bg-slate-800 px-4 py-2 rounded-xl shadow-md flex items-center">
                <span id="total-pigs-label" class="text-white text-[11px] font-bold tracking-wide whitespace-nowrap">로딩 중...</span>
            </div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 space-y-6">
        
        <!-- 외부 링크 네비게이션 버튼 -->
        <section class="flex gap-2">
            <a class='flex-1 bg-white border border-slate-200 text-slate-700 font-black py-3.5 rounded-2xl shadow-sm flex justify-center items-center gap-2 hover:bg-slate-50 active:scale-95 transition-all text-sm' href='/env'>
                <i data-lucide="thermometer" class="w-5 h-5 text-rose-500"></i> 환경모니터링
            </a>
            <a class='flex-1 bg-white border border-slate-200 text-slate-700 font-black py-3.5 rounded-2xl shadow-sm flex justify-center items-center gap-2 hover:bg-slate-50 active:scale-95 transition-all text-sm' href='/pigmom'>
                <i data-lucide="clipboard-list" class="w-5 h-5 text-indigo-500"></i> 모돈관리
            </a>
        </section>

        <!-- 상단 현황 그리드 영역 -->
        <section id="status-grid" class="grid grid-cols-5 gap-1.5"></section>

        <!-- 번식돈 관리 그리드 -->
        <section class="grid grid-cols-3 gap-2">
            <div onclick="window.openModal('sow_list', '재발')" class="bg-white p-3 rounded-2xl border border-red-200 shadow-sm cursor-pointer active:scale-95 transition-all flex flex-col items-center justify-center gap-1 relative overflow-hidden h-24">
                <span class="text-sm font-black text-red-600">재발</span>
                <p class="text-2xl font-black text-slate-800"><span id="return-sow-count">0</span><span class="text-xs font-bold text-slate-400 ml-0.5">두</span></p>
            </div>
            <div onclick="window.openModal('sow_list', '이유')" class="bg-white p-3 rounded-2xl border border-amber-200 shadow-sm cursor-pointer active:scale-95 transition-all flex flex-col items-center justify-center gap-1 relative overflow-hidden h-24">
                <span class="text-sm font-black text-amber-600">이유</span>
                <p class="text-2xl font-black text-slate-800"><span id="awaiting-sow-count">0</span><span class="text-xs font-bold text-slate-400 ml-0.5">두</span></p>
            </div>
            <div onclick="window.openModal('sow_list', '포유')" class="bg-white p-3 rounded-2xl border border-emerald-200 shadow-sm cursor-pointer active:scale-95 transition-all flex flex-col items-center justify-center gap-1 relative overflow-hidden h-24">
                <span class="text-sm font-black text-emerald-600">포유</span>
                <p class="text-2xl font-black text-slate-800"><span id="nursing-sow-count">0</span><span class="text-xs font-bold text-slate-400 ml-0.5">두</span></p>
            </div>
        </section>

        <!-- 예정 분만 -->
        <section>
            <div class="flex justify-between items-end mb-3 px-1">
                <h2 class="text-base font-black text-slate-800 flex items-center gap-2 w-full"><i data-lucide="calendar-heart" class="text-rose-500 w-5 h-5"></i> 주간 예상 분만 복수 <span class="text-[10px] text-rose-600 font-bold ml-1 bg-rose-50 px-1.5 py-0.5 rounded border border-rose-100 hidden sm:inline">터치 시 번호 확인</span>
                    <button onclick="window.exportExpectedFarrowingToExcel()" class="ml-auto text-[11px] font-black bg-rose-50 text-rose-700 px-2 py-1 rounded-lg border border-rose-100 flex items-center gap-1 active:scale-95 transition-all"><i data-lucide="download" class="w-3.5 h-3.5"></i> 엑셀</button>
                </h2>

            <div id="expected-farrowing-list" class="flex overflow-x-auto gap-3 pb-2 no-scrollbar"></div>
        </section>

        <!-- 20일령(이유) 도래 복수 -->
        <section>
            <div class="flex justify-between items-end mb-3 px-1">
                <h2 class="text-base font-black text-slate-800 flex items-center gap-2"><i data-lucide="baby" class="text-emerald-500 w-5 h-5"></i> 20일령(이유) 도래 복수 <span class="text-[10px] text-emerald-600 font-bold ml-1 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-100">분만일+20일 기준 주차</span></h2>

                    <div class="ml-auto flex gap-1">
                        <button onclick="window.openModal('shipment_log_export')" class="text-[11px] font-black bg-blue-50 text-blue-700 px-2 py-1 rounded-lg border border-blue-100 flex items-center gap-1 active:scale-95 transition-all"><i data-lucide="download" class="w-3.5 h-3.5"></i> 출하기록</button>
                        <button onclick="window.openModal('expected_shipment_monthly')" class="text-[11px] font-black bg-purple-50 text-purple-700 px-2 py-1 rounded-lg border border-purple-100 flex items-center gap-1 active:scale-95 transition-all"><i data-lucide="trending-up" class="w-3.5 h-3.5"></i> 출하예측</button>
                    </div>
                </h2>
            </div>
            <div id="recent-shipment-list" class="flex overflow-x-auto gap-3 pb-2 no-scrollbar"></div>
        </section>

        <!-- 이유사 -->
        <section>
            <div class="flex justify-between items-end mb-3 px-1" id="weaning-header">
                <h2 class="text-base font-black text-slate-800 flex items-center gap-2"><div class="w-3 h-3 bg-emerald-500 rounded-sm"></div> 이유사 <span class="text-[10px] text-emerald-600 font-bold ml-1 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-100">칸 터치 시 기록/이동</span></h2>
            </div>
            <div id="weaning-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
        </section>

        <!-- 육성사 -->
        <section>
            <div class="flex justify-between items-end mb-3 px-1" id="grower-header">
                <h2 class="text-base font-black text-slate-800 flex items-center gap-2"><div class="w-3 h-3 bg-indigo-500 rounded-sm"></div> 육성사 및 후보사 <span class="text-[10px] text-indigo-600 font-bold ml-1 bg-indigo-50 px-1.5 py-0.5 rounded border border-indigo-100">칸 터치 시 기록/이동</span></h2>
            </div>
            <div id="grower-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
        </section>

        <!-- 날짜별 변경사항 및 일령별 두수 확인 -->
        <section class="pt-4 border-t border-slate-200 mt-8 grid grid-cols-2 gap-3">
            <button onclick="window.openModal('daily_history')" class="w-full bg-white border border-slate-200 text-slate-600 font-bold py-4 rounded-2xl shadow-sm flex flex-col justify-center items-center gap-2 hover:bg-slate-50 active:scale-95 transition-all text-[13px]">
                <i data-lucide="history" class="w-6 h-6 text-slate-400"></i> 재고 변경 내역
            </button>
            <button onclick="window.openModal('age_distribution')" class="w-full bg-white border border-slate-200 text-slate-600 font-bold py-4 rounded-2xl shadow-sm flex flex-col justify-center items-center gap-2 hover:bg-slate-50 active:scale-95 transition-all text-[13px]">
                <i data-lucide="bar-chart-2" class="w-6 h-6 text-blue-400"></i> 일령별 두수 분포
            </button>
        </section>
    </main>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center">
        <div class="bg-white w-full max-w-lg rounded-t-[2rem] sm:rounded-[2rem] p-6 shadow-2xl modal-animate flex flex-col max-h-[90vh]">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6 sm:hidden shrink-0"></div>
            <div class="flex justify-between items-center mb-6 shrink-0">
                <h3 id="modal-title" class="text-xl font-black text-slate-800 flex items-center gap-2 w-full"></h3>
                <button onclick="window.closeModal()" class="p-2 bg-slate-100 rounded-full text-slate-500 shrink-0"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div id="modal-content" class="space-y-4 overflow-y-auto no-scrollbar pb-4 flex-1 relative"></div>
            <div class="flex gap-3 mt-4 shrink-0 pt-4 border-t border-slate-100">
                <button id="cancel-btn" onclick="window.closeModal()" class="flex-1 py-4 bg-slate-100 text-slate-500 rounded-2xl font-bold">취소</button>
                <button id="save-btn" class="flex-[2] py-4 bg-slate-800 text-white rounded-2xl font-bold shadow-lg flex justify-center items-center gap-2">
                    <i data-lucide="check" class="w-5 h-5"></i> 확인 및 저장
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 px-6 py-3 bg-slate-800/95 backdrop-blur text-white text-sm font-bold rounded-full shadow-2xl opacity-0 transition-all z-[100] flex items-center gap-2 min-w-max pointer-events-none">
        <i data-lucide="info" class="w-4 h-4 text-emerald-400"></i> <span id="toast-msg">처리 완료</span>
    </div>

    <script>
        const apiKey = ""; 
        const firebaseConfig = {
            apiKey: "AIzaSyBlptGu2gTAQKVy_yDomKkNEd_el6c1PL0",
            authDomain: "sungamfarm.firebaseapp.com",
            projectId: "sungamfarm",
            storageBucket: "sungamfarm.firebasestorage.app",
            messagingSenderId: "811107235779",
            appId: "1:811107235779:web:ea65a74d09c37ba2136f76"
        };

        const WEANING_HEADER_DEFAULT = `<h2 class="text-base font-black text-slate-800 flex items-center gap-2"><div class="w-3 h-3 bg-emerald-500 rounded-sm"></div> 이유사 <span class="text-[10px] text-emerald-600 font-bold ml-1 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-100">칸 터치 시 기록/이동</span></h2>`;
        const GROWER_HEADER_DEFAULT = `<h2 class="text-base font-black text-slate-800 flex items-center gap-2"><div class="w-3 h-3 bg-indigo-500 rounded-sm"></div> 육성사 및 후보사 <span class="text-[10px] text-indigo-600 font-bold ml-1 bg-indigo-50 px-1.5 py-0.5 rounded border border-indigo-100">칸 터치 시 기록/이동</span></h2>`;

        let app, auth, db, isLocalEnv = false;
        let appId = 'sungamfarm'; 
        
        const COLS = {
            STOCKS: `farms/${appId}/stocks`,
            WEANING: `farms/${appId}/weaning`,
            GROWER: `farms/${appId}/grower`,
            SOWS: `farms/${appId}/sows`,
            HISTORY: `farms/${appId}/history`,
            SHIPMENTS: `farms/${appId}/shipments`,
            SHIPMENT_SUMMARIES: `farms/${appId}/shipment_summaries`,
            ACCIDENTS: `farms/${appId}/accidents`
        };

        const KOR_STATUS_MAP = {
            '이유': '이유', 'reason': '이유', 'wean': '이유', 'weaning': '이유',
            '재발': '재발', 'relapse': '재발', 'recurrence': '재발', 'return': '재발',
            '대기': '대기', 'waiting': '대기', 'standby': '대기', 'atmosphere': '대기', 'awaiting': '대기',
            '포유': '포유', 'mammal': '포유', 'suckling': '포유', 'lactation': '포유', 'nursing': '포유',
            '임신': '임신', 'pregnancy': '임신', 'pregnant': '임신'
        };

        try {
            app = firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            db = firebase.firestore();
            
            db.enablePersistence({ synchronizeTabs: true })
                .then(() => {
                    console.log("Firestore 오프라인 지속성 활성화 성공");
                })
                .catch((err) => {
                    if (err.code == 'failed-precondition') {
                        console.warn("오프라인 지속성 활성화 실패: 여러 브라우저 탭이 이미 열려 있습니다.");
                    } else if (err.code == 'unimplemented') {
                        console.warn("오프라인 지속성 활성화 실패: 현재 브라우저 환경에서 오프라인 스토리지를 지원하지 않습니다.");
                    } else {
                        console.error("오프라인 지속성 에러:", err);
                    }
                });
        } catch(e) { console.error("Firebase Error:", e); isLocalEnv = true; }

        let state = {
            stocks: { boar: 5, piglet: 0, grower: 0, sow: 0, replacement: 0 },
            wBatches: Array.from({length: 5}, (_, i) => getEmptyBatch(i+1)),
            gBatches: Array.from({length: 8}, (_, i) => getEmptyBatch(i+1, true)),
            sowList: [], shipments: [], shipmentSummaries: {}, accidents: [], historyList: [],
            transfer: { active: false, src: null },
            sowCache: {
                returnCount: 0,
                awaitingCount: 0,
                nursingCount: 0,
                nursingSows: 0,
                sowCount: 0,
                sowPregnantCount: 0,
                sowWeaningCount: 0,
                replacementCount: 0,
                expectedFarrowingMap: {},
                weeklyNursingMap: {}
            }
        };

        function getEmptyBatch(id, isGrower = false) {
            let pensCount = (isGrower && id === 8) ? 7 : 10;
            let b = { 
                id, status: 'empty', date: '', pens: 0, pigs: 0, memo: '', 
                penDetails: Array(pensCount).fill(0), 
                penDates: Array(pensCount).fill(''),
                penIsResidual: Array(pensCount).fill(false),
                penIsSick: Array(pensCount).fill(false)
            };
            if (isGrower) { b.sourceId = null; b.weaningDate = ''; b.pendingShipments = []; }
            return b;
        }

        const utils = {
            getTodayStr: () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().split('T')[0]; },
            getTomorrowStr: () => { const d = new Date(); d.setDate(d.getDate() + 1); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().split('T')[0]; },
            getDiffDays: (d1, d2) => { if(!d1||!d2) return 0; const t1=new Date(d1).getTime(), t2=new Date(d2).getTime(); if(isNaN(t1)||isNaN(t2)) return 0; return Math.floor((t2-t1)/(1000*60*60*24)); },
            parseDate: (ds) => {
                if (!ds) return null;
                let str = String(ds).trim();
                
                const nums = str.match(/\d+/g);
                if (!nums) return null;

                let y, m, d_val;
                if (nums.length >= 3) {
                    y = parseInt(nums[0], 10);
                    if (y < 100) y += 2000; 
                    m = parseInt(nums[1], 10) - 1; 
                    d_val = parseInt(nums[2], 10);
                } else if (nums.length === 2) {
                    y = new Date().getFullYear();
                    m = parseInt(nums[0], 10) - 1;
                    d_val = parseInt(nums[1], 10);
                } else {
                    let fallback = new Date(str);
                    return isNaN(fallback.getTime()) ? null : fallback;
                }
                let dateObj = new Date(y, m, d_val);
                return isNaN(dateObj.getTime()) ? null : dateObj;
            },
            getExpectedFarrow: (m) => { 
                const d = utils.parseDate(m);
                if (!d) return null;
                d.setDate(d.getDate()+114); // 한돈 표준 임신기간 114일 적용 (종부일 + 114일)
                const yy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                return `${yy}-${mm}-${dd}`;
            },
            getWeekKey: (ds) => { 
                const d = utils.parseDate(ds);
                if (!d) return null;
                const day = d.getDay(); 
                const diff = d.getDate() - day + (day === 0 ? -6 : 1);
                d.setDate(diff);
                const yy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                return `${yy}-${mm}-${dd}`;
            },
            getWeekOfMonth: (ds) => {
                if(!ds) return '';
                if(ds === 'Unknown') return '날짜 미상';
                const parts = ds.split('-');
                if(parts.length !== 3) return ds;
                const m = parseInt(parts[1], 10);
                const d = parseInt(parts[2], 10);
                if (isNaN(m) || isNaN(d)) return '오류(날짜확인)'; 
                
                const firstDayOfMonth = new Date(parts[0], m - 1, 1);
                let firstDayOfWeek = firstDayOfMonth.getDay();
                if (firstDayOfWeek === 0) firstDayOfWeek = 7; 
                const weekNumber = Math.ceil((d + firstDayOfWeek - 1) / 7);
                return `${m}월 ${weekNumber}주차 <span class="text-[10px] font-bold text-slate-400 tracking-tighter">(${m}/${d}~)</span>`;
            },
            normalizeBatch: (b, collectionName) => { 
                let pensCount = (collectionName.includes('grower') && b.id === 8) ? 7 : 10;
                if(!b.penDetails || b.penDetails.length !== pensCount) {
                    let oldDetails = b.penDetails || [];
                    b.penDetails = Array(pensCount).fill(0).map((v, i) => oldDetails[i] || 0);
                    b.penDates = Array(pensCount).fill('').map((v, i) => (b.penDates && b.penDates[i]) || '');
                    b.penIsResidual = Array(pensCount).fill(false).map((v, i) => (b.penIsResidual && b.penIsResidual[i]) || false);
                    b.penIsSick = Array(pensCount).fill(false).map((v, i) => (b.penIsSick && b.penIsSick[i]) || false);
                }
                if(!b.penIsResidual) b.penIsResidual = Array(pensCount).fill(false);
                if(!b.penIsSick) b.penIsSick = Array(pensCount).fill(false);
                if(b.pendingShipments===undefined) b.pendingShipments=[]; 
                if(b.weaningDate===undefined) b.weaningDate=''; 
                return b; 
            },
            showToast: (msg, dur=3000) => { const t=document.getElementById('toast'), tm=document.getElementById('toast-msg'); if(t&&tm){ tm.innerText=msg; t.classList.remove('opacity-0','pointer-events-none'); t.classList.add('opacity-100'); setTimeout(()=>{ t.classList.remove('opacity-100'); t.classList.add('opacity-0','pointer-events-none'); }, dur); } }

        window.updateSowCache = () => {
            const cache = {
                returnCount: 0,
                awaitingCount: 0,
                nursingCount: 0,
                nursingSows: 0,
                sowCount: 0,
                sowPregnantCount: 0,
                sowWeaningCount: 0,
                replacementCount: 0,
                expectedFarrowingMap: {},
                weeklyNursingMap: {}
            };

            const isSow = s => s.parity >= 1 || (s.parity === 0 && s.currentStatus === '임신');

            state.sowList.forEach(s => {
                const status = s.currentStatus || '이유';
                const matingDate = s.matingDate;
                const parity = Number(s.parity) || 0;

                if (status === '재발') {
                    cache.returnCount++;
                }
                if ((status === '이유' || !s.currentStatus) && !matingDate) {
                    cache.awaitingCount++;
                }
                if (status === '포유') {
                    cache.nursingCount++;
                    cache.nursingSows++;
                }

                const sowCheck = isSow(s);
                if (sowCheck) {
                    cache.sowCount++;
                    if (status === '임신') {
                        cache.sowPregnantCount++;
                    }
                    if (status === '이유' || !s.currentStatus) {
                        cache.sowWeaningCount++;
                    }
                } else if (parity === 0 && status !== '임신') {
                    cache.replacementCount++;
                }

                if (matingDate && !s.farrowingDate && status !== '재발' && status !== '포유') {
                    const expectedFarrowingDate = utils.getExpectedFarrow(matingDate);
                    if (expectedFarrowingDate) {
                        const wk = utils.getWeekKey(expectedFarrowingDate);
                        if (wk) {
                            if (!cache.expectedFarrowingMap[wk]) cache.expectedFarrowingMap[wk] = [];
                            cache.expectedFarrowingMap[wk].push(s);
                        }
                    }
                }

                if (status === '포유') {
                    let farrowDate = '';
                    if (s.history && s.history.length > 0) {
                        const sortedHistory = [...s.history].sort((a,b) => b.parity - a.parity);
                        farrowDate = sortedHistory[0].date;
                    }
                    if (farrowDate) {
                        const parsedDate = utils.parseDate(farrowDate);
                        if (parsedDate) {
                            parsedDate.setDate(parsedDate.getDate() + 20); 
                            const dateStr = `${parsedDate.getFullYear()}-${String(parsedDate.getMonth() + 1).padStart(2, '0')}-${String(parsedDate.getDate()).padStart(2, '0')}`;
                            const wk = utils.getWeekKey(dateStr);
                            if (wk) {
                                if (!cache.weeklyNursingMap[wk]) cache.weeklyNursingMap[wk] = [];
                                cache.weeklyNursingMap[wk].push(s);
                            } else {
                                if (!cache.weeklyNursingMap['Unknown']) cache.weeklyNursingMap['Unknown'] = [];
                                cache.weeklyNursingMap['Unknown'].push(s);
                            }
                        } else {
                            if (!cache.weeklyNursingMap['Unknown']) cache.weeklyNursingMap['Unknown'] = [];
                            cache.weeklyNursingMap['Unknown'].push(s);
                        }
                    } else {
                        if (!cache.weeklyNursingMap['Unknown']) cache.weeklyNursingMap['Unknown'] = [];
                        cache.weeklyNursingMap['Unknown'].push(s);
                    }
                }
            });

            state.sowCache = cache;
        };

            db.doc(`${COLS.STOCKS}/current`).onSnapshot(s => { if(s.exists) { state.stocks = s.data(); renderStocks(); } }, errLog);
            db.collection(COLS.WEANING).onSnapshot(s => { state.wBatches = s.docs.map(d => utils.normalizeBatch(d.data(), 'weaning')).sort((a,b)=>String(a.id||'').localeCompare(String(b.id||''))); renderWeaning(); renderStocks(); }, errLog);
            db.collection(COLS.GROWER).onSnapshot(s => { state.gBatches = s.docs.map(d => ({ ...utils.normalizeBatch(d.data(), 'grower') })).sort((a,b)=>String(a.id||'').localeCompare(String(b.id||''))); checkScheduledShipments(); renderGrower(); renderRecentShipments(); renderStocks(); }, errLog);
            db.collection(COLS.SOWS).onSnapshot(s => { 
                state.sowList = s.docs.map(d => {
                    const data = d.data();
                    let st = data.currentStatus || '이유';
                    data.currentStatus = KOR_STATUS_MAP[String(st).toLowerCase().trim()] || st;
                    data.parity = Number(data.parity) || 0;
                    return { dbId: d.id, ...data };

                renderExpectedFarrowing(); 
                renderWeeklyNursing();

                renderStocks(); 
            }, errLog);
            db.collection(COLS.SHIPMENTS).onSnapshot(s => { state.shipments = s.docs.map(d => ({ dbId: d.id, ...d.data() })).sort((a,b) => String(b.date||'').localeCompare(String(a.date||''))); renderRecentShipments(); }, errLog);
            db.collection(COLS.SHIPMENT_SUMMARIES).onSnapshot(s => { 
                const summaries = {}; 
                s.docs.forEach(d => summaries[d.id] = d.data()); 
                state.shipmentSummaries = summaries; 
            }, errLog);
            db.collection(COLS.ACCIDENTS).onSnapshot(s => { state.accidents = s.docs.map(d => ({ dbId: d.id, ...d.data() })).sort((a,b) => String(b.date||'').localeCompare(String(a.date||''))); }, errLog);

        async function checkScheduledShipments() {
            if (isLocalEnv) return;
            const todayStr = utils.getTodayStr();
            const promises = state.gBatches.map(async b => {
                if (b.pendingShipments && b.pendingShipments.length > 0) {
                    let needsUpdate = false, newPending = [], newDetails = [...b.penDetails], newDates = [...b.penDates];
                    b.pendingShipments.forEach(ps => {
                        if (ps.date <= todayStr) {
                            ps.items.forEach(i => { 
                                const penDate = (b.penDates && b.penDates[i.pIdx]) || b.weaningDate || b.date;
                                if(newDetails[i.pIdx]>=i.count) newDetails[i.pIdx]-=i.count; else newDetails[i.pIdx]=0; 
                                if(newDetails[i.pIdx]===0) newDates[i.pIdx]=''; 
                                db.collection(COLS.SHIPMENTS).add({ 
                                    date: ps.date, batchId: b.id, penIndex: i.pIdx, count: i.count, stockingDate: penDate || '', timestamp: new Date().toISOString() 
                                });
                            });
                            needsUpdate = true;
                        } else newPending.push(ps);
                    });
                    if (needsUpdate) {
                        const nP = newDetails.reduce((a,c)=>a+c,0), nPens = newDetails.filter(v=>v>0).length;

        window.completeSingleSowFarrowing = async (dbId, weekKey) => {
            const totalInput = document.getElementById(`e-total-${dbId}`);
            const total = totalInput && totalInput.value !== '' ? parseInt(totalInput.value) || 0 : 0;
            const born = total; // 포유두수는 산자수와 동일하게 자동 연동

            const sowIdx = state.sowList.findIndex(x => x.dbId === dbId);
            if (sowIdx === -1) return;
            const sow = state.sowList[sowIdx];

            const today = new Date();
            const todayMMDD = `${String(today.getMonth() + 1).padStart(2, '0')}/${String(today.getDate()).padStart(2, '0')}`;

            let history = [...(sow.history || [])];
            history.sort((a, b) => b.parity - a.parity);

            if (history.length === 0 || history[0].date) {
                const matingMMDD = sow.matingDate ? `${String(new Date(sow.matingDate).getMonth() + 1).padStart(2, '0')}/${String(new Date(sow.matingDate).getDate()).padStart(2, '0')}` : '';
                const expDate = sow.matingDate ? utils.getExpectedFarrow(sow.matingDate) : '';
                const expMMDD = expDate ? `${String(new Date(expDate).getMonth() + 1).padStart(2, '0')}/${String(new Date(expDate).getDate()).padStart(2, '0')}` : '';
                
                history.push({
                    parity: sow.parity,
                    matingDate: matingMMDD,
                    expDate: expMMDD,
                    date: todayMMDD,
                    weaningDate: '', 
                    total: total,
                    born: born,
                    weaned: '',
                    move: ''
                });
            } else {
                history[0].date = todayMMDD;
                history[0].total = total;
                history[0].born = born;
            }

            const dataToUpdate = {
                currentStatus: '포유',
                history: history
            };

            try {
                if (isLocalEnv) {
                    state.sowList[sowIdx] = {
                        ...sow,
                        ...dataToUpdate
                    };
                    utils.showToast(`${sow.sowNo}번 모돈 분만 완료(포유 전환)되었습니다.`);
                    
                    const remaining = state.sowList.filter(s => {
                        if (!s.matingDate || s.farrowingDate || s.currentStatus === '재발' || s.currentStatus === '포유') return false;
                        const expectedFarrowingDate = utils.getExpectedFarrow(s.matingDate);
                        return utils.getWeekKey(expectedFarrowingDate) === weekKey;
                    });
                    if (remaining.length > 0) {
                        window.openModal('expected_week', weekKey);
                    } else {
                        window.closeModal();
                    }
                    renderAll();
                } else {
                    await db.collection(COLS.SOWS).doc(dbId).update(dataToUpdate);
                    utils.showToast(`${sow.sowNo}번 모돈 분만 완료(포유 전환)되었습니다.`);
                    await saveDailyHistory();
                    
                    setTimeout(() => {
                        const remaining = state.sowList.filter(s => {
                            if (!s.matingDate || s.farrowingDate || s.currentStatus === '재발' || s.currentStatus === '포유') return false;
                            const expectedFarrowingDate = utils.getExpectedFarrow(s.matingDate);
                            return utils.getWeekKey(expectedFarrowingDate) === weekKey;
                        });
                        if (remaining.length > 0) {
                            window.openModal('expected_week', weekKey);
                        } else {
                            window.closeModal();
                        }
                    }, 500);
                }
            } catch (e) {
                console.error("Farrowing error:", e);
                utils.showToast("처리에 실패했습니다: " + e.message);
            }
        };

        window.completeSelectedSowsCycle = async () => {
            const checkedCheckboxes = document.querySelectorAll('.n-select-sow:checked');
            if (checkedCheckboxes.length === 0) {
                utils.showToast("선택된 모돈이 없습니다.");
                return;
            }

            const btn = document.querySelector('[onclick="window.completeSelectedSowsCycle()"]');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="w-4 h-4 animate-spin mr-1" data-lucide="loader-2"></i> 처리 중...';
            lucide.createIcons();

            try {
                const promises = [];
                const today = new Date();
                const todayMMDD = `${String(today.getMonth() + 1).padStart(2, '0')}/${String(today.getDate()).padStart(2, '0')}`;
                
                checkedCheckboxes.forEach(cb => {
                    const dbId = cb.dataset.dbid;
                    const row = document.querySelector(`.nursing-row[data-dbid="${dbId}"]`);
                    if (!row) return;

                    const sowIdx = state.sowList.findIndex(x => x.dbId === dbId);
                    if (sowIdx === -1) return;
                    const sow = state.sowList[sowIdx];

                    const currentParity = parseInt(row.querySelector('.n-parity').value) || sow.parity;
                    const mRaw = row.querySelector('.n-mating').value;
                    const eRaw = row.querySelector('.n-exp').value;
                    const fRaw = row.querySelector('.n-farrow').value;
                    const totalInput = row.querySelector('.n-total').value;
                    const total = totalInput === '' ? '' : parseInt(totalInput) || 0;
                    const bornInput = row.querySelector('.n-born').value;
                    const born = bornInput === '' ? '' : parseInt(bornInput) || 0;
                    const weaned = row.querySelector('.n-weaned').value;
                    const move = row.querySelector('.n-move').value;

                    let history = [...(sow.history || [])];
                    history.sort((a, b) => b.parity - a.parity);

                    if (history.length === 0) {
                        history.push({
                            parity: currentParity,
                            matingDate: mRaw,
                            expDate: eRaw,
                            date: fRaw,
                            weaningDate: todayMMDD, 
                            total: total,
                            born: born,
                            weaned: weaned,
                            move: move
                        });
                    } else {
                        history[0].parity = currentParity;
                        history[0].matingDate = mRaw;
                        history[0].expDate = eRaw;
                        history[0].date = fRaw;
                        history[0].weaningDate = todayMMDD; 
                        history[0].total = total;
                        history[0].born = born;
                        history[0].weaned = weaned;
                        history[0].move = move;
                    }

                    const nextParity = currentParity + 1; 
                    const nextMatingDate = ''; 
                    const nextStatus = '이유'; 

                    const dataToUpdate = {
                        parity: nextParity,
                        matingDate: nextMatingDate,
                        currentStatus: nextStatus,
                        history: history
                    };

                    if (isLocalEnv) {
                        state.sowList[sowIdx] = {
                            ...sow,
                            ...dataToUpdate
                        };
                    } else {
                        promises.push(db.collection(COLS.SOWS).doc(dbId).update(dataToUpdate));
                    }
                });

                if (!isLocalEnv) {
                    await Promise.all(promises);
                }
                
                utils.showToast(`${checkedCheckboxes.length}두의 분만/이유 완료 처리가 성공적으로 완료되었습니다! 산차가 1씩 증가하고 이유 목록으로 이동했습니다.`);
                window.closeModal();
                
                if (isLocalEnv) {
                    renderAll();
                } else {
                    await saveDailyHistory();
                }
            } catch (e) {
                console.error("Complete cycle error:", e);
                utils.showToast("처리에 실패했습니다: " + e.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
                lucide.createIcons();
            }
        };

            const rowFarrow = document.getElementById(`row-farrow-${dbId}`).value.trim();

                born: '',
                weaned: '',
                move: ''
            });

            const statusMsg = `${sow.sowNo}번 모돈 종부 등록 완료! '임신' 상태로 전환되었습니다.`;

                        dateGroups[r.date].validRecordsCount += (r.count || 0);

            const resultsEl = document.getElementById('expected-shipment-results');
            const annualSummaryEl = document.getElementById('expected-shipment-annual-summary');
            if (!inputEl || !resultsEl) return;

            const targetAge = parseInt(inputEl.value) || 170;
            const daysToAdd = targetAge - 20;

            if (descEl) descEl.innerText = `* 각 칸의 이유일로부터 ${targetAge}일령이 되는 달을 기준으로 합산합니다.`;

            const monthlyCounts = {};
            const yearlyCounts = {};
            const batches = [...state.wBatches, ...state.gBatches];
            
            batches.forEach(b => {
                if (b.status === 'empty' || b.pigs === 0) return;
                for (let i = 0; i < b.penDetails.length; i++) {
                    const count = b.penDetails[i];
                    if (count > 0) {
                        const penDate = (b.penDates && b.penDates[i]) || b.weaningDate || b.date;
                        if (penDate) {
                            const d = utils.parseDate(penDate);
                            if (d) {
                                d.setDate(d.getDate() + daysToAdd);
                                const yyyy = d.getFullYear();
                                const yearMonth = `${yyyy}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                                
                                if (!monthlyCounts[yearMonth]) monthlyCounts[yearMonth] = 0;
                                monthlyCounts[yearMonth] += count;
                                
                                if (!yearlyCounts[yyyy]) yearlyCounts[yyyy] = 0;
                                yearlyCounts[yyyy] += count;
                            }
                        }
                    }
                }
            });

            if (annualSummaryEl) {
                const sortedYears = Object.keys(yearlyCounts).sort();

            const currentYearMonth = utils.getTodayStr().substring(0, 7);

                const currentPenDate = document.getElementById('m-pen-date').value;
                
                const b = (stg === 'weaning' ? state.wBatches : state.gBatches).find(x => x.id === bId);
                if (!b.penIsResidual) b.penIsResidual = Array(b.penDetails.length).fill(false); b.penIsResidual[pIdx] = document.getElementById('m-pen-residual')?.checked || false;
                if (!b.penIsSick) b.penIsSick = Array(b.penDetails.length).fill(false); b.penIsSick[pIdx] = false;
                
                const cStockDate = currentPenDate || (b.penDates && b.penDates[pIdx]) || b.weaningDate || b.date;
                
                if (accCount > 0) {
                    if (accCount > cnt) throw new Error("입력된 폐사/도태 두수가 현재 두수보다 많습니다.");
                    cnt -= accCount;
                    await db.collection(COLS.ACCIDENTS).add({ 
                        date: accDate, stage: stg, batchId: bId, penIndex: pIdx, count: accCount, type: 'death', timestamp: new Date().toISOString() 
                    });
                }

                if (shipCount > 0) {
                    if (shipCount > cnt) throw new Error("출하 두수가 부족합니다.");
                    if (shipDate > utils.getTodayStr()) {
                        await db.doc(`${COLS.GROWER}/batch_${bId}`).update({ 
                            pendingShipments: firebase.firestore.FieldValue.arrayUnion({ 
                                date: shipDate, total: shipCount, items: [{ pIdx, count: shipCount }] 
                            }) 
                        });
                    } else { 
                        cnt -= shipCount; 
                        await db.collection(COLS.SHIPMENTS).add({ 
                            date: shipDate, batchId: bId, penIndex: pIdx, count: shipCount, stockingDate: cStockDate || '', timestamp: new Date().toISOString() 
                        }); 
                    }
                }

                b.penDetails[pIdx] = cnt; 
                b.penDates[pIdx] = cnt > 0 ? currentPenDate : '';
                const pigs = b.penDetails.reduce((a,c)=>a+c,0); 
                await db.doc(`${stg==='weaning'?COLS.WEANING:COLS.GROWER}/batch_${bId}`).update({ 
                    penDetails: b.penDetails, penDates: b.penDates, penIsResidual: b.penIsResidual, penIsSick: b.penIsSick,
                    pigs, pens: b.penDetails.filter(c=>c>0).length, 
                    status: pigs>0?'active':'empty' 
                });
            },
            batch_settings: async () => { const stg = document.getElementById('m-stage').value, bId = parseInt(document.getElementById('m-batch').value); await db.doc(`${stg==='weaning'?COLS.WEANING:COLS.GROWER}/batch_${bId}`).update({ memo: document.getElementById('m-memo').value }); },
            transfer_pen: async () => {
                const srcStg = document.getElementById('m-src-stage').value, sbId = parseInt(document.getElementById('m-src-batch').value), spIdx = parseInt(document.getElementById('m-src-pen').value);
                const destStg = document.getElementById('m-dest-stage').value, dbId = parseInt(document.getElementById('m-dest-batch').value), dpIdx = parseInt(document.getElementById('m-dest-pen').value), cnt = parseInt(document.getElementById('m-count').value)||0;
                const src = (srcStg==='weaning'?state.wBatches:state.gBatches).find(b=>b.id===sbId), dest = (destStg==='weaning'?state.wBatches:state.gBatches).find(b=>b.id===dbId);
                
                let srcDate = src.penDates[spIdx] || (srcStg === 'weaning' ? src.date : src.weaningDate || src.date);
                let destDate = dest.penDates[dpIdx];
                let finalDate = '';
                
                if (!destDate) { finalDate = srcDate; } 
                else if (!srcDate) { finalDate = destDate; } 
                else { finalDate = srcDate < destDate ? srcDate : destDate; }
                
                src.penDetails[spIdx] -= cnt; 
                if(src.penDetails[spIdx]===0) { src.penDates[spIdx]=''; if(src.penIsResidual) src.penIsResidual[spIdx] = false; if(src.penIsSick) src.penIsSick[spIdx] = false; }
                
                dest.penDetails[dpIdx] += cnt; 
                dest.penDates[dpIdx] = finalDate;
                
                let updateDestPayload = { penDetails: dest.penDetails, penDates: dest.penDates, pigs: dest.penDetails.reduce((a,c)=>a+c,0), status: 'active' };
                if (destStg === 'grower') {
                    if (!dest.weaningDate || (finalDate && finalDate < dest.weaningDate)) {
                        updateDestPayload.weaningDate = finalDate || '';
                    }
                } else {
                    updateDestPayload.weaningDate = finalDate || '';
                }

                await db.doc(`${srcStg==='weaning'?COLS.WEANING:COLS.GROWER}/batch_${sbId}`).update({ penDetails: src.penDetails, penDates: src.penDates, penIsResidual: src.penIsResidual || Array(src.penDetails.length).fill(false), penIsSick: src.penIsSick || Array(src.penDetails.length).fill(false), pigs: src.penDetails.reduce((a,c)=>a+c,0), status: src.penDetails.some(v=>v>0)?'active':'empty' });
                await db.doc(`${destStg==='weaning'?COLS.WEANING:COLS.GROWER}/batch_${dbId}`).update(updateDestPayload);
            },
            shipment_detail_confirmed: async () => { const date = document.getElementById('m-ship-date').value, avgWeight = document.getElementById('m-ship-avg-weight').value, memo = document.getElementById('m-ship-memo').value; await db.doc(`${COLS.SHIPMENT_SUMMARIES}/${date}`).set({ avgWeight, memo, updatedAt: new Date().toISOString() }, { merge: true }); },
            shipment_detail_pending: async () => { const date = document.getElementById('m-ship-date').value, memo = document.getElementById('m-ship-memo').value; await db.doc(`${COLS.SHIPMENT_SUMMARIES}/${date}`).set({ memo, updatedAt: new Date().toISOString() }, { merge: true }); }
        };

        window.openModal = (type, target) => { const renderer = modalRenderers[type]; if (!renderer) return; const { title, html, hideSave } = renderer(target); document.getElementById('modal-title').innerHTML = title; document.getElementById('modal-content').innerHTML = html; document.getElementById('save-btn').style.display = hideSave ? 'none' : 'flex'; document.getElementById('save-btn').onclick = () => processSave(type); document.getElementById('modal-overlay').classList.remove('hidden'); setTimeout(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); }, 20); };
        window.closeModal = () => { document.getElementById('modal-overlay').classList.add('hidden'); };
        
        window.deleteShipment = async (docId, date) => {
            try {
                await db.collection(COLS.SHIPMENTS).doc(docId).delete();
                utils.showToast("기록 삭제 완료");
                const remaining = state.shipments.filter(s => s.date === date && s.dbId !== docId);
                if (remaining.length > 0) window.openModal('shipment_detail_confirmed', date); else window.closeModal();
            } catch (e) { utils.showToast("삭제 실패: " + e.message); }
        };

        window.cancelPendingShipment = async (batchId, shipmentObjEncoded) => {
            try {
                const shipmentObj = JSON.parse(decodeURIComponent(shipmentObjEncoded));
                await db.doc(`${COLS.GROWER}/batch_${batchId}`).update({ pendingShipments: firebase.firestore.FieldValue.arrayRemove(shipmentObj) });
                utils.showToast("예정 건이 취소되었습니다.");
                window.closeModal();
            } catch (e) { utils.showToast("취소 실패: " + e.message); }
        };

        window.deleteSow = async (dbId) => {
            try {
                await db.doc(`${COLS.SOWS}/${dbId}`).delete();
                utils.showToast("모돈 삭제 완료");
                window.closeModal();
            } catch (e) { utils.showToast("삭제 실패: " + e.message); }
        };

        window.filterSowList = (query) => {
            const lowerQuery = String(query).toLowerCase().trim();
            const cards = document.querySelectorAll('.sow-card-item, .sow-list-item');
            cards.forEach(card => {
                const sowNo = String(card.getAttribute('data-sow-no')).toLowerCase();
                if (sowNo.includes(lowerQuery)) {
                    card.style.display = '';
                } else {
                    card.style.display = 'none';
                }
            });
        };

        window.toggleDeleteConfirm = (docId) => {
            const btn = document.getElementById(`del-btn-${docId}`);
            const confirmBtn = document.getElementById(`confirm-btn-${docId}`);
            if (confirmBtn) {
                if (btn) btn.classList.add('hidden');
                confirmBtn.classList.remove('hidden');
            }
        };

        window.toggleSowDeleteConfirm = (dbId) => {
            const btn = document.getElementById(`sow-del-btn-${dbId}`);
            const confirmBtn = document.getElementById(`sow-confirm-btn-${dbId}`);
            if (confirmBtn) {
                if (btn) btn.classList.add('hidden');
                confirmBtn.classList.remove('hidden');
            }
        };

        window.toggleSowDetailDeleteConfirm = () => {
            const btn = document.getElementById('sow-del-btn-detail');
            const confirmBtn = document.getElementById('sow-confirm-btn-detail');
            if (btn && confirmBtn) {
                if (!btn.classList.contains('hidden')) {
                    btn.classList.add('hidden');
                    confirmBtn.classList.remove('hidden');
                } else {
                    btn.classList.remove('hidden');
                    confirmBtn.classList.add('hidden');
                }
            }
        };

        window.toggleBatchResetConfirm = () => {
            const btn = document.getElementById('batch-reset-btn-container');
            const confirmBtn = document.getElementById('batch-reset-confirm-container');
            if (btn && confirmBtn) {
                if (!btn.classList.contains('hidden')) {
                    btn.classList.add('hidden');
                    confirmBtn.classList.remove('hidden');
                } else {
                    btn.classList.remove('hidden');
                    confirmBtn.classList.add('hidden');
                }
            }
        };

        window.resetBatch = async (stg, bId) => {
            try {
                const isGrower = stg === 'grower';
                const emptyBatch = getEmptyBatch(bId, isGrower);
                const col = isGrower ? COLS.GROWER : COLS.WEANING;
                
                let updateData = {
                    status: emptyBatch.status,
                    date: emptyBatch.date,
                    pens: emptyBatch.pens,
                    pigs: emptyBatch.pigs,
                    memo: emptyBatch.memo,
                    penDetails: emptyBatch.penDetails,
                    penDates: emptyBatch.penDates,
                    penIsResidual: emptyBatch.penIsResidual,
                    penIsSick: emptyBatch.penIsSick
                };

                if (isGrower) {
                    updateData.sourceId = null;
                    updateData.weaningDate = '';
                    updateData.pendingShipments = [];
                }

                await db.doc(`${col}/batch_${bId}`).update(updateData);
                
                utils.showToast("배치 기록이 성공적으로 리셋되었습니다.");
                window.closeModal();
                if (isLocalEnv) renderAll();
            } catch (e) {
                console.error(e);
                utils.showToast("리셋 실패: " + e.message);
            }
        };

        window.startTransfer = (stg, bId, pIdx) => { 
            const transferCountInput = document.getElementById('m-transfer-count');
            const count = transferCountInput ? parseInt(transferCountInput.value) || 0 : 0;
            const maxCount = parseInt(document.getElementById('m-count').value) || 0;
            
            if (count <= 0) {
                utils.showToast("이동할 두수를 1마리 이상 입력하세요.");
                return;
            }
            if (count > maxCount) {
                utils.showToast("이동 두수가 현재 칸에 있는 두수보다 많습니다.");
                return;
            }

            window.closeModal(); 
            state.transfer = { active: true, src: { stage: stg, batchId: bId, penIndex: pIdx, count: count } }; 
            const msg = `<h2 class="text-base font-black text-rose-600 animate-pulse">도착할 칸을 터치하세요!</h2>`; 
            document.getElementById('weaning-header').innerHTML = msg; 
            document.getElementById('grower-header').innerHTML = msg; 
            renderGrower(); 
            renderWeaning(); 
        };
        
        window.quickSaveBatchMemo = async (stg, bId, memoVal) => {
            try {
                await db.doc(`${stg==='weaning'?COLS.WEANING:COLS.GROWER}/batch_${bId}`).update({ memo: memoVal });
                utils.showToast("메모가 저장되었습니다.", 1500);
            } catch(e) {
                utils.showToast("메모 저장 실패: " + e.message);
            }
        };

        async function processSave(type) { 
            const btn = document.getElementById('save-btn'); 
            btn.disabled = true; 
            btn.innerText = '저장 중...'; 
            try { 
                await saveActions[type](); 
                window.closeModal(); 
                if (!isLocalEnv) saveDailyHistory(); 
                if (isLocalEnv) renderAll(); 
            } catch (e) { 
                console.error(e);
                if (e.code === 'permission-denied' || (e.message && e.message.includes('permission'))) {
                    utils.showToast("저장 실패: 파이어베이스 Security Rules 권한이 없습니다.");
                } else {
                    utils.showToast("처리 실패: " + e.message); 
                }
            } finally { 
                btn.disabled = false; 
                btn.innerText = '확인 및 저장'; 
            } 
        }
        window.onload = init;
    </script>
</body>
</html>
